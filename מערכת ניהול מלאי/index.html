    :root {
      --bg: #0c0f14;
      --surface: #161b24;

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg); color: var(--text);
      min-height:100vh; min-height:100dvh; overflow-x:hidden;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes scaleIn { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    .app-input {
      width:100%; padding:12px 16px; background:var(--bg); border:1px solid var(--border);
      border-radius:12px; color:var(--text); font-size:15px; font-family:inherit;
      outline:none; direction:rtl; transition:border-color .2s;
    }
    .app-input:focus { border-color:var(--accent); }
    .app-input::placeholder { color:var(--text-muted); }

    .btn {
      border:none; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:500;
      cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center;
      gap:6px; transition:all .2s;
    }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-success { background:var(--success); color:#000; }
    .btn-ghost { background:transparent; color:var(--text-sec); border:1px solid var(--border); }

    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(8px);
      display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px;
      animation:fadeIn .15s ease;
    }
    .modal {
      background:var(--surface); border-radius:20px; padding:28px; width:100%; max-width:380px;
      border:1px solid var(--border); animation:scaleIn .2s ease;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .modal h3 { font-size:18px; font-weight:600; margin-bottom:4px; }

    .header {
      position:sticky; top:0; z-index:100; background:rgba(12,15,20,.92);
      backdrop-filter:blur(16px); border-bottom:1px solid var(--border);
      padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
    }

    .list-card {
      background:var(--card); border-radius:16px; padding:18px 20px;
      border:1px solid var(--border); cursor:pointer; transition:background .2s;
      display:flex; align-items:center; justify-content:space-between;
    }
    .list-card:active, .list-card:hover { background:var(--card-hover); }

    .item-card {
      background:var(--card); border-radius:16px; padding:16px 18px;
      border:1px solid var(--border); display:flex; align-items:center;
      justify-content:space-between;
    }

    .icon-btn {
      background:none; border:none; color:var(--text-sec); cursor:pointer;
      padding:6px; display:flex; align-items:center; justify-content:center;
    }

    .qty-btn {
      width:38px; height:38px; border-radius:10px; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:all .15s;
    }
    .qty-btn-add { background:var(--success-bg); border:1px solid rgba(52,211,153,.2); color:var(--success); }
    .qty-btn-sub { background:var(--danger-bg); border:1px solid rgba(255,92,92,.2); color:var(--danger); }

    .fab {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      width:60px; height:60px; border-radius:18px; background:var(--accent);
      border:none; color:#fff; cursor:pointer; display:flex; align-items:center;
      justify-content:center; box-shadow:0 8px 32px rgba(79,140,255,.4); z-index:90;
    }

    .toggle-group { display:flex; gap:8px; margin-bottom:20px; }
    .toggle-pill {
      flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
      background:transparent; color:var(--text-sec); cursor:pointer;
      font-family:inherit; font-size:14px; font-weight:500; transition:all .2s;
    }
    .toggle-pill.active-add { border-color:var(--success); background:var(--success-bg); color:var(--success); }
    .toggle-pill.active-sub { border-color:var(--danger); background:var(--danger-bg); color:var(--danger); }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .history-row { padding:10px 0; display:flex; justify-content:space-between; align-items:center; }
    .history-row + .history-row { border-top:1px solid var(--border); }
    .spinning { animation:spin .6s linear; }
    .shaking { animation:shake .5s ease; }
    .screen { animation:fadeIn .3s ease; }

    .tab-bar {
      display:flex; gap:4px; background:var(--surface); border-radius:12px; padding:4px;
      border:1px solid var(--border); margin-bottom:16px;
    }
    .tab-btn {
      flex:1; padding:10px; border-radius:10px; border:none; background:transparent;
      color:var(--text-sec); cursor:pointer; font-family:inherit; font-size:14px;
      font-weight:500; transition:all .2s;
    }
    .tab-btn.active { background:var(--accent); color:#fff; }

    .user-badge {
      display:inline-flex; align-items:center; gap:6px; padding:4px 12px 4px 8px;
      background:var(--accent-glow); border:1px solid rgba(79,140,255,.2);
      border-radius:20px; font-size:13px; color:var(--accent);
    }
  </style>

<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...children) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "className") e.className = v;
    else if (k === "innerHTML") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
};
const icon = (name, size = 20) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width", size); s.setAttribute("height", size);
  s.innerHTML = `<use href="#icon-${name}"/>`;
  return s;
};
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let FB = null;
let currentUser = null;
let unsubscribers = [];

function dbRef(path) { return FB.ref(FB.db, path); }
async function dbGet(path) { const s = await FB.get(dbRef(path)); return s.exists() ? s.val() : null; }
async function dbSet(path, value) { await FB.set(dbRef(path), value); }
async function dbRemove(path) { await FB.remove(dbRef(path)); }
function dbListen(path, cb) { const u = FB.onValue(dbRef(path), s => cb(s.exists()?s.val():null)); unsubscribers.push(u); return u; }
function render(s) { const a=$("#app"); a.innerHTML=""; a.appendChild(s); }
function cleanup() { unsubscribers.forEach(f=>f()); unsubscribers=[]; }

// ═══════════ AUTH ═══════════
function renderAuth() {
  cleanup();
  let mode = "login";
  const wrap = el("div",{className:"screen",style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px"}});
  const box = el("div",{style:{textAlign:"center",width:"100%",maxWidth:"340px"}});

  const iconWrap = el("div",{style:{width:"80px",height:"80px",borderRadius:"20px",background:"var(--accent-glow)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",border:"1px solid var(--border)"}});
  iconWrap.appendChild(icon("box",40));
  box.appendChild(iconWrap);
  box.appendChild(el("h1",{style:{fontSize:"26px",fontWeight:"600",marginBottom:"8px"}},"ניהול מלאי"));
  box.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"24px"}},"התחבר או צור חשבון חדש"));

  const tabs = el("div",{className:"tab-bar"});
  const loginTab = el("button",{className:"tab-btn active",onClick:()=>{
    mode="login"; loginTab.className="tab-btn active"; regTab.className="tab-btn";
    nameRow.style.display="none"; errMsg.textContent=""; actionBtn.textContent="התחבר";
  }},"התחברות");
  const regTab = el("button",{className:"tab-btn",onClick:()=>{
    mode="register"; regTab.className="tab-btn active"; loginTab.className="tab-btn";
    nameRow.style.display="block"; errMsg.textContent=""; actionBtn.textContent="צור חשבון";
  }},"הרשמה");
  tabs.append(loginTab,regTab);
  box.appendChild(tabs);

  const nameRow = el("div",{style:{display:"none",marginBottom:"12px"}});
  nameRow.appendChild(el("input",{className:"app-input",placeholder:"שם תצוגה (למשל: יוסף)",id:"nameInput"}));
  const userInput = el("input",{className:"app-input",placeholder:"שם משתמש",style:{marginBottom:"12px"},autocapitalize:"off",autocorrect:"off"});
  const passInput = el("input",{type:"password",className:"app-input",placeholder:"סיסמה"});
  const errMsg = el("p",{style:{color:"var(--danger)",fontSize:"13px",marginTop:"10px",minHeight:"20px"}});

  const actionBtn = el("button",{className:"btn btn-primary",style:{width:"100%",marginTop:"16px",height:"48px"},
    onClick: async()=>{
      const username=userInput.value.trim().toLowerCase();
      const password=passInput.value;
      if(!username||!password){errMsg.textContent="יש למלא שם משתמש וסיסמה";return;}
      if(username.length<2){errMsg.textContent="שם משתמש חייב להיות לפחות 2 תווים";return;}
      if(password.length<4){errMsg.textContent="סיסמה חייבת להיות לפחות 4 תווים";return;}
      actionBtn.disabled=true; actionBtn.textContent="..."; errMsg.textContent="";
      try{
        const userData=await dbGet(`users/${username}`);
        if(mode==="register"){
          if(userData){errMsg.textContent="שם משתמש כבר תפוס";actionBtn.disabled=false;actionBtn.textContent="צור חשבון";return;}
          const displayName=document.getElementById("nameInput").value.trim()||username;
          await dbSet(`users/${username}`,{password,displayName,createdAt:new Date().toISOString()});
          currentUser={username,displayName};
          localStorage.setItem("inv_user",JSON.stringify(currentUser));
          renderHome();
        } else {
          if(!userData||userData.password!==password){
            errMsg.textContent="שם משתמש או סיסמה שגויים";actionBtn.disabled=false;actionBtn.textContent="התחבר";
            box.classList.add("shaking");setTimeout(()=>box.classList.remove("shaking"),500);return;
          }
          currentUser={username,displayName:userData.displayName||username};
          localStorage.setItem("inv_user",JSON.stringify(currentUser));
          renderHome();
        }
      }catch(e){errMsg.textContent="שגיאה בחיבור — נסה שוב";actionBtn.disabled=false;actionBtn.textContent=mode==="login"?"התחבר":"צור חשבון";}
    }
  },"התחבר");

  passInput.addEventListener("keydown",e=>{if(e.key==="Enter")actionBtn.click();});
  box.append(nameRow,userInput,passInput,errMsg,actionBtn);
  wrap.appendChild(box);
  render(wrap);
  userInput.focus();
}

// ═══════════ HOME ═══════════
function renderHome() {
  cleanup();
  const wrap = el("div",{className:"screen",style:{minHeight:"100vh",paddingBottom:"100px"}});

  const header = el("div",{className:"header"});
  const headerR = el("div");
  headerR.appendChild(el("h1",{style:{fontSize:"24px",fontWeight:"700"}},"ניהול מלאי"));
  const badge = el("div",{className:"user-badge",style:{marginTop:"4px"}});
  badge.appendChild(icon("user",14));
  badge.appendChild(document.createTextNode(currentUser.displayName));
  headerR.appendChild(badge);

  const headerL = el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
  const refBtn = el("button",{className:"icon-btn",onClick:()=>{refBtn.classList.add("spinning");setTimeout(()=>refBtn.classList.remove("spinning"),600);}});
  refBtn.appendChild(icon("refresh",18));
  const setBtn = el("button",{className:"icon-btn",onClick:()=>showSettingsModal(wrap)});
  setBtn.appendChild(icon("settings",20));
  headerL.append(refBtn,setBtn);
  header.append(headerR,headerL);
  wrap.appendChild(header);

  const content = el("div",{style:{padding:"16px 16px 0"}});
  wrap.appendChild(content);

  const fab = el("button",{className:"fab",onClick:()=>showNewListModal(wrap)});
  fab.appendChild(icon("plus",24));
  wrap.appendChild(fab);

  dbListen(`inventory/${currentUser.username}/lists`, data=>renderListCards(content,data||{}));
  render(wrap);
}

function renderListCards(c, lists) {
  c.innerHTML="";
  const entries=Object.entries(lists);
  if(entries.length===0){
    const empty=el("div",{className:"empty-state"});
    empty.appendChild(icon("box",40));
    empty.appendChild(el("p",{style:{marginTop:"16px",fontSize:"16px"}},"אין מחסנים עדיין"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"4px"}},"לחץ על + כדי ליצור מחסן"));
    c.appendChild(empty); return;
  }
  entries.forEach(([id,list],i)=>{
    const items=list.items?Object.values(list.items):[];
    const total=items.reduce((s,it)=>s+(it.quantity||0),0);
    const card=el("div",{className:"list-card",style:{marginBottom:"10px",animation:`fadeIn .3s ease ${i*.05}s both`},onClick:()=>renderListDetail(id)});
    const info=el("div");
    info.appendChild(el("h3",{style:{fontSize:"17px",fontWeight:"600",marginBottom:"4px"}},list.name));
    if(list.sharedFrom)info.appendChild(el("div",{style:{fontSize:"11px",color:"var(--warning)",marginBottom:"4px"}},`שותף ע״י ${list.sharedFrom}`));
    const meta=el("div",{style:{display:"flex",gap:"12px",alignItems:"center"}});
    meta.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)"}},`${items.length} פריטים`));
    meta.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-muted)"}},`סה״כ: ${total}`));
    info.appendChild(meta);
    const actions=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
    const shBtn=el("button",{className:"icon-btn",onClick:e=>{e.stopPropagation();showShareModal(document.querySelector(".screen"),id,list);}});
    shBtn.appendChild(icon("share",18));
    const dlBtn=el("button",{className:"icon-btn",onClick:e=>{e.stopPropagation();showDeleteModal(document.querySelector(".screen"),`למחוק את "${list.name}"?`,()=>dbRemove(`inventory/${currentUser.username}/lists/${id}`));}});
    dlBtn.appendChild(icon("trash",18));
    const arrow=icon("forward",18); arrow.style.color="var(--text-muted)";
    actions.append(shBtn,dlBtn,arrow);
    card.append(info,actions);
    c.appendChild(card);
  });
}

// ═══════════ LIST DETAIL ═══════════
function renderListDetail(listId) {
  cleanup();
  const bp=`inventory/${currentUser.username}/lists/${listId}`;
  const wrap=el("div",{className:"screen",style:{minHeight:"100vh",paddingBottom:"100px"}});

  const header=el("div",{className:"header"});
  const headerR=el("div",{style:{display:"flex",alignItems:"center",gap:"12px"}});
  const backBtn=el("button",{className:"icon-btn",style:{color:"var(--accent)"},onClick:()=>renderHome()});
  backBtn.appendChild(icon("back",22));
  const hInfo=el("div");
  const titleEl=el("h1",{style:{fontSize:"20px",fontWeight:"600"}});
  const countEl=el("span",{style:{fontSize:"12px",color:"var(--text-muted)"}});
  hInfo.append(titleEl,countEl);
  headerR.append(backBtn,hInfo);

  const headerL=el("div",{style:{display:"flex",gap:"8px"}});
  const refBtn=el("button",{className:"icon-btn",onClick:()=>{refBtn.classList.add("spinning");setTimeout(()=>refBtn.classList.remove("spinning"),600);}});
  refBtn.appendChild(icon("refresh",18));
  headerL.appendChild(refBtn);
  header.append(headerR,headerL);
  wrap.appendChild(header);

  const content=el("div",{style:{padding:"16px 16px 0"}});
  wrap.appendChild(content);

  const fab=el("button",{className:"fab",onClick:()=>showNewItemModal(wrap,bp)});
  fab.appendChild(icon("plus",24));
  wrap.appendChild(fab);

  dbListen(bp,data=>{
    if(!data){renderHome();return;}
    titleEl.textContent=data.name;
    const items=data.items?Object.entries(data.items):[];
    countEl.textContent=`${items.length} פריטים`;
    renderItems(content,bp,items,wrap);
  });
  render(wrap);
}

function renderItems(c,bp,items,wrap) {
  c.innerHTML="";
  if(items.length===0){
    const empty=el("div",{className:"empty-state"});
    empty.appendChild(icon("box",40));
    empty.appendChild(el("p",{style:{marginTop:"16px",fontSize:"15px"}},"אין פריטים עדיין"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"4px"}},"לחץ על + כדי להוסיף פריט"));
    c.appendChild(empty);return;
  }
  items.forEach(([itemId,item],i)=>{
    const card=el("div",{className:"item-card",style:{marginBottom:"8px",animation:`fadeIn .3s ease ${i*.05}s both`}});
    const info=el("div",{style:{flex:"1",minWidth:"0"}});
    info.appendChild(el("div",{style:{fontSize:"16px",fontWeight:"500",marginBottom:"2px"}},item.name));
    const qr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginTop:"4px"}});
    qr.appendChild(el("span",{style:{fontSize:"24px",fontWeight:"700",fontVariantNumeric:"tabular-nums",color:item.quantity===0?"var(--danger)":"var(--accent)"}},String(item.quantity||0)));
    qr.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-muted)"}},"יחידות"));
    info.appendChild(qr);

    const actions=el("div",{style:{display:"flex",gap:"6px",alignItems:"center"}});
    const hBtn=el("button",{className:"icon-btn",style:{color:"var(--text-muted)"},onClick:()=>showHistoryModal(wrap,item)});
    hBtn.appendChild(icon("history",18));
    const sBtn=el("button",{className:"qty-btn qty-btn-sub",onClick:()=>showAdjustModal(wrap,bp,itemId,item,"remove")});
    sBtn.appendChild(icon("minus",20));
    const aBtn=el("button",{className:"qty-btn qty-btn-add",onClick:()=>showAdjustModal(wrap,bp,itemId,item,"add")});
    aBtn.appendChild(icon("plus",20));
    const dBtn=el("button",{className:"icon-btn",style:{color:"var(--text-muted)"},onClick:()=>showDeleteModal(wrap,`למחוק את "${item.name}"?`,()=>dbRemove(`${bp}/items/${itemId}`))});
    dBtn.appendChild(icon("trash",18));
    actions.append(hBtn,sBtn,aBtn,dBtn);
    card.append(info,actions);
    c.appendChild(card);
  });
}

// ═══════════ MODALS ═══════════
function showModal(parent,builder){
  const ov=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===ov)ov.remove();}});
  const m=el("div",{className:"modal"});
  builder(m,()=>ov.remove());
  ov.appendChild(m);parent.appendChild(ov);return ov;
}

function showNewListModal(parent){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"16px"}},"מחסן חדש"));
    const inp=el("input",{className:"app-input",placeholder:'שם המחסן (למשל: "מחסן עודפים")'});
    m.appendChild(inp);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const cb=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      if(!inp.value.trim())return; cb.disabled=true;
      await dbSet(`inventory/${currentUser.username}/lists/${genId()}`,{name:inp.value.trim(),createdAt:new Date().toISOString()});
      close();
    }},"צור מחסן");
    btns.appendChild(cb); m.appendChild(btns);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")cb.click();});
    setTimeout(()=>inp.focus(),100);
  });
}

function showNewItemModal(parent,bp){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"16px"}},"פריט חדש"));
    const ni=el("input",{className:"app-input",placeholder:"שם הפריט (למשל: חולצה)",style:{marginBottom:"12px"}});
    const qi=el("input",{className:"app-input",placeholder:"כמות התחלתית (ברירת מחדל: 0)",type:"number",inputMode:"numeric"});
    m.append(ni,qi);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const ab=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      if(!ni.value.trim())return; ab.disabled=true;
      const qty=parseInt(qi.value)||0;
      await dbSet(`${bp}/items/${genId()}`,{name:ni.value.trim(),quantity:qty,
        history:{[genId()]:{action:"נוצר",amount:qty,by:currentUser.displayName,date:new Date().toISOString()}}});
      close();
    }},"הוסף פריט");
    btns.appendChild(ab); m.appendChild(btns);
    ni.addEventListener("keydown",e=>{if(e.key==="Enter")qi.focus();});
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click();});
    setTimeout(()=>ni.focus(),100);
  });
}

function showAdjustModal(parent,bp,itemId,item,mode){
  showModal(parent,(m,close)=>{
    let cm=mode;
    m.appendChild(el("h3",{},cm==="add"?"הוסף כמות":"הורד כמות"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"20px"}},`${item.name} — כרגע: ${item.quantity||0}`));
    const tg=el("div",{className:"toggle-group"});
    const ap=el("button",{className:`toggle-pill ${cm==="add"?"active-add":""}`,onClick:()=>{cm="add";ap.className="toggle-pill active-add";sp.className="toggle-pill";up();}},"הוספה +");
    const sp=el("button",{className:`toggle-pill ${cm==="remove"?"active-sub":""}`,onClick:()=>{cm="remove";sp.className="toggle-pill active-sub";ap.className="toggle-pill";up();}},"הורדה −");
    tg.append(ap,sp); m.appendChild(tg);
    const qi=el("input",{className:"app-input",type:"number",inputMode:"numeric",placeholder:"הכנס כמות"});
    m.appendChild(qi);
    const pv=el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginTop:"10px",textAlign:"center",minHeight:"20px"}});
    m.appendChild(pv);
    function up(){const a=parseInt(qi.value);if(!a||a<=0){pv.textContent="";return;}const c=item.quantity||0;const r=cm==="add"?c+a:Math.max(0,c-a);pv.innerHTML=`${c} ${cm==="add"?"+":"−"} ${a} = <span style="color:var(--accent);font-weight:600">${r}</span>`;}
    qi.addEventListener("input",up);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const ab=el("button",{className:`btn ${cm==="add"?"btn-success":"btn-danger"}`,style:{flex:"1"},onClick:async()=>{
      const a=parseInt(qi.value);if(!a||a<=0)return;ab.disabled=true;
      const c=item.quantity||0;const nq=cm==="add"?c+a:Math.max(0,c-a);
      await dbSet(`${bp}/items/${itemId}/quantity`,nq);
      await dbSet(`${bp}/items/${itemId}/history/${genId()}`,{action:cm==="add"?"הוספה":"הורדה",amount:a,result:nq,by:currentUser.displayName,date:new Date().toISOString()});
      close();
    }},cm==="add"?"הוסף":"הורד");
    btns.appendChild(ab); m.appendChild(btns);
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click();});
    setTimeout(()=>qi.focus(),100);
  });
}

function showHistoryModal(parent,item){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{},"היסטוריה"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},item.name));
    const hc=el("div",{style:{maxHeight:"300px",overflowY:"auto"}});
    const hist=item.history?Object.values(item.history).sort((a,b)=>new Date(b.date)-new Date(a.date)):[];
    if(hist.length===0){hc.appendChild(el("p",{style:{color:"var(--text-muted)",fontSize:"14px",textAlign:"center",padding:"20px"}},"אין היסטוריה"));}
    else hist.forEach(h=>{
      const row=el("div",{className:"history-row"});
      const left=el("div");
      const col=h.action==="הוספה"?"var(--success)":h.action==="הורדה"?"var(--danger)":"var(--accent)";
      left.appendChild(el("span",{style:{fontSize:"13px",fontWeight:"500",color:col}},h.action));
      left.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)",marginRight:"6px"}},` ${h.amount} יח׳`));
      if(h.result!==undefined)left.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-muted)"}},` → ${h.result}`));
      if(h.by)left.appendChild(el("span",{style:{fontSize:"11px",color:"var(--text-muted)",marginRight:"6px"}},` (${h.by})`));
      const d=new Date(h.date);
      const right=el("span",{style:{fontSize:"11px",color:"var(--text-muted)",direction:"ltr",whiteSpace:"nowrap"}},d.toLocaleDateString("he-IL")+" "+d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}));
      row.append(left,right);hc.appendChild(row);
    });
    m.appendChild(hc);
    m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%",marginTop:"16px"},onClick:close},"סגור"));
  });
}

function showDeleteModal(parent,msg,onConfirm){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"8px"}},"מחיקה"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"20px"}},msg));
    const btns=el("div",{style:{display:"flex",gap:"8px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    btns.appendChild(el("button",{className:"btn btn-danger",style:{flex:"1"},onClick:async()=>{await onConfirm();close();}},"מחק"));
    m.appendChild(btns);
  });
}

function showShareModal(parent,listId,list){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"שיתוף מחסן"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"20px"}},`שתף את "${list.name}" עם משתמש אחר`));
    const ui=el("input",{className:"app-input",placeholder:"שם משתמש לשיתוף",autocapitalize:"off"});
    m.appendChild(ui);
    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",marginTop:"8px",minHeight:"20px"}});
    const suc=el("p",{style:{color:"var(--success)",fontSize:"13px",marginTop:"8px",minHeight:"20px"}});
    m.append(err,suc);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"סגור"));
    const sb=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const target=ui.value.trim().toLowerCase();
      if(!target)return;
      if(target===currentUser.username){err.textContent="אי אפשר לשתף עם עצמך";return;}
      sb.disabled=true;err.textContent="";suc.textContent="";
      const tu=await dbGet(`users/${target}`);
      if(!tu){err.textContent="משתמש לא נמצא";sb.disabled=false;return;}
      const fullList=await dbGet(`inventory/${currentUser.username}/lists/${listId}`);
      await dbSet(`inventory/${target}/lists/${genId()}`,{...fullList,name:fullList.name,sharedFrom:currentUser.displayName,sharedAt:new Date().toISOString()});
      suc.textContent=`שותף בהצלחה עם ${tu.displayName||target}!`;
      ui.value="";sb.disabled=false;
    }},"שתף");
    btns.appendChild(sb);m.appendChild(btns);
    ui.addEventListener("keydown",e=>{if(e.key==="Enter")sb.click();});
    setTimeout(()=>ui.focus(),100);
  });
}

function showSettingsModal(parent){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"20px"}},"הגדרות"));
    const uc=el("div",{style:{padding:"14px 16px",background:"var(--bg)",borderRadius:"12px",border:"1px solid var(--border)",marginBottom:"12px"}});
    uc.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"500",marginBottom:"4px"}},"חשבון"));
    uc.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-sec)"}},`שם: ${currentUser.displayName}`));
    uc.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-sec)"}},`משתמש: ${currentUser.username}`));
    m.appendChild(uc);

    const sc=el("div",{style:{padding:"14px 16px",background:"var(--bg)",borderRadius:"12px",border:"1px solid var(--border)",marginBottom:"12px"}});
    sc.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"500",marginBottom:"4px"}},"שיתוף"));
    sc.appendChild(el("div",{style:{fontSize:"12px",color:"var(--text-sec)"}},"כדי לשתף מחסן עם מישהו — הוא צריך קודם ליצור חשבון. אחר כך לחץ על כפתור השיתוף ליד המחסן והכנס את שם המשתמש שלו."));
    m.appendChild(sc);

    m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%",marginTop:"8px",color:"var(--danger)",borderColor:"rgba(255,92,92,.3)"},
      onClick:()=>{currentUser=null;localStorage.removeItem("inv_user");close();renderAuth();}},"התנתק"));
    m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%",marginTop:"12px"},onClick:close},"סגור"));
  });
}

// ═══════════ INIT ═══════════
function init(){
  if(window.FB){FB=window.FB;startApp();}
  else window.addEventListener("firebase-ready",()=>{FB=window.FB;startApp();});
}
function startApp(){
  try{const s=localStorage.getItem("inv_user");if(s){currentUser=JSON.parse(s);renderHome();return;}}catch{}
  renderAuth();
}
init();
</script>
</body>
</html>
