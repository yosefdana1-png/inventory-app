    const qrActions=el("div",{style:{display:"flex",gap:"6px",marginTop:"8px",justifyContent:"center"}});
    const copyLinkBtn=el("button",{className:"toolbar-btn",onClick:async()=>{

    }},"העתק קישור");
    const shareLinkBtn=el("button",{className:"toolbar-btn",onClick:async()=>{
      if(navigator.share){try{await navigator.share({text:`הצטרף למחסן "${wh.name}" באפליקציית ניהול מלאי:\n${qrWrap.dataset.url}`})}catch(e){}}
      else copyLinkBtn.click();
    }},"שתף");
    const isAdminInWh=wh.owner===currentUser.username||(wh.roles&&wh.roles[currentUser.username]==='admin');
    const canRenewCode=isAdminInWh||!(wh.permissions&&wh.permissions.restrict_code_renew);
    const renewBtn=el("button",{className:"toolbar-btn danger-hover",style:{display:canRenewCode?"":"none"},onClick:async()=>{

      if(target===currentUser.username){err.textContent="אי אפשר לשתף עם עצמך";return}
      if(members.includes(target)){err.textContent="כבר חבר במחסן";return}
      if(wh.invites&&wh.invites[target]){err.textContent="כבר נשלחה הזמנה";return}
      sb.disabled=true;err.textContent="";suc.textContent="";
      let tu=null;try{tu=await dbGet(`usernames/${target}`)}catch(e){}
      if(!tu){err.textContent="משתמש לא נמצא";sb.disabled=false;return}

    }},"הזמן");btns.appendChild(sb);m.appendChild(btns);
    ui.addEventListener("keydown",e=>{if(e.key==="Enter")sb.click()});setTimeout(()=>ui.focus(),100);
  });

function showCopyWarehouseModal(parent,whId,wh){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"שלח עותק מחסן"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"13px",marginBottom:"16px"}},`שלח עותק של "${wh.name}" למשתמש אחר — המחסן שלך לא ישתנה.`));
    const inp=el("input",{className:"app-input",placeholder:"שם משתמש",autocapitalize:"off",style:{marginBottom:"8px"}});
    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"20px"}});
    const suc=el("p",{style:{color:"var(--text-sec)",fontSize:"13px",minHeight:"20px"}});
    m.append(inp,err,suc);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const sendBtn=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const target=inp.value.trim().toLowerCase();if(!target)return;
      if(target===currentUser.username){err.textContent="אי אפשר לשלוח לעצמך";return}
      sendBtn.disabled=true;err.textContent="";suc.textContent="";
      let tu=null;try{tu=await dbGet(`usernames/${target}`)}catch(e){}
      if(!tu){err.textContent="משתמש לא נמצא";sendBtn.disabled=false;return}
      sendBtn.textContent="שולח...";
      const newWhId=genId();
      const newItems={};
      if(wh.items){
        for(const[oldId,item]of Object.entries(wh.items)){
          const newId=genId();
          const ni={name:item.name,quantity:item.quantity||0,order:item.order||0,
            history:{[genId()]:{action:"יובא",amount:item.quantity||0,by:currentUser.displayName,date:new Date().toISOString()}}};
          if(item.note)ni.note=item.note;
          if(item.sku)ni.sku=item.sku;
          if(item.thumb)ni.thumb=item.thumb;
          // The full-res image rides along INLINE (the legacy image field): the
          // rules don't let the sender write into the recipient's itemImages/,
          // but the recipient's own app migrates inline images out to
          // itemImages/ automatically the first time they open the warehouse.
          try{
            const full=item.image||await dbGet(`itemImages/${whId}/${oldId}`);
            if(full)ni.image=full;
          }catch(e){}
          newItems[newId]=ni;
        }
      }
      const newWh={name:wh.name,owner:target,members:{[target]:true},createdAt:new Date().toISOString()};
      if(Object.keys(newItems).length>0)newWh.items=newItems;
      await dbSet(`warehouses/${newWhId}`,newWh);
      await dbSet(`users/${target}/warehouses/${newWhId}`,Date.now());
      suc.textContent=`עותק נשלח ל-${target}!`;
      inp.value="";sendBtn.disabled=false;sendBtn.textContent="שלח";
    }},"שלח");
    btns.appendChild(sendBtn);m.appendChild(btns);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")sendBtn.click()});
    setTimeout(()=>inp.focus(),100);
  });
}

function showExportModal(parent,whId,items){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"יצוא רשימה"));

    }).join("\n");

    const ta=el("textarea",{className:"app-input",rows:"8",style:{direction:"rtl",lineHeight:"1.8",fontSize:"16px"},readonly:"true"});
    ta.value=text;
    m.appendChild(ta);

    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"סגור"));

    const copyBtn=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      try{
        await navigator.clipboard.writeText(text);
        copyBtn.textContent="הועתק!";copyBtn.style.borderColor="var(--accent-line)";
        setTimeout(()=>{copyBtn.textContent="העתק";copyBtn.style.background="var(--accent)"},1500);
      }catch(e){
        ta.select();document.execCommand("copy");
        copyBtn.textContent="הועתק!";copyBtn.style.borderColor="var(--accent-line)";
        setTimeout(()=>{copyBtn.textContent="העתק";copyBtn.style.background="var(--accent)"},1500);
      }
    }},"העתק");

    const shareBtn=el("button",{className:"btn btn-success",style:{flex:"1"},onClick:async()=>{
      if(navigator.share){
        try{await navigator.share({text:text})}catch(e){}
      }else{
        ta.select();document.execCommand("copy");
        shareBtn.textContent="הועתק!";setTimeout(()=>{shareBtn.textContent="שתף"},1500);
      }
    }},"שתף");

    btns.append(copyBtn,shareBtn);m.appendChild(btns);
  });
}

// Parses free-form pasted/typed text (or a loaded CSV/TXT file) into item rows.
// Supports: CSV "שם,כמות,מקט" | "שם (5)" | "שם - 5" | "שם: 5" | "5 שם" | "5x שם" | plain name only.
function parseImportText(text){
  return text.split(/\r?\n/)
    .map(l=>l.trim())
    .filter(l=>l)
    .map(line=>{
      line=line.replace(/^(?:[-*•]|\d+[.)])\s+/,"");
      let name=line,quantity=0,sku="";
      if(line.includes(",")){
        // CSV: name, quantity, sku, low-stock threshold. Any column after the
        // name may be empty — an empty quantity leaves an existing item's
        // quantity untouched (handy for a "thresholds only" file).
        const parts=line.split(",").map(p=>p.trim());
        if(parts.length>=2&&(/^\d+$/.test(parts[1])||(parts[1]===""&&parts.length>=3))){
          name=parts[0];quantity=parts[1]===""?null:parseInt(parts[1]);
          if(parts[2])sku=parts[2];
          const low=parts[3]&&/^\d+$/.test(parts[3])?parseInt(parts[3]):null;
          return {name,quantity,sku,low};
        }
        // A header row ("שם, כמות, ...") is skipped.
        if(parts.length>=2&&/כמות|qty|quantity/i.test(parts[1]))return {name:""};
      }
      const skuM=line.match(/\|\s*(?:מק"?ט|sku)\s*:?\s*(.+)$/i);
      if(skuM){sku=skuM[1].trim();line=line.slice(0,skuM.index).trim()}
      let m=line.match(/^(.+?)\s*\((\d+)\)\s*$/);
      if(m){name=m[1].trim();quantity=parseInt(m[2]);return {name,quantity,sku}}
      m=line.match(/^(.+?)[\s\-–:]+(\d+)\s*$/);
      if(m&&m[1].trim()){name=m[1].trim();quantity=parseInt(m[2]);return {name,quantity,sku}}
      m=line.match(/^(\d+)\s*[xX×]?\s+(.+)$/);
      if(m){quantity=parseInt(m[1]);name=m[2].trim();return {name,quantity,sku}}
      name=line.trim();
      return {name,quantity,sku};
    })
    .filter(it=>it.name);
}

function showImportModal(parent,whId){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"ייבוא פריטים"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"13px",marginBottom:"4px"}},'הדבק רשימה (למשל מוואטסאפ) או בחר קובץ CSV/טקסט — שורה אחת לכל פריט.'));
    m.appendChild(el("p",{style:{color:"var(--text-muted)",fontSize:"13px",marginBottom:"12px",lineHeight:"1.5"}},'בקובץ CSV: שם, כמות, מק"ט, סף מלאי נמוך. אפשר להשאיר עמודות ריקות — למשל "טונה, , , 8" מעדכן רק את הסף.'));

    const fileRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"10px"}});
    const fileBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"}},"בחר קובץ");
    const fileInput=el("input",{type:"file",accept:".csv,.txt,text/csv,text/plain",style:{display:"none"}});
    fileBtn.onclick=()=>fileInput.click();
    fileInput.addEventListener("change",()=>{
      const f=fileInput.files[0];if(!f)return;
      const reader=new FileReader();
      reader.onload=()=>{ta.value=reader.result};
      reader.readAsText(f,"UTF-8");
    });
    fileRow.append(fileBtn,fileInput);
    m.appendChild(fileRow);

    const ta=el("textarea",{className:"app-input",rows:"6",placeholder:"לדוגמה:\nחולצה (5)\nמכנס - 3\n2 כובעים",style:{direction:"rtl",lineHeight:"1.7",fontSize:"13px",marginBottom:"12px"}});
    m.appendChild(ta);

    const previewWrap=el("div",{style:{display:"none",marginBottom:"10px",maxHeight:"300px",overflowY:"auto"}});
    m.appendChild(previewWrap);

    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"18px"}});
    m.appendChild(err);

    let mode="edit";
    let parsedRows=[];
    let updMode="replace"; // what to do with quantities of EXISTING items: replace | add
    const byName=new Map(); // normalized item name -> existing item id (this warehouse)

    const matchCounts=()=>{
      const rows=parsedRows.filter(r=>r.name&&r.name.trim());
      const upd=rows.filter(r=>r.existingId).length;
      return {upd,neu:rows.length-upd};
    };
    const refreshMainLabel=()=>{
      const{upd,neu}=matchCounts();
      mainBtn.textContent=upd?`ייבא: ${neu} חדשים, ${upd} עדכונים`:`ייבא ${neu} פריטים`;
    };

    function renderPreview(){
      previewWrap.innerHTML="";
      // Imported names are matched against the warehouse's existing items —
      // matches UPDATE the item instead of creating a duplicate.
      const{upd}=matchCounts();
      if(upd>0){
        const bar=el("div",{style:{marginBottom:"10px"}});
        bar.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"6px"}},"פריטים קיימים — מה לעשות עם הכמות?"));
        const opts=el("div",{style:{display:"flex",gap:"6px"}});
        const mk=(val,label)=>el("button",{className:"toolbar-btn"+(updMode===val?" active":""),onClick:()=>{updMode=val;renderPreview()}},label);
        opts.append(mk("replace","עדכן לכמות שבייבוא"),mk("add","הוסף לכמות הקיימת"));
        bar.appendChild(opts);
        previewWrap.appendChild(bar);
      }
      parsedRows.forEach((row,idx)=>{
        const rowEl=el("div",{style:{display:"flex",gap:"6px",marginBottom:"6px",alignItems:"center"}});
        const badge=el("span",{style:{fontSize:"13px",padding:"3px 8px",borderRadius:"8px",flexShrink:"0",fontWeight:"600",whiteSpace:"nowrap"}});
        const paintBadge=()=>{
          if(row.existingId){badge.textContent="עדכון";badge.style.background="transparent";badge.style.color="var(--text-sec)";badge.style.border="1px solid var(--border)"}
          else{badge.textContent="חדש";badge.style.background="transparent";badge.style.color="var(--accent)";badge.style.border="1px solid var(--accent-line)"}
        };
        paintBadge();
        const nameI=el("input",{className:"app-input",style:{flex:"3",padding:"8px 10px",fontSize:"13px"}});
        nameI.value=row.name;
        nameI.addEventListener("input",()=>{
          row.name=nameI.value;
          // Re-match live: editing a name in the preview can turn an update
          // into a new item and vice versa.
          const ex=byName.get(row.name.trim().toLowerCase())||null;
          if(ex!==row.existingId){row.existingId=ex;paintBadge();refreshMainLabel()}
        });
        const qtyI=el("input",{className:"app-input",type:"number",inputMode:"numeric",placeholder:row.existingId?"ללא שינוי":"0",title:"כמות",style:{flex:"1",padding:"8px 10px",fontSize:"13px"}});
        qtyI.value=row.quantity===null||row.quantity===undefined?"":row.quantity;
        qtyI.addEventListener("input",()=>{row.quantity=qtyI.value===""?null:(parseInt(qtyI.value)||0)});
        const lowI=el("input",{className:"app-input",type:"number",inputMode:"numeric",placeholder:"סף",title:"סף מלאי נמוך",style:{flex:"1",padding:"8px 10px",fontSize:"13px"}});
        lowI.value=row.low||"";
        lowI.addEventListener("input",()=>{row.low=parseInt(lowI.value)>0?parseInt(lowI.value):null});
        const rmBtn=el("button",{className:"toolbar-btn danger-hover",style:{padding:"6px",flex:"0 0 auto"}});
        rmBtn.appendChild(icon("close",12));
        rmBtn.onclick=()=>{parsedRows.splice(idx,1);renderPreview();refreshMainLabel()};
        rowEl.append(badge,nameI,qtyI,lowI,rmBtn);
        previewWrap.appendChild(rowEl);
      });
    }

    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"8px"}});
    const cancelBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול");
    const mainBtn=el("button",{className:"btn btn-primary",style:{flex:"1"}},"המשך");
    mainBtn.onclick=async()=>{
      err.textContent="";
      if(mode==="edit"){
        parsedRows=parseImportText(ta.value).filter(r=>r.name);
        if(!parsedRows.length){err.textContent="לא נמצאו פריטים לייבוא";return}
        byName.clear();
        currentItems.forEach(([id,item])=>{
          const k=(item.name||"").trim().toLowerCase();
          if(k&&!byName.has(k))byName.set(k,id);
        });
        parsedRows.forEach(r=>{r.existingId=byName.get(r.name.trim().toLowerCase())||null});
        renderPreview();
        mode="preview";
        ta.style.display="none";fileRow.style.display="none";
        previewWrap.style.display="";
        refreshMainLabel();
      }else{
        const rows=parsedRows.filter(r=>r.name&&r.name.trim());
        if(!rows.length){err.textContent="אין פריטים תקינים";return}
        mainBtn.disabled=true;mainBtn.textContent="מייבא...";
        try{
          const updates={};
          const base=Date.now(); // see the new-item comment: timestamp order
          let newCount=0;
          rows.forEach(r=>{
            const noQty=r.quantity===null||r.quantity===undefined;
            const qty=r.quantity||0;
            if(r.existingId){
              const id=r.existingId;
              const entry=currentItems.find(([eid])=>eid===id);
              const curQ=entry?(entry[1].quantity||0):0;
              if(r.sku&&r.sku.trim())updates[`items/${id}/sku`]=r.sku.trim();
              if(r.low>0)updates[`items/${id}/lowStock`]=r.low;
              if(noQty){}else if(updMode==="add"){
                if(qty>0){
                  updates[`items/${id}/quantity`]=FB.increment(qty);
                  updates[`items/${id}/history/${genId()}`]={action:"הוספה (ייבוא)",amount:qty,result:curQ+qty,by:currentUser.displayName,date:new Date().toISOString()};
                }
              }else if(qty!==curQ){
                updates[`items/${id}/quantity`]=qty;
                updates[`items/${id}/history/${genId()}`]={action:"עדכון (ייבוא)",amount:Math.abs(qty-curQ),result:qty,by:currentUser.displayName,date:new Date().toISOString()};
              }
            }else{
              const id=genId();
              const itemData={name:r.name.trim(),quantity:qty,order:base+(newCount++),
                history:{[genId()]:{action:"נוצר (ייבוא)",amount:qty,by:currentUser.displayName,date:new Date().toISOString()}}};
              if(r.sku&&r.sku.trim())itemData.sku=r.sku.trim();
              if(r.low>0)itemData.lowStock=r.low;
              updates[`items/${id}`]=itemData;
            }
          });
          if(Object.keys(updates).length===0){close();return}
          await dbUpdate(`warehouses/${whId}`,updates);
          close();
        }catch(e){err.textContent="שגיאה בייבוא — נסה שוב";mainBtn.disabled=false;refreshMainLabel()}
      }
    };
    btns.append(cancelBtn,mainBtn);m.appendChild(btns);
  });
}

// ═══════════ STOCK COUNT MODE ═══════════
// Guided periodic stocktake: walks the warehouse item-by-item in the list
// order. Confirming keeps the recorded quantity; typing a different number
// corrects it — written IMMEDIATELY with a "ספירה" history entry, so closing
// mid-way loses nothing that was already confirmed.
function showStockCountModal(parent,whId){
  const list=[...currentItems].sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"2px"}},"ספירת מלאי"));
    if(!list.length){
      m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"13px",margin:"12px 0"}},"אין פריטים לספירה"));
      m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%"},onClick:close},"סגור"));
      return;
    }
    const prog=el("p",{style:{color:"var(--text-muted)",fontSize:"13px",marginBottom:"10px"}});
    const barWrap=el("div",{style:{height:"4px",background:"var(--border)",borderRadius:"2px",marginBottom:"16px",overflow:"hidden"}});
    const bar=el("div",{style:{height:"100%",width:"0%",background:"var(--accent)",borderRadius:"2px",transition:"width .25s ease"}});
    barWrap.appendChild(bar);
    const body=el("div");
    m.append(prog,barWrap,body);
    let idx=0,adjusted=0,confirmed=0,skipped=0;
    const st=list.map(()=>null); // per-item outcome: 'ok' | 'adj' | 'skip'

    function renderSummary(){
      body.innerHTML="";prog.textContent="";bar.style.width="100%";
      body.appendChild(el("p",{style:{fontSize:"16px",fontWeight:"600",marginBottom:"6px"}},"הספירה הושלמה"));
      body.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"16px"}},`${confirmed} אושרו · ${adjusted} תוקנו · ${skipped} דולגו`));
      body.appendChild(el("button",{className:"btn btn-primary",style:{width:"100%"},onClick:close},"סיום"));
    }

    function renderStep(){
      if(idx>=list.length){renderSummary();return}
      const[itemId,item]=list[idx];
      prog.textContent=`פריט ${idx+1} מתוך ${list.length}`;
      bar.style.width=(idx/list.length*100)+"%";
      body.innerHTML="";
      const card=el("div",{style:{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"8px",padding:"14px 16px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"12px"}});
      const thumbSrc=item.thumb||item.image;
      if(thumbSrc)card.appendChild(el("img",{src:thumbSrc,className:"item-thumb",decoding:"async"}));
      const info=el("div",{style:{flex:"1",minWidth:"0"}});
      info.appendChild(el("div",{style:{fontSize:"16px",fontWeight:"600"}},item.name));
      if(item.sku)info.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)",marginTop:"2px"}},`מק"ט: ${item.sku}`));
      if(item.note)info.appendChild(el("div",{className:"note-text"},item.note));
      info.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-sec)",marginTop:"6px"}},`כמות רשומה: ${item.quantity||0}`));
      card.appendChild(info);
      body.appendChild(card);
      const qi=el("input",{className:"app-input",type:"number",inputMode:"numeric",style:{fontSize:"24px",textAlign:"center",fontWeight:"600",marginBottom:"10px"}});
      qi.value=item.quantity||0;
      body.appendChild(qi);
      const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"16px",margin:"0 0 6px"}});
      body.appendChild(err);
      const row=el("div",{style:{display:"flex",gap:"8px"}});
      const backBtn=el("button",{className:"btn btn-ghost",style:{flex:"0 0 auto",padding:"12px 14px",display:idx>0?"flex":"none"},onClick:()=>{
        idx--;
        const p=st[idx];
        if(p==="ok")confirmed--;else if(p==="adj")adjusted--;else if(p==="skip")skipped--;
        st[idx]=null;
        renderStep();
      }});
      backBtn.appendChild(icon("forward",16));
      const skipBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:()=>{st[idx]="skip";skipped++;idx++;renderStep()}},"דלג");
      const okBtn=el("button",{className:"btn btn-primary",style:{flex:"2"},onClick:async()=>{
        const v=parseInt(qi.value);
        if(isNaN(v)||v<0){err.textContent="הכנס כמות תקינה";return}
        okBtn.disabled=true;
        try{
          const cur=item.quantity||0;
          if(v!==cur){
            await dbUpdate(`warehouses/${whId}`,{
              [`items/${itemId}/quantity`]:v,
              [`items/${itemId}/history/${genId()}`]:{action:"ספירה",amount:Math.abs(v-cur),result:v,by:currentUser.displayName,date:new Date().toISOString()}
            });
            item.quantity=v;
            st[idx]="adj";adjusted++;
          }else{st[idx]="ok";confirmed++}
          idx++;renderStep();
        }catch(e){err.textContent="שגיאה בשמירה — נסה שוב";okBtn.disabled=false}
      }},"אשר והמשך");
      row.append(backBtn,skipBtn,okBtn);
      body.appendChild(row);
      qi.addEventListener("keydown",e=>{if(e.key==="Enter")okBtn.click()});
      setTimeout(()=>{qi.focus();qi.select()},60);
    }
    renderStep();
  });
}

// ═══════════ SWIPE BACK GESTURE (iOS-like) ═══════════
let swipeStartX=0;
let swipeStartY=0;
let swipeActive=false;

function canSwipeBack(){
  // No back-swipe while a modal or action sheet is open — the gesture would
  // navigate the screen underneath the dialog.
  return currentWhId && !isWide() && document.querySelector('#searchWrap')
    && !document.querySelector('.modal-overlay')
    && !document.querySelector('.fullscreen-modal')
    && !document.querySelector('.action-sheet-overlay');
}

function updateSwipe(dx){
  const screen=document.querySelector('.screen:last-child');
  if(!screen)return;
  screen.style.transform=`translateX(-${dx}px)`;
  screen.style.transition='none';
  // Also move home screen behind (slides in from right for RTL)
  if(homeScreen&&homeScreen!==screen){
    const progress=Math.min(dx/window.innerWidth,1);
    homeScreen.style.transform=`translateX(${25-25*progress}%)`;
    homeScreen.style.opacity=String(0.6+0.4*progress);
    homeScreen.style.transition='none';
    homeScreen.style.position='absolute';homeScreen.style.top='0';homeScreen.style.left='0';homeScreen.style.right='0';
    if(!homeScreen.parentElement)$("#app").insertBefore(homeScreen,screen);
  }
}

function endSwipe(completed){
  const screen=document.querySelector('.screen:last-child');
  if(completed){
    if(screen){
      screen.style.transition='transform 0.2s cubic-bezier(0.32,0.72,0,1)';
      screen.style.transform='translateX(-100%)';
    }
    if(homeScreen&&homeScreen!==screen){
      homeScreen.style.transition='transform 0.2s cubic-bezier(0.32,0.72,0,1), opacity 0.2s cubic-bezier(0.32,0.72,0,1)';
      homeScreen.style.transform='translateX(0)';
      homeScreen.style.opacity='1';
    }
    setTimeout(()=>{
      if(screen){screen.style.transform='';screen.style.transition='';}
      if(homeScreen){homeScreen.style.position='';homeScreen.style.transform='';homeScreen.style.transition='';homeScreen.style.opacity='';}
      cleanup();
      currentWhId=null;isShowingDetail=false;
      const app=$("#app");app.innerHTML="";app.appendChild(homeScreen);
      attachHomeWarehouseListener(cachedHomeContent,homeScreen);
    },210);
  }else{
    if(screen){
      screen.style.transition='transform 0.18s cubic-bezier(0.32,0.72,0,1)';
      screen.style.transform='translateX(0)';
    }
    if(homeScreen&&homeScreen!==screen){
      homeScreen.style.transition='transform 0.18s cubic-bezier(0.32,0.72,0,1), opacity 0.18s cubic-bezier(0.32,0.72,0,1)';
      homeScreen.style.transform='translateX(25%)';
      homeScreen.style.opacity='0.6';
      setTimeout(()=>{
        if(homeScreen.parentElement)homeScreen.parentElement.removeChild(homeScreen);
        homeScreen.style.position='';homeScreen.style.transform='';homeScreen.style.transition='';homeScreen.style.opacity='';
      },190);
    }
    if(screen)setTimeout(()=>{screen.style.transform='';screen.style.transition=''},190);
  }
  swipeActive=false;
}

document.addEventListener('touchstart',e=>{
  // In RTL the item drag handles sit on the right — exactly in the 30px strip
  // that arms the swipe-back gesture. A drag must never double as a swipe.
  if(e.target&&e.target.closest&&e.target.closest('.drag-handle'))return;
  if(!canSwipeBack())return;
  const x=e.touches[0].clientX;
  if(x<window.innerWidth-30)return;
  swipeStartX=x;
  swipeStartY=e.touches[0].clientY;
  swipeActive=false;
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(swipeStartX<window.innerWidth-30)return;
  if(!canSwipeBack())return;
  const x=e.touches[0].clientX;
  const y=e.touches[0].clientY;
  const dx=swipeStartX-x;
  const dy=Math.abs(y-swipeStartY);
  if(!swipeActive){
    if(dx>10&&dy<30){swipeActive=true;document.body.style.overflow='hidden'}
    else if(dy>10){swipeStartX=0;return}
    else return;
  }
  if(swipeActive&&dx>0){e.preventDefault();updateSwipe(dx)}
},{passive:false});

document.addEventListener('touchend',e=>{
  if(!swipeActive)return;
  document.body.style.overflow='';
  const dx=swipeStartX-e.changedTouches[0].clientX;
  endSwipe(dx>100);
},{passive:true});

// ── Tap on the status bar (around the Dynamic Island) → scroll to top ──
// The page itself never scrolls (each screen scrolls inside its own box), so
// iOS can't do this by itself. The native app sends a "statusTap" event and we
// scroll whatever is on top: an open sheet/modal/settings page, else the screens.
function scrollTopVisible(){
  const scrollers=root=>[root,...root.querySelectorAll("*")].filter(n=>{
    if(n.scrollTop<=0)return false;const o=getComputedStyle(n).overflowY;return o==="auto"||o==="scroll"});
  const layer=document.querySelector(".action-sheet-overlay")||document.querySelector(".modal-overlay")||[...document.querySelectorAll(".fullscreen-modal")].pop();
  const targets=layer?scrollers(layer):[...document.querySelectorAll("#app > .screen")].flatMap(scrollers);
  targets.forEach(n=>{try{n.scrollTo({top:0,behavior:"smooth"})}catch(e){n.scrollTop=0}});
}
window.addEventListener("statusTap",scrollTopVisible);

const TIP_KEYS=["home-fab","item-add","qty","share","watch"];

function visibleEl(n){

  if(r.width<4||r.height<4||r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth)return null;

}
function showTip(k,targets,title,text){
  if(tipOpen||tipSeen(k))return false;
  targets=targets.filter(visibleEl);if(!targets.length)return false;
  const rs=targets.map(t=>t.getBoundingClientRect());
  const r={left:Math.min(...rs.map(x=>x.left)),top:Math.min(...rs.map(x=>x.top)),right:Math.max(...rs.map(x=>x.right)),bottom:Math.max(...rs.map(x=>x.bottom))};
  tipOpen=true;markTip(k);
  const pad=8,ov=el("div",{className:"tip-overlay"});
  const hole=el("div",{className:"tip-hole",style:{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.right-r.left+2*pad)+"px",height:(r.bottom-r.top+2*pad)+"px"}});
  const ok=el("button",{className:"btn btn-primary btn-sm"},"הבנתי");
  const bub=el("div",{className:"tip-bubble"},el("div",{className:"tip-title"},title),el("div",{className:"tip-text"},text),ok);
  const bw=Math.min(320,innerWidth-32),cx=(r.left+r.right)/2;
  bub.style.left=Math.max(16,Math.min(innerWidth-16-bw,cx-bw/2))+"px";

  ov.addEventListener("click",close);window.addEventListener("resize",close);

}

  if(TIP_KEYS.every(tipSeen))return;
  if(document.querySelector(".modal-overlay,.fullscreen-modal,.action-sheet-overlay,.viewer-overlay"))return scheduleTips();
  const home=document.querySelector("#app .home-screen");
  const detail=document.querySelector("#app > .screen:not(.home-screen)");
  // 1. No warehouses yet → the + on the home screen
  if(home&&visibleEl(home)&&home.querySelector(".empty-state")&&!detail){
    if(showTip("home-fab",[home.querySelector(".fab")],"צור את המחסן הראשון","לוחצים כאן, נותנים שם (למשל ״מחסן הבית״) — וזהו."))return;

  if(detail&&visibleEl(detail)&&!reorderMode){
    const list=detail.querySelector("#itemsList");
    const cards=list?[...list.querySelectorAll(".item-card")]:[];
    // 2. Empty warehouse → the + for items
    if(list&&!cards.length&&list.querySelector(".empty-state")){
      if(showTip("item-add",[detail.querySelector(".fab")],"הוסף פריט","מוסיפים פריט ראשון כאן. יש לך רשימה מוכנה? אפשר להדביק אותה בכפתור ״ייבוא״."))return;
    }
    // 3. First item → + / − on the card
    if(cards.length){
      const c0=cards.find(visibleEl);
      if(c0&&showTip("qty",[c0.querySelector(".qty-btn-sub"),c0.querySelector(".qty-btn-add")].filter(Boolean),"הוספה והורדה","כך מעדכנים כמות. כל שינוי נרשם בהיסטוריה — מי, כמה ומתי."))return;
    }
    // 4. A few items in → sharing lives in the warehouse settings
    if(cards.length>=3&&tipSeen("qty")){
      if(showTip("share",[btnWithIcon(detail,"settings")],"עובדים ביחד?","בהגדרות המחסן מזמינים את המשפחה או הצוות, ומגדירים מה כל אחד יכול לעשות."))return;
    }
  }
  // 5. iPhone, a couple of days in → the watch app
  if(home&&visibleEl(home)&&tipSeen("qty")&&describeDevice().platform==="אייפון"){
    let since=0;try{since=+localStorage.getItem("tipsSince")||0}catch(e){}
    if(since&&Date.now()-since>2*864e5)
      showTip("watch",[btnWithIcon(home,"settings")],"יש לך Apple Watch?","אפשר להוסיף ולהוריד כמויות ישר מהשעון. מתקינים מאפליקציית Watch באייפון, והשעון מתחבר לבד.");
  }
}
// Re-check after every screen change (debounced; cheap when everything was seen).
try{new MutationObserver(()=>{if(!TIP_KEYS.every(tipSeen))scheduleTips()}).observe(document.getElementById("app")||document.body,{childList:true,subtree:true})}catch(e){}

// ═══════════ INIT ═══════════
function init(){
  // Was this app used before this launch? (inv_device is created on first use.)
  try{window.__returningUser=!!localStorage.getItem("inv_device")}catch(e){window.__returningUser=false}
  try{const s=localStorage.getItem("inv_user");if(s){currentUser=JSON.parse(s);renderHome()}}catch{}
  if(window.FB){FB=window.FB;onFirebaseReady()}
  else window.addEventListener("firebase-ready",()=>{FB=window.FB;onFirebaseReady()});
  // Watchdog: if Firebase never comes up (stale cached bundle after an update,
  // flaky network, blocked CDN) the app used to sit on the loading dots
  // forever. After 6s show SOMETHING usable: the cached home screen if we have
  // a stored user, otherwise the login screen.
  setTimeout(()=>{
    if(authReady)return;
    const app=$("#app");
    if(app&&app.querySelector(".screen"))return;
    try{
      if(currentUser)renderHome();
      else renderAuth();
    }catch(e){}
  },6000);
}
let authReady=false;
// ── Several accounts on one device ──
// inv_accounts = [{username, displayName, slot}], slot = the Firebase app name
// that holds that account's session. Switching = pick the slot and reload.
function getAccounts(){try{const a=JSON.parse(localStorage.getItem("inv_accounts")||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function setAccounts(a){try{localStorage.setItem("inv_accounts",JSON.stringify(a))}catch(e){}}
function activeSlot(){try{return localStorage.getItem("inv_active")||"[DEFAULT]"}catch(e){return "[DEFAULT]"}}
function rememberAccount(){
  if(!currentUser)return;
  const slot=activeSlot(),me={username:currentUser.username,displayName:currentUser.displayName,slot};
  const list=getAccounts();
  const i=list.findIndex(a=>a.slot===slot);
  const others=list.filter(a=>a.slot!==slot&&a.username!==me.username);
  if(i>=0){others.splice(Math.min(i,others.length),0,me)}else others.push(me);
  setAccounts(others);
  try{localStorage.removeItem("inv_adding_from")}catch(e){}
}
function addingFrom(){
  try{const s=localStorage.getItem("inv_adding_from");if(!s)return null;return getAccounts().find(a=>a.slot===s)||null}catch(e){return null}
}
function switchAccount(slot){
  const a=getAccounts().find(x=>x.slot===slot);
  cacheClearAll();
  try{
    localStorage.removeItem("inv_adding_from");
    localStorage.setItem("inv_active",slot);
    if(a)localStorage.setItem("inv_user",JSON.stringify({username:a.username,displayName:a.displayName}));
    else localStorage.removeItem("inv_user");
  }catch(e){}
  location.reload();
}
function addAccount(){
  cacheClearAll();
  try{
    localStorage.setItem("inv_adding_from",activeSlot());
    localStorage.setItem("inv_active","acct-"+genId());
    localStorage.removeItem("inv_user");
  }catch(e){}
  location.reload();
}
async function showAccountSwitcher(){
  const others=getAccounts().filter(a=>a.slot!==activeSlot());
  const items=others.map(a=>({label:`${a.displayName} (${a.username})`,value:a.slot}));
  items.push({label:"הוסף חשבון",value:"__add"});
  const v=await showActionSheet(items,`מחובר כ${currentUser?currentUser.displayName:""}`);
  if(!v)return;
  if(v==="__add")addAccount();else switchAccount(v);
}
// ── Apple Watch ──
// The iOS app ships a tiny native plugin ("WatchLink") that hands the current
// login to the watch app over WatchConnectivity, so the watch signs in by itself.
function watchLink(){
  // The page doesn't bundle @capacitor/core, so Capacitor.registerPlugin doesn't
  // exist here; the native bridge exposes the plugin on Capacitor.Plugins.
  try{
    const C=window.Capacitor;if(!C||!C.isPluginAvailable||!C.isPluginAvailable("WatchLink"))return null;
    const P=C.Plugins&&C.Plugins.WatchLink;if(P&&typeof P.send==="function")return P;
    if(typeof C.registerPlugin==="function")return C.registerPlugin("WatchLink");
    return null;
  }catch(e){return null}
}
async function sendToWatch(manual){
  const wl=watchLink();if(!wl||!FB||!FB.auth||!FB.auth.currentUser||!currentUser)return false;
  // users/<me>/prefs/watchUnlinked = true after the watch was disconnected
  // (from ANY device, or signed out on the watch itself). Stored in the DB, not
  // localStorage, so every phone respects it. Only "חבר את השעון" clears it.
  const wkPath=`users/${currentUser.username}/prefs/watchUnlinked`;
  try{
    if(manual)await dbRemove(wkPath);
    else if(await dbGet(wkPath))return false;
  }catch(e){if(!manual)return false}
  try{
    // manual=true only from "חבר את השעון": the watch then adds this account and
    // switches to it. Automatic sends never switch an already signed-in watch.
    const r=await wl.send({username:currentUser.username,displayName:currentUser.displayName,refreshToken:FB.auth.currentUser.refreshToken,manual:!!manual});
    return !!(r&&r.sent);
  }catch(e){return false}
}
// ── Connected devices ──
// Each installation gets a stable id (localStorage). While signed in it keeps
// users/<me>/devices/<id> = {name, platform, lastSeen} alive. The settings page
// lists these; removing another device's node makes that device sign itself
// out the moment it sees its own entry disappear (it listens to it).
function deviceId(){
  try{let id=localStorage.getItem("inv_device");if(!id){id=genId()+genId();localStorage.setItem("inv_device",id)}return id}catch(e){return "d-"+navigator.userAgent.length}
}
function describeDevice(){
  const ua=navigator.userAgent||"";
  const cap=window.Capacitor&&window.Capacitor.getPlatform?window.Capacitor.getPlatform():"web";
  let platform="דפדפן";
  // iPhone UAs also contain "like Mac OS X", so check for iPhone first; an iPad
  // in desktop mode reports "Macintosh" with touch support.
  if(cap==="ios")platform=/iPhone|iPod/.test(ua)?"אייפון":(/iPad/.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/.test(ua)))?"אייפד":"אייפון";
  else if(cap==="android")platform="אנדרואיד";
  else if(/iPhone/.test(ua))platform="אייפון (דפדפן)";
  else if(/iPad/.test(ua)||(navigator.maxTouchPoints>1&&/Mac/.test(ua)))platform="אייפד (דפדפן)";
  else if(/Android/.test(ua))platform="אנדרואיד (דפדפן)";
  else if(/Mac/.test(ua))platform="מק";
  else if(/Windows/.test(ua))platform="Windows";
  const app=cap==="web"?"אתר":"אפליקציה";
  return {platform,app};
}
let deviceUnsub=null,deviceRegistered=false;
function registerDevice(){
  if(!FB||!currentUser)return;
  const id=deviceId(),d=describeDevice(),uname=currentUser.username;
  const path=`users/${uname}/devices/${id}`,flag="inv_devreg_"+uname;
  deviceRegistered=false;
  if(deviceUnsub){deviceUnsub();deviceUnsub=null}
  let seenBefore=false;try{seenBefore=localStorage.getItem(flag)==="1"}catch(e){}
  // Check BEFORE writing: if this device was registered earlier and its entry is
  // gone, it was disconnected from another device while this one was closed.
  // (Writing first would silently re-register it and the revoke would be lost.)
  dbGet(path).then(existing=>{
    if(!currentUser||currentUser.username!==uname)return;
    if(seenBefore&&existing===null){deviceRevoked(uname);return}
    return dbUpdate(path,{platform:d.platform,app:d.app,lastSeen:Date.now(),name:d.platform}).then(()=>{
      deviceRegistered=true;try{localStorage.setItem(flag,"1")}catch(e){}
      deviceUnsub=FB.onValue(dbRef(path),snap=>{
        // Our own entry vanished while we are open → revoked from another device.
        if(deviceRegistered&&!snap.exists()&&currentUser&&currentUser.username===uname)deviceRevoked(uname);
      });
    });
  }).catch(()=>{});
  // Heartbeat while the app is open (every 5 min) so "last seen" stays useful.
  // Never re-create a missing entry here: missing means revoked.
  if(!window.__devHb)window.__devHb=setInterval(()=>{
    if(!FB||!currentUser||!deviceRegistered)return;
    const u=currentUser.username,pth=`users/${u}/devices/${deviceId()}`;
    dbGet(pth).then(v=>{
      if(!currentUser||currentUser.username!==u)return;
      if(v===null){deviceRevoked(u);return}
      return dbUpdate(pth,{lastSeen:Date.now()});
    }).catch(()=>{});
  },5*60*1000);
}
function deviceRevoked(uname){
  try{localStorage.removeItem("inv_devreg_"+uname)}catch(e){}
  doLogout(true);
  setTimeout(()=>showNotice("המכשיר נותק מהחשבון ממכשיר אחר"),300);
}
function doLogout(revoked,stay){
  if(deviceUnsub){deviceUnsub();deviceUnsub=null}
  deviceRegistered=false;
  const uname=currentUser&&currentUser.username;
  // A normal sign-out removes this device from the account's list (needs auth, so before signOut).
  const rmDev=(!revoked&&FB&&uname)?dbRemove(`users/${uname}/devices/${deviceId()}`).catch(()=>{}):Promise.resolve();
  if(uname)try{localStorage.removeItem("inv_devreg_"+uname)}catch(e){}
  cleanup();
  homeUnsubs.forEach(f=>f());homeUnsubs=[];
  whCardListeners.forEach(f=>f());whCardListeners=[];
  currentUser=null;homeScreen=null;cachedHomeContent=null;
  currentWhIds=[];lastHomeWhIds=[];whReorderMode=false;whCategories={};catFilter=null;catOrder=[];userPrefs={};
  cacheClearAll();localStorage.removeItem("inv_user");
  const slot=activeSlot();
  const rest=getAccounts().filter(a=>a.slot!==slot);setAccounts(rest);
  const out=rmDev.then(()=>(FB&&FB.auth)?FB.signOut(FB.auth):null).catch(()=>{});
  document.querySelectorAll('.fullscreen-modal,.modal-overlay,.action-sheet-overlay').forEach(x=>x.remove());
  navDepth=0;
  if(rest.length&&!stay){out.then(()=>switchAccount(rest[0].slot));return}
  renderAuth();
}
// Firebase dropped the session on its own (e.g. the password was changed on
// another device, which revokes every other sign-in). Without this the app
// kept showing cached data while every save was refused.
function sessionExpired(){
  const uname=currentUser&&currentUser.username;
  if(uname)try{localStorage.removeItem("inv_devreg_"+uname)}catch(e){}
  doLogout(true,true);
  setTimeout(()=>showNotice("החיבור לחשבון פג. התחבר מחדש"),300);
}
function timeAgo(ts){
  if(!ts)return "";
  const m=Math.round((Date.now()-ts)/60000);
  if(m<2)return "פעיל עכשיו";if(m<60)return `לפני ${m} דק׳`;
  const h=Math.round(m/60);if(h<24)return `לפני ${h} שע׳`;
  const d=Math.round(h/24);if(d<30)return `לפני ${d} ימים`;
  return new Date(ts).toLocaleDateString("he-IL");
}

function onFirebaseReady(){
  // The screen may already show cached data (instant load). The real gate is
  // the Firebase Auth session: without one, DB access is denied by the rules,
  // so send the user to the login screen — an existing account migrates itself
  // there on first sign-in.
  FB.onAuthStateChanged(FB.auth,user=>{
    if(!user){
      if(authReady){
        // Our own logout clears currentUser first; a still-set user means the
        // session was lost behind our back.
        if(currentUser)sessionExpired();
        return;
      }
      authReady=true;
      currentUser=null;localStorage.removeItem("inv_user");
      renderAuth();return;
    }
    authReady=true;
    if(!currentUser){renderAuth();return}
    rememberAccount();
    registerDevice();
    sendToWatch(false);
    initTips();
    setTimeout(maybeShowWhatsNew,900);
    if(homeScreen&&cachedHomeContent){attachHomeWarehouseListener(cachedHomeContent,homeScreen)}
    else renderHome();
  });
}
init();
</script>
