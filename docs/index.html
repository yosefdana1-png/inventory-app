let currentWhIds=[];
let whCardListeners=[];

function renderWarehouseList(c,whIds,wrap){
  // Never rebuild the list under an active drag — defer to finishWhTouchDrag.
  if(whTouchDrag){pendingWhRender=true;return}
  const same=currentWhIds.length===whIds.length&&currentWhIds.every((id,i)=>id===whIds[i]);
  const cardsExist=c.querySelector('#warehouseCards');

  if(same&&cardsExist&&whCardListeners.length>0)return;

  if(same&&cardsExist&&whCardListeners.length===0&&FB){
    whIds.forEach(whId=>{
      const cw=document.getElementById(`wh-${whId}`);
      if(!cw)return;
      const unsub=FB.onValue(dbRef(`warehouses/${whId}`),snap=>{
        const wh=snap.exists()?snap.val():null;
        cacheSet(`warehouses/${whId}`,wh);
        if(!wh){cw.innerHTML="";return}
        buildWarehouseCard(cw,whId,wh,wrap);
      });
      whCardListeners.push(unsub);
    });
    return;
  }

  whCardListeners.forEach(f=>f());
  whCardListeners=[];
  currentWhIds=[...whIds];

  c.innerHTML="";
  if(whIds.length===0){
    const empty=el("div",{className:"empty-state"});
    empty.appendChild(el("p",{style:{fontSize:"16px",color:"var(--text)"}},"עוד אין לך מחסנים"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"8px"}},"מחסן הוא רשימה של פריטים וכמויות. אפשר לפתוח אחד בכפתור + למטה."));
    c.appendChild(empty);return;
  }

  const cardsContainer=el("div",{id:"warehouseCards"});
  c.appendChild(cardsContainer);

  whIds.forEach((whId)=>{
    const cardWrapper=el("div",{id:`wh-${whId}`,style:{marginBottom:"10px"}});
    cardsContainer.appendChild(cardWrapper);

    const cachedWh=cacheGet(`warehouses/${whId}`);
    if(cachedWh)buildWarehouseCard(cardWrapper,whId,cachedWh,wrap);

    if(FB){
      const unsub=FB.onValue(dbRef(`warehouses/${whId}`),snap=>{
        const wh=snap.exists()?snap.val():null;
        cacheSet(`warehouses/${whId}`,wh);
        if(!wh){cardWrapper.innerHTML="";return}
        buildWarehouseCard(cardWrapper,whId,wh,wrap);
      });
      whCardListeners.push(unsub);
    }
  });
  applyCatFilter();
  markSelectedWh();
}

function buildWarehouseCard(cardWrapper,whId,wh,wrap){
  const existing=cardWrapper.querySelector('.list-card');
  if(existing){
    if(!whReorderMode){
      const countEl=existing.querySelector('.wh-count');
      const totalEl=existing.querySelector('.wh-total');
      const items=wh.items?Object.values(wh.items):[];
      const total=items.reduce((s,it)=>s+(it.quantity||0),0);
      if(countEl)countEl.textContent=`${items.length} פריטים`;
      if(totalEl)totalEl.textContent=`סה״כ: ${total}`;
    }
    return;
  }

  const card=el("div",{className:"list-card"});
  if(!whReorderMode)card.onclick=()=>renderListDetail(whId);

  const items=wh.items?Object.values(wh.items):[];
  const total=items.reduce((s,it)=>s+(it.quantity||0),0);
  const members=wh.members?Object.keys(wh.members):[];
  const isShared=members.length>1;
  const info=el("div",{style:{flex:"1"}});
  info.appendChild(el("h3",{style:{fontSize:"16px",fontWeight:"600",marginBottom:"2px"}},wh.name));
  if(isShared){const sb=el("div",{className:"shared-badge"});sb.appendChild(icon("share",12));sb.appendChild(document.createTextNode(`משותף (${members.length})`));info.appendChild(sb)}
  const meta=el("div",{style:{display:"flex",gap:"12px",alignItems:"center",marginTop:"4px"}});
  meta.appendChild(el("span",{className:"wh-count",style:{fontSize:"13px",color:"var(--text-sec)"}},`${items.length} פריטים`));
  meta.appendChild(el("span",{className:"wh-total",style:{fontSize:"13px",color:"var(--text-muted)"}},`סה״כ: ${total}`));
  info.appendChild(meta);
  const actions=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});

  if(whReorderMode){
    const handle=el("div",{className:"drag-handle",style:{padding:"4px 6px",display:"flex",alignItems:"center"}});
    handle.appendChild(icon("grip",22));
    actions.appendChild(handle);

    // HTML5 drag
    cardWrapper.setAttribute("draggable","true");
    cardWrapper.addEventListener("dragstart",e=>{
      whDragSrcId=whId;cardWrapper.style.opacity="0.5";
      e.dataTransfer.effectAllowed="move";
    });
    cardWrapper.addEventListener("dragend",()=>{
      cardWrapper.style.opacity="";
      document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
    });
    cardWrapper.addEventListener("dragover",e=>{
      e.preventDefault();e.dataTransfer.dropEffect="move";
      if(whDragSrcId&&whDragSrcId!==whId){
        document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
        cardWrapper.classList.add("drag-over");
      }
    });
    cardWrapper.addEventListener("dragleave",()=>cardWrapper.classList.remove("drag-over"));
    cardWrapper.addEventListener("drop",async e=>{
      e.preventDefault();cardWrapper.classList.remove("drag-over");
      if(!whDragSrcId||whDragSrcId===whId)return;
      const container=cardWrapper.parentElement;
      const cards=[...container.querySelectorAll('[data-wh-id]')];
      const fromIdx=cards.findIndex(c=>c.dataset.whId===whDragSrcId);
      const toIdx=cards.findIndex(c=>c.dataset.whId===whId);
      if(fromIdx===-1||toIdx===-1)return;
      const newOrder=[...lastHomeWhIds];
      const[moved]=newOrder.splice(fromIdx,1);newOrder.splice(toIdx,0,moved);
      whDragSrcId=null;
      const upd={};newOrder.forEach((id,i)=>{upd[id]=i+1});
      await dbUpdate(`users/${currentUser.username}/warehouses`,upd);
    });

    // Touch drag — same transform-only mechanism as the items list: geometry
    // is measured ONCE at touchstart, the dragged card follows the finger with
    // a transform, displaced cards slide by a fixed precomputed distance, the
    // drop slot is derived purely from the frozen geometry, and the real
    // re-order happens exactly once at drop. No DOM mutations and no
    // measurements mid-drag (Android drops the touch stream on DOM churn; live
    // measurement of animating cards made the drop slot oscillate on iOS).
    handle.addEventListener("touchstart",e=>{
      e.preventDefault();
      if(whTouchDrag)return; // a second finger must not hijack an active drag
      const container=cardWrapper.parentElement;
      // Clean slate in case a previous drag was interrupted mid-animation.
      [...container.children].forEach(elm=>{elm.style.transition="";elm.style.transform="";elm.style.zIndex="";elm.style.position="";elm.style.boxShadow=""});
      const touch=e.touches[0];
      const cardEls=[...container.children];
      const rects=cardEls.map(elm=>elm.getBoundingClientRect());
      const dragIndex=cardEls.indexOf(cardWrapper);
      const rect=rects[dragIndex];
      const gap=rects.length>1?rects[1].top-rects[0].bottom:10;
      whTouchDrag={whId,container,grabOffsetY:touch.clientY-rect.top,cardHeight:rect.height,
        lastClientY:touch.clientY,cardEls,dragIndex,curIndex:dragIndex,rafId:null,
        startTop:rect.top,mids:rects.map(r=>r.top+r.height/2),shift:rect.height+gap,
        docEnd:null,docCancel:null};
      cardWrapper.style.transition="none";
      cardWrapper.style.zIndex="500";
      cardWrapper.style.position="relative";
      cardWrapper.style.boxShadow="0 0 0 1px var(--accent-line)";
      whTouchDrag.docEnd=ev=>{if(ev.touches.length===0)finishWhTouchDrag(true)};
      whTouchDrag.docCancel=ev=>{if(ev.touches.length===0)finishWhTouchDrag(false)};
      document.addEventListener("touchend",whTouchDrag.docEnd);
      document.addEventListener("touchcancel",whTouchDrag.docCancel);
    },{passive:false});
    const updateWhDragFrame=()=>{
      const top=whTouchDrag.lastClientY-whTouchDrag.grabOffsetY;
      cardWrapper.style.transform=`translateY(${top-whTouchDrag.startTop}px)`;
      const center=top+whTouchDrag.cardHeight/2;
      let newIndex=0;
      for(let i=0;i<whTouchDrag.mids.length;i++){
        if(i===whTouchDrag.dragIndex)continue;
        if(center>whTouchDrag.mids[i])newIndex++;
      }
      if(newIndex!==whTouchDrag.curIndex){
        whTouchDrag.curIndex=newIndex;
        whTouchDrag.cardEls.forEach((elm,i)=>{
          if(i===whTouchDrag.dragIndex)return;
          let dy=0;
          if(i>whTouchDrag.dragIndex&&i<=whTouchDrag.curIndex)dy=-whTouchDrag.shift;
          else if(i<whTouchDrag.dragIndex&&i>=whTouchDrag.curIndex)dy=whTouchDrag.shift;
          const t=dy?`translateY(${dy}px)`:"";
          if(elm.style.transform!==t){
            elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
            elm.style.transform=t;
          }
        });
      }
    };
    handle.addEventListener("touchmove",e=>{
      if(!whTouchDrag)return;e.preventDefault();
      whTouchDrag.lastClientY=e.touches[0].clientY;
      if(whTouchDrag.rafId)return;
      whTouchDrag.rafId=requestAnimationFrame(()=>{
        if(!whTouchDrag)return;
        whTouchDrag.rafId=null;
        updateWhDragFrame();
      });
    },{passive:false});
    const finishWhTouchDrag=async(commit)=>{
      if(!whTouchDrag)return;
      if(whTouchDrag.rafId)cancelAnimationFrame(whTouchDrag.rafId);
      document.removeEventListener("touchend",whTouchDrag.docEnd);
      document.removeEventListener("touchcancel",whTouchDrag.docCancel);
      const{cardEls,dragIndex,curIndex,container}=whTouchDrag;
      whTouchDrag=null;
      [...container.children].forEach(elm=>{elm.style.transition="";elm.style.transform="";elm.style.zIndex="";elm.style.position="";elm.style.boxShadow=""});
      if(commit&&dragIndex!==curIndex){
        // Wrapper ids are wh-<id> from renderWarehouseList, present even before
        // a card's data arrives, so derive the new order from them.
        const newOrder=cardEls.map(elm=>elm.id.slice(3));
        const[moved]=newOrder.splice(dragIndex,1);
        newOrder.splice(curIndex,0,moved);
        // Re-render synchronously in the new order BEFORE the async DB write —
        // the DOM was deliberately left untouched during the drag, so this is
        // what prevents a visible snap-back while the write is in flight.
        lastHomeWhIds=newOrder;
        currentWhIds=[];
        if(cachedHomeContent&&homeScreen)renderWarehouseList(cachedHomeContent,lastHomeWhIds,homeScreen);
        pendingWhRender=false;
        const upd={};newOrder.forEach((id,i)=>{upd[id]=i+1});
        await dbUpdate(`users/${currentUser.username}/warehouses`,upd);
      }else if(pendingWhRender){
        // A data update arrived mid-drag and was deferred — apply it now.
        pendingWhRender=false;
        currentWhIds=[];
        if(cachedHomeContent&&homeScreen)renderWarehouseList(cachedHomeContent,lastHomeWhIds,homeScreen);
      }
    };
    handle.addEventListener("touchend",()=>finishWhTouchDrag(true));
    handle.addEventListener("touchcancel",()=>finishWhTouchDrag(false));
  }else{
    const moreBtn=el("button",{className:"icon-btn",onClick:async e=>{
      e.stopPropagation();
      const isOwner=wh.owner===currentUser.username;
      // Role computed from the card's own data — currentWhData belongs to the
      // detail screen and isn't reliable here on the home screen.
      const isAdminHere=isOwner||(wh.roles&&wh.roles[currentUser.username]==='admin');
      const canShare=isAdminHere||!(wh.permissions&&wh.permissions.restrict_share);
      const menuOpts=[{label:"יצוא רשימה",value:"export"}];
      if(canShare){
        menuOpts.push({label:"שיתוף וניהול חברים",value:"share"});
        menuOpts.push({label:"שלח עותק למשתמש",value:"copy"});
      }
      menuOpts.push({label:"שכפל מחסן",value:"duplicate"});
      menuOpts.push({label:whCategories[whId]?`קטגוריה: ${whCategories[whId]}`:"קטגוריה",value:"category"});
      menuOpts.push({label:isOwner?"מחק מחסן":"עזוב מחסן",style:"danger",value:"delete"});
      const choice=await showActionSheet(menuOpts);
      if(choice==="export"){
        const items=await dbGet(`warehouses/${whId}/items`);
        showExportModal(wrap,whId,Object.entries(items||{}));
      }
      else if(choice==="duplicate"){
        // Duplicate FOR MYSELF (unlike "send copy" which targets another user):
        // a fresh private warehouse with all items, thumbs, thresholds and the
        // display/sort settings — no members, no invite token, fresh history.
        const c2=await showActionSheet([{label:`שכפל את "${wh.name}" למחסן חדש`,value:"ok"}]);
        if(c2!=="ok")return;
        try{
          const newWhId=genId();
          const idMap={};
          const newItems={};
          if(wh.items){
            for(const[oldId,item]of Object.entries(wh.items)){
              const newId=genId();idMap[oldId]=newId;
              const ni={name:item.name,quantity:item.quantity||0,order:item.order||0,
                history:{[genId()]:{action:"שוכפל",amount:item.quantity||0,by:currentUser.displayName,date:new Date().toISOString()}}};
              if(item.note)ni.note=item.note;
              if(item.sku)ni.sku=item.sku;
              if(item.thumb)ni.thumb=item.thumb;
              if(item.lowStock)ni.lowStock=item.lowStock;
              if(item.image)ni.image=item.image;
              newItems[newId]=ni;
            }
          }
          const newWh={name:`${wh.name} (עותק)`,owner:currentUser.username,members:{[currentUser.username]:true},createdAt:new Date().toISOString()};
          if(wh.sortMode)newWh.sortMode=wh.sortMode;
          if(wh.features)newWh.features=JSON.parse(JSON.stringify(wh.features));
          if(Object.keys(newItems).length)newWh.items=newItems;
          await dbSet(`warehouses/${newWhId}`,newWh);
          // Full-size images live outside the warehouse node — copy them
          // directly (allowed: we're a member of the new warehouse by now).
          try{
            const imgs=await dbGet(`itemImages/${whId}`);
            if(imgs){
              const newImgs={};
              for(const[oldId,img]of Object.entries(imgs)){if(idMap[oldId])newImgs[idMap[oldId]]=img}
              if(Object.keys(newImgs).length)await dbSet(`itemImages/${newWhId}`,newImgs);
            }
          }catch(e){}
          await dbSet(`users/${currentUser.username}/warehouses/${newWhId}`,Date.now());
          showNotice(`נוצר עותק: "${newWh.name}"`);
        }catch(e){showNotice("שגיאה בשכפול — נסה שוב")}
      }
      else if(choice==="category"){
        const cats=[...new Set(lastHomeWhIds.map(id=>whCategories[id]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
        const cur=whCategories[whId]||null;
        const opts=cats.map(cat=>({label:(cat===cur?"✓ ":"")+cat,value:"set:"+cat}));
        opts.push({label:"קטגוריה חדשה...",value:"new"});
        if(cur)opts.push({label:"הסר מהקטגוריה",style:"danger",value:"clear"});
        const c2=await showActionSheet(opts,`קטגוריה עבור "${wh.name}" (אישי — רק אצלך)`);
        if(!c2)return;
        if(c2==="new"){
          setTimeout(()=>showCategoryNameModal(whId,null),80);
        }else if(c2==="clear"){
          await dbRemove(`users/${currentUser.username}/whCategories/${whId}`);
        }else if(c2.indexOf("set:")===0){
          await dbSet(`users/${currentUser.username}/whCategories/${whId}`,c2.slice(4));
        }
      }
      else if(choice==="share")showShareModal(wrap,whId,wh);
      else if(choice==="copy")showCopyWarehouseModal(wrap,whId,wh);
      else if(choice==="delete"){
        // Membership must be checked BEFORE removing ourselves — the security
        // rules only let members read a warehouse, so after self-removal every
        // follow-up read/write here would be denied.
        let mems=null;try{mems=await dbGet(`warehouses/${whId}/members`)}catch(e){}
        const memberList=mems?Object.keys(mems):[currentUser.username];
        const others=memberList.filter(u=>u!==currentUser.username);
        if(isOwner&&others.length>0){
          // An owner "deleting" a shared warehouse used to silently just LEAVE,
          // stranding an ownerless warehouse for everyone else. Now it really
          // deletes — for all members — after an explicit warning.
          showDeleteModal(wrap,`"${wh.name}" משותף עם עוד ${others.length} חברים. המחיקה תסיר אותו לכולם. (רוצה רק לצאת? העבר קודם בעלות דרך "שיתוף וניהול חברים")`,async()=>{
            // Snapshot everything BEFORE deleting so undo can rebuild it.
            const snapshot=JSON.parse(JSON.stringify(wh));
            let imgs=null;try{imgs=await dbGet(`itemImages/${whId}`)}catch(e){}
            // Order matters under the rules: images and member links are only
            // writable while the warehouse (and our membership) still exist,
            // so the warehouse node itself goes LAST.
            await dbRemove(`itemImages/${whId}`).catch(()=>{});
            for(const u of others)await dbRemove(`users/${u}/warehouses/${whId}`).catch(()=>{});
            await dbRemove(`warehouses/${whId}`);
            await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
            showUndoToast(`המחסן "${wh.name}" נמחק`,async()=>{
              // Warehouse first — restoring it restores our membership, which
              // is what authorizes the link and image writes that follow.
              await dbSet(`warehouses/${whId}`,snapshot);
              await dbSet(`users/${currentUser.username}/warehouses/${whId}`,Date.now());
              for(const u of others)await dbSet(`users/${u}/warehouses/${whId}`,Date.now()).catch(()=>{});
              if(imgs)await dbSet(`itemImages/${whId}`,imgs);
            });
          });
        }else{
          showDeleteModal(wrap,isOwner?`למחוק את "${wh.name}"?`:`לעזוב את "${wh.name}"?`,async()=>{
            if(others.length===0){
              const snapshot=JSON.parse(JSON.stringify(wh));
              let imgs=null;try{imgs=await dbGet(`itemImages/${whId}`)}catch(e){}
              // Sole member: full cleanup. Images BEFORE the warehouse node —
              // once the node is gone the rules no longer see our membership.
              await dbRemove(`itemImages/${whId}`).catch(()=>{});
              await dbRemove(`warehouses/${whId}`);
              await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
              showUndoToast(`המחסן "${wh.name}" נמחק`,async()=>{
                await dbSet(`warehouses/${whId}`,snapshot);
                await dbSet(`users/${currentUser.username}/warehouses/${whId}`,Date.now());
                if(imgs)await dbSet(`itemImages/${whId}`,imgs);
              });
            }else{
              // Leaving a shared warehouse is not undoable — once out, the
              // rules don't let a non-member re-add themselves.
              await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
              await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
            }
          });
        }
      }
    }});
    moreBtn.appendChild(icon("more",18));
    const arrow=icon("back",18);arrow.style.color="var(--text-muted)";
    actions.append(moreBtn,arrow);
  }

  card.append(info,actions);
  cardWrapper.dataset.whId=whId;
  cardWrapper.appendChild(card);
}

// ═══════════ LIST DETAIL ═══════════
let currentSort="alpha"; // alpha, manual
let searchQuery="";
let pendingSearch=null; // set by the global search: pre-filled into the warehouse screen that opens
let reorderMode=false;
let lowFilter=false; // "show only low/out-of-stock" toggle (per screen visit)
let currentItems=[];
let currentWhId=null;
let dragSrcId=null;
let touchDrag=null;
let desktopDrag=null;
let whReorderMode=false;
let whDragSrcId=null;
let whTouchDrag=null;
let pendingListRender=false; // a list re-render deferred because a touch drag was active
let pendingWhRender=false;   // same, for the home warehouse list
let lastHomeWhIds=[];
let whCategories={}; // PERSONAL warehouse categories: whId -> name (users/<me>/whCategories)
let userPrefs={};    // PERSONAL global feature overrides (users/<me>/prefs): key:false hides the feature in ALL warehouses
let catFilter=null;  // active category chip on the home screen
let catOrder=[];     // personal display order of category names (users/<me>/catOrder)
let userWarehouseRole='member';
let currentWhData=null;

function memberCan(action){
  if(userWarehouseRole==='owner'||userWarehouseRole==='admin')return true;
  const perms=(currentWhData&&currentWhData.permissions)||{};
  return !perms['restrict_'+action];
}

function renderListDetail(whId){
  if(isWide()&&isShowingDetail&&currentWhId===whId&&!document.querySelector('.modal-overlay'))return;
  cleanup();currentSort="manual";searchQuery=pendingSearch||"";pendingSearch=null;reorderMode=false;lowFilter=false;userWarehouseRole='member';currentWhData=null;
  const wrap=el("div",{className:"screen",style:{paddingBottom:"calc(100px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)))"}});
  const header=el("div",{className:"header"});
  const hr=el("div",{style:{display:"flex",alignItems:"center",gap:"12px"}});
  const bb=el("button",{className:"icon-btn detail-back",style:{color:"var(--text)"},onClick:()=>renderHome()});
  bb.appendChild(icon("forward",24));
  const hi=el("div");const titleEl=el("h1",{style:{fontSize:"24px",fontWeight:"600"}});
  const countEl=el("span",{style:{fontSize:"13px",color:"var(--text-muted)"}});
  hi.append(titleEl,countEl);hr.append(bb,hi);
  const hl=el("div",{style:{display:"flex",gap:"8px"}});
  const rb=el("button",{className:"icon-btn",onClick:()=>{rb.classList.add("spinning");setTimeout(()=>rb.classList.remove("spinning"),600)}});
  rb.appendChild(icon("refresh",18));
  const historyBtn=el("button",{className:"icon-btn",onClick:()=>currentWhData&&showWarehouseHistoryModal(wrap,currentWhData)});
  historyBtn.appendChild(icon("history",20));
  const settingsBtn=el("button",{className:"icon-btn",onClick:()=>currentWhData&&showWarehouseSettingsModal(wrap,whId,currentWhData)});
  settingsBtn.appendChild(icon("settings",20));
  hl.append(rb,historyBtn,settingsBtn);header.append(hr,hl);wrap.appendChild(header);
  const content=el("div",{style:{padding:"16px 16px 0"}});wrap.appendChild(content);
  const fab=el("button",{className:"fab",onClick:()=>showNewItemModal(wrap,whId)});
  fab.appendChild(icon("plus",24));wrap.appendChild(fab);

  const scrollTopBtn=el("button",{className:"scroll-top-btn",onClick:()=>wrap.scrollTo({top:0,behavior:"smooth"})});
  scrollTopBtn.appendChild(icon("up",22));
  wrap.appendChild(scrollTopBtn);
  wrap.addEventListener("scroll",()=>{
    scrollTopBtn.classList.toggle("visible",wrap.scrollTop>300);
  });

  navShowDetail(wrap);

  dbListenCached(`warehouses/${whId}`,data=>{
    if(!data){renderHome();return}
    currentWhData=data;
    // Determine role for current user
    if(data.owner===currentUser.username) userWarehouseRole='owner';
    else if(data.roles&&data.roles[currentUser.username]==='admin') userWarehouseRole='admin';
    else userWarehouseRole='member';
    // Show/hide FAB based on permission
    fab.style.display=memberCan('add')?'flex':'none';
    titleEl.textContent=data.name;
    const items=data.items?Object.entries(data.items):[];
    countEl.textContent=`${items.length} פריטים`;
    migrateLegacyItemImages(whId,items);
    // Apply default sort from warehouse settings — but never override an active
    // manual-reorder session, or every drag-drop write (which re-triggers this
    // listener) would snap items back to the warehouse's default sort.
    if(data.sortMode&&!reorderMode)currentSort=data.sortMode;
    renderItemsView(content,whId,items,wrap);
    markSelectedWh();
  });
}

function renderItemsView(c,whId,items,wrap){
  currentItems=items;
  currentWhId=whId;
  // Only build search bar and toolbar once
  if(!wrap.querySelector('#searchWrap')){
    c.innerHTML="";
    
    // Insert search bar directly into wrap, after header, before content — so sticky works
    const searchWrap=el("div",{id:"searchWrap",style:{
      position:"sticky",top:"0",zIndex:"50",background:"var(--bg)",
      padding:"8px 16px 4px 16px"
    }});
    // Measure header height after render and adjust top
    requestAnimationFrame(()=>{
      const headerEl=wrap.querySelector('.header');
      if(headerEl)searchWrap.style.top=headerEl.offsetHeight+"px";
    });
    const searchRow=el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
    const searchBar=el("div",{className:"search-bar",style:{flex:"1",position:"relative"}});
    const searchInput=el("input",{className:"app-input",placeholder:"חיפוש פריט...",style:{paddingRight:"40px",paddingLeft:"40px"},id:"searchInput"});
    const closeBtn=el("button",{className:"btn btn-ghost",id:"searchClose",style:{padding:"10px 14px",borderRadius:"8px",whiteSpace:"nowrap",fontSize:"13px",height:"46px",display:"none"},onClick:()=>{
      searchInput.value="";searchQuery="";clearBtn.style.display="none";closeBtn.style.display="none";searchInput.blur();renderItemsList(c,currentWhId,currentItems,wrap);
    }},"ביטול");
    searchInput.addEventListener("input",e=>{searchQuery=e.target.value;clearBtn.style.display=searchQuery?"flex":"none";renderItemsList(c,currentWhId,currentItems,wrap)});
    searchInput.addEventListener("focus",()=>{closeBtn.style.display="flex"});
    searchInput.addEventListener("blur",()=>{if(!searchQuery)setTimeout(()=>{closeBtn.style.display="none"},150)});
    if(searchQuery)searchInput.value=searchQuery;
    searchBar.appendChild(searchInput);
    const searchIcon=icon("search",18);searchBar.appendChild(searchIcon);
    const clearBtn=el("button",{id:"searchClear",style:{position:"absolute",left:"12px",top:"50%",transform:"translateY(-50%)",background:"var(--border)",border:"none",borderRadius:"6px",width:"22px",height:"22px",color:"var(--text)",cursor:"pointer",display:"none",alignItems:"center",justifyContent:"center",padding:"0"},onClick:()=>{
      searchInput.value="";searchQuery="";clearBtn.style.display="none";searchInput.focus();renderItemsList(c,currentWhId,currentItems,wrap);
    }});
    clearBtn.appendChild(icon("close",14));
    if(searchQuery)clearBtn.style.display="flex";
    searchBar.appendChild(clearBtn);
    searchRow.appendChild(searchBar);
    searchRow.appendChild(closeBtn);
    searchWrap.appendChild(searchRow);
    
    // Toolbar inside searchWrap so it sticks too
    const toolbar=el("div",{className:"toolbar",id:"toolbar",style:{marginTop:"8px"}});
    
    // Sort button → action sheet
    const sortWrap=el("div",{style:{position:"relative"}});
    const sortBtn=el("button",{className:"toolbar-btn",onClick:async()=>{
      const choice=await showActionSheet([
        {label:"לפי א-ב",value:"alpha"},
        {label:"כמות: גבוה לנמוך",value:"qty-desc"},
        {label:"כמות: נמוך לגבוה",value:"qty-asc"},
        {label:"שנה סדר ידני",value:"reorder"},
      ]);
      if(!choice)return;
      if(choice==="reorder"){
        reorderMode=!reorderMode;currentSort="manual";
        // Search and manual reorder don't mix: dragging a FILTERED list would
        // renumber only the visible subset (1..k) and collide with everyone
        // else's order values. Clear the query on entry; the box is disabled
        // for the duration of reorder mode (see renderItemsList).
        if(reorderMode){searchQuery="";const si=wrap.querySelector('#searchInput');if(si)si.value="";const cb=wrap.querySelector('#searchClear');if(cb)cb.style.display="none"}
        renderItemsList(c,currentWhId,currentItems,wrap);
      }else{
        const sorted=[...currentItems].sort((a,b)=>{
          if(choice==="alpha")return a[1].name.localeCompare(b[1].name,"he");
          if(choice==="qty-desc")return (b[1].quantity||0)-(a[1].quantity||0);
          return (a[1].quantity||0)-(b[1].quantity||0);
        });
        const updates={};sorted.forEach(([id],i)=>{updates[`items/${id}/order`]=i+1});
        // These buttons rewrite the shared order for everyone, so the warehouse
        // must switch to manual mode or a non-manual default sort keeps
        // overriding what was just written.
        updates["sortMode"]="manual";
        if(currentWhData)currentWhData.sortMode="manual";
        await dbUpdate(`warehouses/${currentWhId}`,updates);
      }
    }});
    sortBtn.appendChild(icon("sort",14));sortBtn.appendChild(document.createTextNode("סידור"));
    sortWrap.appendChild(sortBtn);

    const resetBtn=el("button",{className:"toolbar-btn danger-hover",style:{display:memberCan('reset')?'':'none'},onClick:async()=>{
      const choice=await showActionSheet([{label:"אפס את כל הכמויות ל-0",style:"danger",value:"confirm"}]);
      if(choice!=="confirm")return;
      const whIdNow=currentWhId;
      const prevQuantities={};
      const updates={};
      currentItems.forEach(([id,item])=>{
        prevQuantities[id]=item.quantity||0;
        updates[`items/${id}/quantity`]=0;
        updates[`items/${id}/history/${genId()}`]={action:"איפוס",amount:item.quantity||0,result:0,by:currentUser.displayName,date:new Date().toISOString()};
      });
      await dbUpdate(`warehouses/${whIdNow}`,updates);
      showUndoToast("כל הכמויות אופסו",async()=>{
        const upd={};
        Object.entries(prevQuantities).forEach(([id,q])=>{
          if(q>0){
            upd[`items/${id}/quantity`]=q;
            upd[`items/${id}/history/${genId()}`]={action:"שחזור",amount:q,result:q,by:currentUser.displayName,date:new Date().toISOString()};
          }
        });
        if(Object.keys(upd).length)await dbUpdate(`warehouses/${whIdNow}`,upd);
      });
    }});
    resetBtn.appendChild(icon("zero",16));resetBtn.appendChild(document.createTextNode("אפס כמויות"));
    const countBtn=el("button",{className:"toolbar-btn",onClick:()=>showStockCountModal(wrap,currentWhId)});
    countBtn.appendChild(icon("count",16));countBtn.appendChild(document.createTextNode("ספירת מלאי"));
    const exportBtn=el("button",{className:"toolbar-btn",onClick:()=>showExportModal(wrap,currentWhId,currentItems)});
    exportBtn.appendChild(icon("export",16));exportBtn.appendChild(document.createTextNode("יצוא רשימה"));
    const importBtn=el("button",{className:"toolbar-btn",style:{display:memberCan('add')?'':'none'},onClick:()=>showImportModal(wrap,currentWhId)});
    importBtn.appendChild(icon("import",16));importBtn.appendChild(document.createTextNode("ייבוא"));
    toolbar.append(sortWrap,countBtn,resetBtn,exportBtn,importBtn);
    searchWrap.appendChild(toolbar);
    
    // Insert searchWrap into wrap, right before content
    wrap.insertBefore(searchWrap,c);

    const listContainer=el("div",{id:"itemsList"});
    c.appendChild(listContainer);
  }

  // Update search input value without losing focus
  const searchInput=wrap.querySelector('#searchInput');
  if(searchInput&&document.activeElement!==searchInput){searchInput.value=searchQuery}

  renderItemsList(c,whId,items,wrap);
}

// FLIP-style reorder helpers for the manual drag-to-reorder feature: as the
// dragged card crosses other cards, we move its element to its new slot in the
// real DOM order and animate every displaced card sliding into place — so
// items visibly make room for the one being dragged, instead of just
// highlighting whichever card sits under the pointer.
function indexForY(cardEls,y){
  // Measure each card's LAYOUT position, not its animated position: cards mid
  // slide (transform transition running) report their in-flight rect, so near a
  // slot boundary the computed index flip-flopped every frame and the whole list
  // visibly shook. Every drag transform we set is an inline translateY, so
  // subtracting it back out of the rect gives the true resting position.
  for(let i=0;i<cardEls.length;i++){
    const r=cardEls[i].getBoundingClientRect();
    const m=/translateY\((-?[\d.]+)px\)/.exec(cardEls[i].style.transform);
    const top=m?r.top-parseFloat(m[1]):r.top;
    if(y<top+r.height/2)return i;
  }
  return cardEls.length-1;
}
// Wipes every drag-related inline style off every card in the list. Called at the
// start and end of every drag so a card can never be left displaced/invisible by
// a half-finished animation — which is what produced the stuck cards and the
// card-sized gaps in the list on Android.
function clearDragStyles(container){
  [...container.children].forEach(elm=>{
    elm.style.transition="";elm.style.transform="";elm.style.opacity="";
    elm.style.zIndex="";elm.style.boxShadow="";
  });
}
function flipReorder(container,cardEls,fromIndex,toIndex,skipEl){
  if(fromIndex===toIndex||fromIndex<0||toIndex<0)return cardEls;
  const firstRects=new Map();
  // Freeze any in-flight transition BEFORE measuring: getBoundingClientRect on a
  // mid-animation element returns its animated position, not its layout position,
  // so measuring without this makes each successive reorder compute its offset
  // against a wrong baseline — the errors compound into the visible gaps.
  cardEls.forEach(elm=>{if(elm!==skipEl){elm.style.transition="none";elm.style.transform=""}});
  void container.offsetHeight;
  cardEls.forEach(elm=>firstRects.set(elm,elm.getBoundingClientRect()));
  const newArr=[...cardEls];
  const[moved]=newArr.splice(fromIndex,1);
  newArr.splice(toIndex,0,moved);
  // Commit the new order WITHOUT ever detaching skipEl (the card being
  // dragged): appendChild on a node = detach + re-insert, and on Android
  // Chrome detaching the element an active touch sequence started on silently
  // kills the stream — no more touchmove, often no touchcancel either — which
  // is exactly the mid-drag freeze. Iterating in reverse and moving only the
  // OTHER cards around skipEl produces the same final order while the touch
  // target stays attached the whole time.
  let domRef=null;
  for(let i=newArr.length-1;i>=0;i--){
    const elm=newArr[i];
    if(elm===skipEl){domRef=elm;continue}
    if(elm.nextSibling!==domRef)container.insertBefore(elm,domRef);
    domRef=elm;
  }
  newArr.forEach(elm=>{
    if(elm===skipEl)return;
    const first=firstRects.get(elm);
    const last=elm.getBoundingClientRect();
    const dy=first.top-last.top;
    if(dy){
      elm.style.transition="none";
      elm.style.transform=`translateY(${dy}px)`;
      // Force a layout flush so the browser commits the "jump back to old spot"
      // state above before we flip the transition back on — a nested
      // requestAnimationFrame here (the previous approach) can interleave with a
      // *second* reorder landing before the first one's frame fires, leaving a
      // card's transform permanently stuck mid-animation (the frozen/duplicated
      // card seen on Android). Reading offsetHeight is synchronous, so there's no
      // window for another call to race it.
      void elm.offsetHeight;
      elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
      elm.style.transform="";
    }
  });
  return newArr;
}

// Low-stock: an item with lowStock set is "low" when 0 < quantity <= lowStock.
// Quantity 0 is "out of stock" regardless of threshold.
// A feature is on only when it is not disabled globally by the user AND not disabled in the warehouse.
// showLowStock is OFF by default: an admin must enable it per warehouse. Other features are ON by default.
const FEAT_DEFAULT_OFF={showLowStock:true};
function whFeatOn(features,key){return FEAT_DEFAULT_OFF[key]?features?.[key]===true:features?.[key]!==false}
function featOn(key){return userPrefs[key]!==false&&whFeatOn(currentWhData?.features,key)}
function lowStockOn(){return featOn('showLowStock')}
function isLowStock(it){
  if(!lowStockOn())return false;
  const q=it.quantity||0;const t=parseInt(it.lowStock);
  return t>0&&q>0&&q<=t;
}
function stockChip(it){
  if(!lowStockOn())return null;
  const q=it.quantity||0;
  const label=q===0?"אזל":isLowStock(it)?"מלאי נמוך":null;
  if(!label)return null;
  const danger=q===0;
  return el("span",{className:"stock-chip",style:{fontSize:"13px",fontWeight:"600",
    color:danger?"var(--danger)":"var(--warning)"}},label);
}
function qtyColor(it){
  const q=it.quantity||0;
  if(q===0)return lowStockOn()?"var(--danger)":"var(--danger)";
  return isLowStock(it)?"var(--warning)":"var(--text)";
}

function renderItemsList(c,whId,items,wrap){
  const listContainer=c.querySelector('#itemsList');
  if(!listContainer)return;

  // A re-render arriving MID-DRAG (another user's update coming through the
  // listener) would replace the cards under the user's finger and break the
  // gesture — defer it; finishTouchDrag re-renders with the fresh data.
  if(touchDrag){pendingListRender=true;return}
  // Search is disabled while reordering (see the sort action sheet comment).
  const searchInputEl=wrap.querySelector('#searchInput');
  if(searchInputEl){
    searchInputEl.disabled=reorderMode;
    searchInputEl.placeholder=reorderMode?"החיפוש כבוי בזמן סידור ידני":"חיפוש פריט...";
  }

  let filtered=items;
  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    filtered=items.filter(([,item])=>item.name.toLowerCase().includes(q)||(item.note&&item.note.toLowerCase().includes(q))||(item.sku&&item.sku.toLowerCase().includes(q)));
  }
  if(currentSort==="alpha"){
    filtered=[...filtered].sort((a,b)=>a[1].name.localeCompare(b[1].name,"he"));
  }else if(currentSort==="qty-desc"){
    filtered=[...filtered].sort((a,b)=>(b[1].quantity||0)-(a[1].quantity||0));
  }else if(currentSort==="qty-asc"){
    filtered=[...filtered].sort((a,b)=>(a[1].quantity||0)-(b[1].quantity||0));
  }else{
    filtered=[...filtered].sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  }
  if(!lowStockOn()&&lowFilter)lowFilter=false;
  if(lowFilter)filtered=filtered.filter(([,it])=>(it.quantity||0)===0||isLowStock(it));
  const lowCount=lowStockOn()?items.filter(([,it])=>(it.quantity||0)===0||isLowStock(it)).length:0;

  // Check if we can do an in-place update (same items, same order)
  const existingCards=listContainer.querySelectorAll('[data-item-id]');
  const existingIds=[...existingCards].map(c=>c.dataset.itemId);
  const newIds=filtered.map(([id])=>id);
  const sameStructure=existingIds.length===newIds.length&&existingIds.every((id,i)=>id===newIds[i]);
  // If the currently-rendered DOM is still showing reorder-mode chrome (drag
  // handles / the save bar) but reorderMode just turned off (or vice versa),
  // force a full rebuild even if the item ids match — otherwise the smart
  // in-place update below skips touching that chrome and the "שמור" button
  // (and drag handles) look like they did nothing.
  const listWasInReorderMode=!!listContainer.querySelector('.drag-handle');

  if(sameStructure&&existingIds.length>0&&!reorderMode&&!listWasInReorderMode){
    // Smart update - only update quantities, names, notes
    filtered.forEach(([itemId,item])=>{
      const card=listContainer.querySelector(`[data-item-id="${itemId}"]`);
      if(!card)return;
      const qtyEl=card.querySelector('.item-qty');
      if(qtyEl&&qtyEl.textContent!==String(item.quantity||0)){
        qtyEl.textContent=String(item.quantity||0);
        // Brief flash animation
        qtyEl.style.transition="transform 0.15s";
        qtyEl.style.transform="scale(1.2)";
        setTimeout(()=>{qtyEl.style.transform="scale(1)"},150);
      }
      if(qtyEl){
        qtyEl.style.color=qtyColor(item);
        const qrow=card.querySelector('.item-qty-row');
        const oldChip=qrow?qrow.querySelector('.stock-chip'):null;
        const fresh=stockChip(item);
        const desired=fresh?fresh.textContent:null;
        if((oldChip?oldChip.textContent:null)!==desired){
          if(oldChip)oldChip.remove();
          if(fresh&&qrow)qrow.appendChild(fresh);
        }
      }
      const nameEl=card.querySelector('.item-name');
      if(nameEl&&nameEl.textContent!==item.name)nameEl.textContent=item.name;
      const showImgs=featOn('showImages');
      const slotEl=card.querySelector('.item-img-slot');
      if(showImgs){
        if(slotEl){
          const thumbEl=slotEl.querySelector('.item-thumb');
          const thumbSrc=item.thumb||item.image;
          if(thumbSrc){if(thumbEl){if(thumbEl.src!==thumbSrc)thumbEl.src=thumbSrc;}else{const t=el("img",{className:"item-thumb",src:thumbSrc,loading:"lazy",decoding:"async",onClick:async()=>{const v=showImageViewer(item.thumb||thumbSrc);const full=await fetchFullImage(whId,itemId,item);if(v&&full)v.src=full}});slotEl.appendChild(t);}}
          else if(thumbEl)thumbEl.remove();
        }
      }else if(slotEl)slotEl.remove();
      const showSku=featOn('showSku');
      const skuEl=card.querySelector('.item-sku');
      if(showSku&&item.sku){
        if(skuEl)skuEl.textContent=`מק"ט: ${item.sku}`;
        else{const ne=el("div",{className:"item-sku",style:{fontSize:"13px",color:"var(--text-muted)",marginBottom:"2px"}},`מק"ט: ${item.sku}`);const info=card.querySelector('.item-info');if(info)info.insertBefore(ne,info.querySelector('.item-note')||info.querySelector('.item-qty-row'));}
      }else if(skuEl)skuEl.remove();
      const noteEl=card.querySelector('.item-note');
      if(item.note){
        if(noteEl)noteEl.textContent=item.note;
        else{
          const ne=el("div",{className:"note-text item-note"},item.note);
          const info=card.querySelector('.item-info');
          if(info)info.insertBefore(ne,info.querySelector('.item-qty-row'));
        }
      }else if(noteEl)noteEl.remove();
    });
    const lb=listContainer.querySelector('#lowBanner');
    if(lb){
      const txt=lb.querySelector('.low-banner-text');
      if(txt)txt.textContent=`${lowCount} פריטים בחוסר או במלאי נמוך`;
      lb.style.display=(lowCount>0||lowFilter)?"flex":"none";
    }
    return;
  }

  // Full rebuild needed (items added/removed/reordered)
  listContainer.innerHTML="";

  if(reorderMode){
    const saveBar=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",background:"var(--surface)",border:"1px solid var(--accent-line)",borderRadius:"8px",padding:"8px 16px",marginBottom:"16px"}});
    saveBar.appendChild(el("span",{style:{fontSize:"13px",color:"var(--accent)",fontWeight:"400"}},"מצב סידור ידני — גרור פריטים לסידור"));
    const doneBtn=el("button",{className:"btn btn-primary btn-sm",onClick:()=>{
      reorderMode=false;
      renderItemsList(c,whId,items,wrap);
    }},"שמור");
    saveBar.appendChild(doneBtn);
    listContainer.appendChild(saveBar);
  }

  {
    const lb=el("div",{id:"lowBanner",style:{display:(lowCount>0||lowFilter)?"flex":"none",alignItems:"center",gap:"8px",
      background:"transparent",
      border:"1px solid "+(lowFilter?"var(--warning-line)":"var(--border)"),
      borderRadius:"8px",padding:"9px 14px",marginBottom:"10px",cursor:"pointer",fontSize:"13px",color:"var(--warning)"},
      onClick:()=>{lowFilter=!lowFilter;renderItemsList(c,whId,items,wrap)}});
    lb.appendChild(el("span",{className:"low-banner-text",style:{flex:"1",fontWeight:"400"}},`${lowCount} פריטים בחוסר או במלאי נמוך`));
    lb.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)"}},lowFilter?"הצג הכל":"הצג רק אותם"));
    listContainer.appendChild(lb);
  }

  if(filtered.length===0&&items.length>0){
    listContainer.appendChild(el("div",{className:"empty-state",style:{padding:"30px 20px"}},
      el("p",{style:{fontSize:"13px"}},"אין פריטים שמתאימים לסינון הזה")
    ));return;
  }
  if(filtered.length===0){
    const empty=el("div",{className:"empty-state"});
    empty.appendChild(el("p",{style:{fontSize:"16px",color:"var(--text)"}},"המחסן ריק"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"8px"}},"הוסף פריט ראשון בכפתור + למטה."));
    listContainer.appendChild(empty);return;
  }

  const itemsContainer=el("div");
  filtered.forEach(([itemId,item],i)=>{
    const card=el("div",{className:"item-card",style:{marginBottom:"0"}});
    card.dataset.itemId=itemId;

    if(reorderMode){
      // Drag handle
      const handle=el("div",{className:"drag-handle",style:{marginLeft:"8px",display:"flex",alignItems:"center"}});
      handle.appendChild(icon("grip",22));
      card.appendChild(handle);
      card.setAttribute("draggable","true");

      // HTML5 drag (desktop) — live "push apart" reorder: as the pointer crosses
      // other cards they slide out of the way (FLIP animation) instead of just
      // highlighting a drop target.
      card.addEventListener("dragstart",e=>{
        dragSrcId=itemId;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",itemId);
        const cardEls=[...itemsContainer.children];
        desktopDrag={cardEls,dragIndex:cardEls.indexOf(card),curIndex:cardEls.indexOf(card),srcEl:card};
      });
      card.addEventListener("dragend",()=>{
        card.classList.remove("dragging");
        dragSrcId=null;desktopDrag=null;
        clearDragStyles(itemsContainer);
      });
      card.addEventListener("dragover",e=>{
        e.preventDefault();e.dataTransfer.dropEffect="move";
        if(!desktopDrag)return;
        const newIndex=indexForY(desktopDrag.cardEls,e.clientY);
        if(newIndex!==desktopDrag.curIndex){
          desktopDrag.cardEls=flipReorder(itemsContainer,desktopDrag.cardEls,desktopDrag.curIndex,newIndex,desktopDrag.srcEl);
          desktopDrag.curIndex=newIndex;
        }
      });
      card.addEventListener("drop",async e=>{
        e.preventDefault();
        if(!desktopDrag)return;
        const finalEls=desktopDrag.cardEls;
        const changed=desktopDrag.dragIndex!==desktopDrag.curIndex;
        if(changed){
          const updates={};
          finalEls.forEach((elm,i)=>{updates[`items/${elm.dataset.itemId}/order`]=i+1});
          updates["sortMode"]="manual"; // see the touch-drag commit comment
          if(currentWhData)currentWhData.sortMode="manual";
          await dbUpdate(`warehouses/${whId}`,updates);
        }
      });

      // Touch drag (mobile) — transform-only while the finger is down. The
      // previous design re-ordered the real DOM on every crossing (FLIP), which
      // caused both mobile bugs: (1) detaching/re-inserting cards mid-gesture
      // can break the Android touch stream, so touchend/touchcancel never
      // arrive and the lifted card stays stranded on top of the list until the
      // next drag's cleanup; (2) picking the drop slot by measuring cards that
      // are mid-slide returns their in-flight positions, so near a boundary the
      // computed slot flip-flopped every frame and the list below the finger
      // visibly shook (iPhone). Now NOTHING in the DOM moves and NOTHING is
      // measured during the drag: the layout is measured once at touchstart,
      // the dragged card follows the finger with a transform, displaced cards
      // slide by a fixed precomputed distance, and the drop slot is derived
      // purely from that frozen geometry. The real re-order happens exactly
      // once, at drop, via the normal re-render.
      handle.addEventListener("touchstart",e=>{
        e.preventDefault();
        if(touchDrag)return; // a second finger must not hijack an active drag
        // Start from a guaranteed-clean slate — if any previous drag left a card
        // displaced (interrupted gesture, backgrounded app, etc.) this wipes it
        // instead of measuring against the broken state.
        clearDragStyles(itemsContainer);
        const touch=e.touches[0];
        const cardEls=[...itemsContainer.children];
        const rects=cardEls.map(elm=>elm.getBoundingClientRect());
        const dragIndex=cardEls.indexOf(card);
        const rect=rects[dragIndex];
        const gap=rects.length>1?rects[1].top-rects[0].bottom:8;
        touchDrag={itemId,grabOffsetY:touch.clientY-rect.top,cardHeight:rect.height,
          lastClientY:touch.clientY,cardEls,dragIndex,curIndex:dragIndex,rafId:null,
          startTop:rect.top,
          // Frozen geometry: every card's original midpoint, and how far a
          // displaced card must slide (one dragged-card slot).
          mids:rects.map(r=>r.top+r.height/2),shift:rect.height+gap,
          docEnd:null,docCancel:null};
        card.classList.add("drag-active");
        card.style.zIndex="500";
        card.style.position="relative";
        card.style.boxShadow="0 0 0 1px var(--accent-line)";
        // Safety net: also end the drag from document level, in case the handle
        // itself ever misses the end of the stream. Only when the LAST finger
        // lifts, so resting a second finger on the screen can't end the drag.
        touchDrag.docEnd=ev=>{if(ev.touches.length===0)finishTouchDrag(true)};
        touchDrag.docCancel=ev=>{if(ev.touches.length===0)finishTouchDrag(false)};
        document.addEventListener("touchend",touchDrag.docEnd);
        document.addEventListener("touchcancel",touchDrag.docCancel);
      },{passive:false});
      const updateDragFrame=()=>{
        const top=touchDrag.lastClientY-touchDrag.grabOffsetY;
        card.style.transform=`translateY(${top-touchDrag.startTop}px)`;
        // Drop slot from the geometry frozen at touchstart: how many OTHER
        // cards' original midpoints sit above the dragged card's center. Static
        // inputs, so the result can't oscillate the way live measurement of
        // animating cards did.
        const center=top+touchDrag.cardHeight/2;
        let newIndex=0;
        for(let i=0;i<touchDrag.mids.length;i++){
          if(i===touchDrag.dragIndex)continue;
          if(center>touchDrag.mids[i])newIndex++;
        }
        if(newIndex!==touchDrag.curIndex){
          touchDrag.curIndex=newIndex;
          touchDrag.cardEls.forEach((elm,i)=>{
            if(i===touchDrag.dragIndex)return;
            let dy=0;
            if(i>touchDrag.dragIndex&&i<=touchDrag.curIndex)dy=-touchDrag.shift;
            else if(i<touchDrag.dragIndex&&i>=touchDrag.curIndex)dy=touchDrag.shift;
            const t=dy?`translateY(${dy}px)`:"";
            if(elm.style.transform!==t){
              elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
              elm.style.transform=t;
            }
          });
        }
      };
      handle.addEventListener("touchmove",e=>{
        if(!touchDrag)return;e.preventDefault();
        touchDrag.lastClientY=e.touches[0].clientY;
        if(touchDrag.rafId)return;
        touchDrag.rafId=requestAnimationFrame(()=>{
          if(!touchDrag)return;
          touchDrag.rafId=null;
          updateDragFrame();
        });
      },{passive:false});
      const finishTouchDrag=async(commit)=>{
        if(!touchDrag)return;
        if(touchDrag.rafId)cancelAnimationFrame(touchDrag.rafId);
        document.removeEventListener("touchend",touchDrag.docEnd);
        document.removeEventListener("touchcancel",touchDrag.docCancel);
        card.classList.remove("drag-active");
        card.style.position="";
        const{cardEls,dragIndex,curIndex}=touchDrag;
        touchDrag=null;
        clearDragStyles(itemsContainer);
        const changed=dragIndex!==curIndex;
        if(commit&&changed){
          const finalEls=[...cardEls];
          const[moved]=finalEls.splice(dragIndex,1);
          finalEls.splice(curIndex,0,moved);
          // Update the in-memory order FIRST and re-render synchronously — the
          // DOM was deliberately left in the old order during the drag, so
          // rendering before the (async) DB write is what prevents a visible
          // snap-back to the old order while the write is in flight.
          finalEls.forEach((elm,i)=>{
            const id=elm.dataset.itemId;
            const entry=items.find(([eid])=>eid===id);
            if(entry)entry[1].order=i+1;
            // If a fresher items array arrived mid-drag, mirror the order there
            // too so the deferred re-render below agrees with the drop.
            if(currentItems!==items){const ce=currentItems.find(([eid])=>eid===id);if(ce)ce[1].order=i+1;}
          });
          renderItemsList(c,whId,pendingListRender?currentItems:items,wrap);
          pendingListRender=false;
          const updates={};
          finalEls.forEach((elm,i)=>{updates[`items/${elm.dataset.itemId}/order`]=i+1});
          // Without this, a warehouse whose default sort is alpha/qty re-sorts
          // on every other device and the manual order is silently invisible
          // there (and here too, after leaving and re-entering the list).
          updates["sortMode"]="manual";
          if(currentWhData)currentWhData.sortMode="manual";
          await dbUpdate(`warehouses/${whId}`,updates);
        }else{
          renderItemsList(c,whId,pendingListRender?currentItems:items,wrap);
          pendingListRender=false;
        }
      };
      handle.addEventListener("touchend",()=>finishTouchDrag(true));
      handle.addEventListener("touchcancel",()=>finishTouchDrag(false));
    }

    const info=el("div",{className:"item-info",style:{flex:"1",minWidth:"0"}});

      const ab=el("button",{className:"qty-btn qty-btn-add",onClick:()=>{const fresh=currentItems.find(([id])=>id===itemId);if(fresh)item=fresh[1];showAdjustModal(wrap,whId,itemId,item,"add")}});ab.appendChild(icon("plus",20));

          if(canEdit)mainOpts.push({label:`מחק "${item.name}"`,style:"danger",value:"delete"});

            });

              await dbUpdate(`warehouses/${whId}`,{
                [`items/${itemId}/quantity`]:prevQ,

              });

              const snapshot=JSON.parse(JSON.stringify(item));

// ═══════════ IMAGE HELPERS ═══════════
// Full-size images are stored separately at itemImages/{whId}/{itemId} (NOT inside
// the warehouse/items tree) so opening a warehouse only downloads small thumbnails.
// The full image is fetched on demand only when someone actually opens the viewer.
function encodeImageVariants(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      function toDataUrl(maxPx,quality){
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        return canvas.toDataURL('image/jpeg',quality);
      }
      // Thumb kept small on purpose: it rides inside the warehouse payload, so
      // every extra KB slows the whole list's first paint.
      cb({full:toDataUrl(800,0.72),thumb:toDataUrl(96,0.5)});
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function makeThumbFromDataUrl(dataUrl,maxPx,quality,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    cb(canvas.toDataURL('image/jpeg',quality));
  };
  img.src=dataUrl;
}
// Returns the full-resolution image for viewing. Legacy items (from before this
// change) still carry it inline as item.image; newer items keep it at itemImages/.
const fullImageCache=new Map(); // whId/itemId -> data URL, for this session
async function fetchFullImage(whId,itemId,item){
  if(item.image)return item.image;
  const key=whId+"/"+itemId;
  if(fullImageCache.has(key))return fullImageCache.get(key);
  const full=await dbGet(`itemImages/${whId}/${itemId}`);
  const val=full||item.thumb||null;
  if(full)fullImageCache.set(key,full);
  return val;
}
// One-time background migration: moves any old inline item.image out to itemImages/
// and leaves a small item.thumb behind, so the item stops being part of every
// warehouse load. Naturally stops repeating once item.image is cleared.
const migratingItemImages=new Set();
async function migrateLegacyItemImages(whId,items){
  for(const[itemId,item] of items){
    // Any inline image gets moved out — including copied items that already
    // arrive with a thumb (their existing thumb is reused as-is).
    if(!item.image)continue;
    const key=whId+"/"+itemId;
    if(migratingItemImages.has(key))continue;
    migratingItemImages.add(key);
    try{
      const thumb=item.thumb||await new Promise(res=>makeThumbFromDataUrl(item.image,96,0.5,res));
      await dbSet(`itemImages/${whId}/${itemId}`,item.image);
      await dbUpdate(`warehouses/${whId}`,{[`items/${itemId}/thumb`]:thumb,[`items/${itemId}/image`]:null});
    }catch(e){/* leave it; will retry on next load */}
    finally{migratingItemImages.delete(key)}
  }
}

function showImageViewer(imgData){
  let closed=false,moved=false;
  const close=()=>{if(closed)return;closed=true;ov.remove();popNav()};
  const ov=el('div',{className:'viewer-overlay',style:{position:'fixed',inset:'0',zIndex:'5000',background:'rgba(0,0,0,0.96)',display:'flex',alignItems:'center',justifyContent:'center',touchAction:'none'},onClick:()=>{if(moved){moved=false;return}close()}});pushNav();
  const img=el('img',{src:imgData,decoding:'async',style:{maxWidth:'92vw',maxHeight:'88vh',borderRadius:'8px',objectFit:'contain',willChange:'transform'}});
  const closeHint=el('div',{style:{position:'absolute',bottom:'calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)))',left:'0',right:'0',textAlign:'center',fontSize:'13px',color:'rgba(255,255,255,0.4)'}},'החלק למטה או הקש לסגירה');
  // Swipe down to dismiss, like Photos: the picture follows the finger and the
  // backdrop fades; far enough or fast enough closes it, otherwise it springs back.
  let y0=0,t0=0,dy=0,dragging=false,vy=0,lastY=0,lastT=0;
  ov.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;dragging=true;y0=lastY=e.touches[0].clientY;t0=lastT=Date.now();dy=0;vy=0;img.style.transition='none';ov.style.transition='none'},{passive:true});
  ov.addEventListener('touchmove',e=>{
    if(!dragging)return;const y=e.touches[0].clientY,t=Date.now();if(t>lastT)vy=(y-lastY)/(t-lastT);lastY=y;lastT=t;dy=Math.max(0,y-y0);
    if(dy>8)moved=true;
    img.style.transform=`translateY(${dy}px) scale(${1-Math.min(dy/1600,0.12)})`;
    ov.style.background=`rgba(0,0,0,${0.96*Math.max(0.15,1-dy/400)})`;
  },{passive:true});
  const end=()=>{
    if(!dragging)return;dragging=false;
    const fast=dy>40&&vy>0.5; // flick: speed of the last movement, in px/ms
    img.style.transition='transform .18s ease';ov.style.transition='background .18s ease, opacity .18s ease';
    if(dy>120||fast){img.style.transform=`translateY(${window.innerHeight}px)`;ov.style.opacity='0';setTimeout(close,180)}
    else{img.style.transform='';ov.style.background='rgba(0,0,0,0.96)'}
    setTimeout(()=>{moved=false},350); // only swallow the click that the drag itself produces
  };
  ov.addEventListener('touchend',end);ov.addEventListener('touchcancel',end);
  ov.append(img,closeHint);document.body.appendChild(ov);
  return img; // caller can swap in a higher-res source once it arrives
}

// ═══════════ KEYBOARD-AWARE OVERLAYS ═══════════
// --vv-h / --vv-top follow the visible viewport, so modals sit above the
// on-screen keyboard instead of under it; the focused field is kept in view.
(function(){
  const vv=window.visualViewport;if(!vv)return;
  const root=document.documentElement;
  const sync=()=>{root.style.setProperty('--vv-h',vv.height+'px');root.style.setProperty('--vv-top',vv.offsetTop+'px')};
  vv.addEventListener('resize',sync);vv.addEventListener('scroll',sync);sync();
  document.addEventListener('focusin',e=>{
    const t=e.target;if(!t||!t.closest||!t.closest('.modal,.fullscreen-modal'))return;
    setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},250);
  });
})();

function showActionSheet(items,title){
  return new Promise(resolve=>{
    const ov=el("div",{className:"action-sheet-overlay"});
    const panel=el("div",{className:"action-sheet-panel"});
    let done=false;
    const dismiss=val=>{
      if(done)return;done=true;popNav();
      // Animate out: the panel slides back down while the backdrop fades.
      ov.style.opacity="0";
      panel.style.transform="translateY(100%)";
      setTimeout(()=>ov.remove(),200);
      resolve(val);
    };
    ov.addEventListener("click",e=>{if(e.target===ov)dismiss(null)});
    panel.appendChild(el("div",{className:"sheet-grabber"}));
    if(title){
      panel.appendChild(el("div",{style:{padding:"4px 22px 12px",textAlign:"center",fontSize:"13px",color:"var(--text-muted)",borderBottom:"1px solid var(--border)"}},title));
    }
    items.forEach(({label,style:st,value})=>{
      panel.appendChild(el("button",{className:"action-sheet-item"+(st==='danger'?' danger':''),onClick:()=>dismiss(value)},label));
    });
    panel.appendChild(el("button",{className:"action-sheet-cancel",onClick:()=>dismiss(null)},"ביטול"));
    pushNav();
    ov.appendChild(panel);
    document.body.appendChild(ov);
  });
}

    const qi=el("input",{className:"app-input",type:"number",inputMode:"numeric",placeholder:"הכנס כמות"});m.appendChild(qi);
    const pv=el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginTop:"10px",textAlign:"center",minHeight:"20px"}});m.appendChild(pv);
    function up(){const a=parseInt(qi.value);if(!a||a<=0){pv.textContent="";return}const c=item.quantity||0;const r=cm==="add"?c+a:Math.max(0,c-a);pv.innerHTML=`${c} ${cm==="add"?"+":"−"} ${a} = <span style="color:var(--accent);font-weight:600;font-size:24px">${r}</span>`}
    qi.addEventListener("input",up);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const ab=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const a=parseInt(qi.value);if(!a||a<=0)return;ab.disabled=true;
      // Atomic adjust: quantity is written as a server-side increment, and the
      // history entry rides in the SAME update — two users adjusting at once
      // can no longer overwrite each other (the old read-then-set flow could).
      // The fresh read only clamps removals at zero and estimates the result
      // for the history line.
      // Fresh read, but never let it hang the button: offline it can stall.
      const freshItem=await Promise.race([dbGet(`warehouses/${whId}/items/${itemId}`).catch(()=>item),new Promise(r=>setTimeout(()=>r(item),2500))]);
      const c=freshItem?freshItem.quantity||0:item.quantity||0;
      const delta=cm==="add"?a:-Math.min(a,c);
      if(delta===0){close();return}
      const nq=Math.max(0,c+delta);
      writeOrWarn(dbUpdate(`warehouses/${whId}`,{
        [`items/${itemId}/quantity`]:FB.increment(delta),
        [`items/${itemId}/history/${genId()}`]:{action:cm==="add"?"הוספה":"הורדה",amount:Math.abs(delta),result:nq,by:currentUser.displayName,date:new Date().toISOString()}
      }));
      close();
      showNotice(`הכמות של "${item.name}" עודכנה ל-${nq}`);
    }},cm==="add"?"הוסף":"הורד");btns.appendChild(ab);m.appendChild(btns);
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click()});setTimeout(()=>qi.focus(),100);
  });
}

// Unified item edit modal — all fields in one window, same layout as new-item.

function showEditItemModal(parent,whId,itemId,item,opts={}){

    // pendingThumb is what shows in the small preview slot; pendingFull is the new
    // full-res photo (only set when the user actually picks a new one).
    let pendingThumb=item.thumb||item.image||null;

    const delImgBtn=el("button",{className:"btn btn-ghost btn-sm",style:{fontSize:"13px",padding:"7px 14px",color:"var(--danger)",borderColor:"var(--danger-line)"},onClick:async()=>{
      const c=await showActionSheet([{label:"הסר תמונה",style:"danger",value:"confirm"}],"להסיר את התמונה? היא תימחק בשמירה");
      if(c!=="confirm")return;
      pendingThumb=null;pendingFull=null;imageChanged=true;refreshImgUI();
    }},"הסר");
    function refreshImgUI(){
      imgSlot.innerHTML="";
      if(pendingThumb)imgSlot.appendChild(el("img",{src:pendingThumb,style:{width:"100%",height:"100%",objectFit:"cover"}}));
      else imgSlot.appendChild(icon("camera",26));
      pickBtn.textContent=pendingThumb?"החלף תמונה":"הוסף תמונה";
      delImgBtn.style.display=pendingThumb?"":"none";
    }
    if(opts.openPicker)setTimeout(()=>fileInput.click(),0);
    imgSlot.addEventListener("click",async()=>{
      if(!pendingThumb){fileInput.click();return}
      if(imageChanged)showImageViewer(pendingFull||pendingThumb);
      else showImageViewer(await fetchFullImage(whId,itemId,item));
    });
    fileInput.addEventListener("change",e=>{
      const file=e.target.files[0];if(!file)return;
      encodeImageVariants(file,({full,thumb})=>{
        pendingFull=full;pendingThumb=thumb;imageChanged=true;refreshImgUI();
      });
      fileInput.value="";
    });
    refreshImgUI();
    imgBtns.append(pickBtn,delImgBtn);
    imgRow.append(imgSlot,imgBtns);
    m.append(imgRow,fileInput);

    const ni=el("input",{className:"app-input",placeholder:"שם הפריט",style:{marginBottom:"4px"}});
    ni.value=item.name;
    const dupWarn=el("p",{style:{fontSize:"13px",color:"var(--warning)",minHeight:"16px",margin:"0 0 6px"}});
    ni.addEventListener("input",()=>{const k=ni.value.trim().toLowerCase();const d=k?currentItems.find(([id,it])=>id!==itemId&&(it.name||"").trim().toLowerCase()===k):null;dupWarn.textContent=d?`כבר קיים פריט אחר בשם "${d[1].name}"`:""});
    const qi=el("input",{className:"app-input",placeholder:"כמות",type:"number",inputMode:"numeric",style:{marginBottom:"12px"}});
    qi.value=item.quantity||0;
    const lowInput=el("input",{className:"app-input",placeholder:"סף התראת מלאי נמוך (אופציונלי)",type:"number",inputMode:"numeric",style:{marginBottom:"12px",display:lowStockOn()?"":"none"}});
    lowInput.value=item.lowStock||"";
    const skuInput=el("input",{className:"app-input",placeholder:'מק"ט (אופציונלי)',inputMode:"numeric",pattern:"[0-9]*",autocapitalize:"off",style:{marginBottom:"12px"}});
    skuInput.value=item.sku||"";
    const noteInput=el("textarea",{className:"app-input",placeholder:"הערה (אופציונלי)",rows:"2"});
    noteInput.value=item.note||"";
    m.append(ni,dupWarn,qi,lowInput,skuInput,noteInput);
    attachSkuDupWarn(skuInput,itemId);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const sb=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const name=ni.value.trim();if(!name)return;sb.disabled=true;
      const upd={
        [`items/${itemId}/name`]:name,
        [`items/${itemId}/sku`]:skuInput.value.trim()||null,
        [`items/${itemId}/note`]:noteInput.value.trim()||null,
        [`items/${itemId}/lowStock`]:parseInt(lowInput.value)>0?parseInt(lowInput.value):null,
      };
      if(imageChanged){upd[`items/${itemId}/thumb`]=pendingThumb;upd[`items/${itemId}/image`]=null;}
      const nq=parseInt(qi.value);
      if(!isNaN(nq)&&nq>=0&&nq!==(item.quantity||0)){
        upd[`items/${itemId}/quantity`]=nq;
        upd[`items/${itemId}/history/${genId()}`]={action:"עריכה",amount:Math.abs(nq-(item.quantity||0)),result:nq,by:currentUser.displayName,date:new Date().toISOString()};
      }
      writeOrWarn(dbUpdate(`warehouses/${whId}`,upd));
      if(imageChanged){
        if(pendingFull)writeOrWarn(dbSet(`itemImages/${whId}/${itemId}`,pendingFull));
        else writeOrWarn(dbRemove(`itemImages/${whId}/${itemId}`));
      }
      close();
      showNotice("השינויים נשמרו");
    }},"שמור");
    btns.appendChild(sb);m.appendChild(btns);
    ni.addEventListener("keydown",e=>{if(e.key==="Enter")qi.focus()});
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")lowInput.focus()});
    lowInput.addEventListener("keydown",e=>{if(e.key==="Enter")skuInput.focus()});
    skuInput.addEventListener("keydown",e=>{if(e.key==="Enter")sb.click()});
    setTimeout(()=>{ni.focus();ni.select()},100);
  });
}

    return sec;
  };
  const toggleRow=(container,label,on,onFlip,last)=>{
    const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px",padding:"11px 0",borderBottom:last?"none":"1px solid var(--border)"}});
    row.appendChild(el("span",{style:{fontSize:"13px"}},label));

      state=!state;
      tog.style.background=state?"var(--accent)":"var(--border)";
      knob.style.right=state?"3px":"";knob.style.left=state?"":"3px";
      try{await onFlip(state)}catch(e){}
    }});
    const knob=el("div",{style:{position:"absolute",width:"22px",height:"22px",borderRadius:"6px",background:"var(--text)",top:"3px",transition:"left .18s, right .18s",...(state?{right:"3px"}:{left:"3px"})}});
    tog.appendChild(knob);row.appendChild(tog);
    container.appendChild(row);
  };

  // ── פרטי מחסן ──
  if(userWarehouseRole==='owner'){
    const sec=section("פרטי מחסן");
    const nameRow=el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
    const nameInp=el("input",{className:"app-input",style:{flex:"1"}});

      wh.name=v;subTtl.textContent=v;
      saveNameBtn.textContent="נשמר";
      setTimeout(()=>{saveNameBtn.textContent="שמור"},1200);

    nameInp.addEventListener("keydown",e=>{if(e.key==="Enter")saveNameBtn.click()});
    nameRow.append(nameInp,saveNameBtn);
    sec.appendChild(nameRow);
  }

  // ── חברים ──
  const membersSec=section("חברים");
  const mp=el("div");membersSec.appendChild(mp);
  function refreshMembers(){
    mp.innerHTML='';
    const members=wh.members?Object.keys(wh.members):[];
    const canShare=isAdmin||!(wh.permissions&&wh.permissions.restrict_share);
    if(isAdmin){
      const addRow=el("div",{style:{display:"flex",gap:"8px"}});
      const inp=el("input",{className:"app-input",placeholder:"שם משתמש להזמנה",style:{flex:"1"},autocapitalize:"off"});
      const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",marginTop:"6px",minHeight:"16px"}});
      const addBtn=el("button",{className:"btn btn-primary",style:{whiteSpace:"nowrap"},onClick:async()=>{
        const target=inp.value.trim().toLowerCase();if(!target)return;
        const mems=wh.members?Object.keys(wh.members):[];
        if(mems.includes(target)){err.textContent="כבר חבר";return}
        if(wh.invites&&wh.invites[target]){err.textContent="כבר נשלחה הזמנה";return}
        if(target===currentUser.username){err.textContent="אי אפשר להזמין את עצמך";return}
        addBtn.disabled=true;err.textContent='';
        let tu=null;try{tu=await dbGet(`usernames/${target}`)}catch(e){}
        if(!tu){err.textContent="משתמש לא נמצא";addBtn.disabled=false;return}
        try{await sendInvite(whId,wh,target)}catch(e){err.textContent="שליחת ההזמנה נכשלה — נסה שוב";addBtn.disabled=false;return}
        inp.value='';addBtn.disabled=false;refreshMembers();
        showNotice(`נשלחה הזמנה ל־${target}`);
      }},"הזמן");
      addRow.append(inp,addBtn);
      mp.appendChild(addRow);mp.appendChild(err);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")addBtn.click()});
    }
    if(canShare){
      const qb=el("button",{className:"btn btn-ghost",style:{width:"100%",margin:"2px 0 12px"},onClick:async()=>{
        qb.disabled=true;
        try{
          let token=wh.inviteToken;
          if(!token){token=genId()+genId();await dbSet(`warehouses/${whId}/inviteToken`,token);wh.inviteToken=token}
          await loadQRLib();
          showQRViewer(`${APP_URL}#join=${whId}.${token}`);
        }catch(e){showNotice("שגיאה בטעינת הקוד — נסה שוב")}
        qb.disabled=false;
      }},"קוד QR להצטרפות");
      mp.appendChild(qb);

    // Pending invitations (sent, not yet accepted)
    Object.keys(wh.invites||{}).filter(u=>!members.includes(u)).forEach(u=>{
      const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px",padding:"10px 12px",background:"var(--bg)",border:"1px dashed var(--border)",borderRadius:"8px",marginBottom:"8px"}});

      row.appendChild(lbl);

      mp.appendChild(row);
    });
    members.forEach(u=>{
      const isOwner=u===wh.owner;
      const isCurrentlyAdmin=!isOwner&&wh.roles&&wh.roles[u]==='admin';
      const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"8px",marginBottom:"8px"}});
      const lbl=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",minWidth:"0"}});
      lbl.appendChild(el("span",{style:{fontSize:"13px",fontWeight:"400",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},u));
      if(u===currentUser.username)lbl.appendChild(el("span",{style:{fontSize:"13px",color:"var(--accent)",flexShrink:"0"}},"(אתה)"));
      row.appendChild(lbl);
      const acts=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",flexShrink:"0"}});
      if(isOwner){
        acts.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)",padding:"4px 8px",border:"1px solid var(--border)",borderRadius:"8px",fontWeight:"400"}},"בעלים"));
      } else if(isAdmin&&u!==currentUser.username){

          borderColor:isCurrentlyAdmin?"var(--accent-line)":"var(--border)"
        },onClick:async()=>{
          const sheetOpts=[
            isCurrentlyAdmin
              ?{label:'הסר מנהל',value:'demote'}
              :{label:'הפוך למנהל',value:'promote'},
          ];
          if(userWarehouseRole==='owner')sheetOpts.push({label:'העבר בעלות',value:'transfer'});
          sheetOpts.push({label:'הסר מהמחסן',style:'danger',value:'remove'});

            await dbSet(`warehouses/${whId}/roles/${u}`,'admin');

          }else if(choice==='demote'){
            await dbRemove(`warehouses/${whId}/roles/${u}`);
            if(!wh.roles)wh.roles={};delete wh.roles[u];refreshMembers();
          }else if(choice==='transfer'){
            const c2=await showActionSheet([
              {label:`העבר בעלות ל-${u} והישאר חבר`,value:'stay'},
              {label:`העבר בעלות ל-${u} ועזוב`,style:'danger',value:'leave'},
            ],`העבר בעלות ל-${u}?`);
            if(c2==='stay'||c2==='leave'){
              await dbSet(`warehouses/${whId}/owner`,u);
              if(c2==='leave'){
                await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
                await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
                close();renderHome();
              }else{
                wh.owner=u;userWarehouseRole='member';refreshMembers();
              }
            }
          }else if(choice==='remove'){
            await dbRemove(`warehouses/${whId}/members/${u}`);
            await dbRemove(`users/${u}/warehouses/${whId}`);
            await dbRemove(`warehouses/${whId}/roles/${u}`);
            if(wh.members)delete wh.members[u];
            if(wh.roles)delete wh.roles[u];refreshMembers();
          }
        }},isCurrentlyAdmin?'מנהל ▾':'חבר ▾');
        acts.appendChild(roleBadge);
      } else if(isCurrentlyAdmin){
        acts.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)",padding:"4px 8px",border:"1px solid var(--border)",borderRadius:"8px",fontWeight:"400"}},"מנהל"));
      } else if(!isAdmin&&u===currentUser.username){
        const leaveBtn=el("button",{className:"btn btn-danger btn-sm",style:{fontSize:"13px"},onClick:async()=>{
          await dbRemove(`warehouses/${whId}/members/${u}`);
          await dbRemove(`users/${u}/warehouses/${whId}`);
          close();renderHome();
        }},"עזוב");
        acts.appendChild(leaveBtn);
      } else {
        acts.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-muted)",padding:"4px 10px"}},"חבר"));
      }
      row.appendChild(acts);
      mp.appendChild(row);
    });
  }
  refreshMembers();

  if(isAdmin){
    // ── הרשאות ──
    const pp=section("הרשאות חברים");
    pp.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",margin:"-4px 0 4px"}},"ההגבלות חלות על חברים רגילים בלבד — לא על בעלים ומנהלים."));
    const perms=wh.permissions||{};
    const permDefs=[
      {key:'restrict_add',label:'מנע הוספת פריטים'},
      {key:'restrict_reset',label:'מנע איפוס כמויות'},
      {key:'restrict_edit',label:'מנע עריכה ומחיקה'},
      {key:'restrict_share',label:'מנע שיתוף וצירוף חברים'},
      {key:'restrict_code_renew',label:'מנע חידוש קוד הצטרפות'},
    ];
    permDefs.forEach(({key,label},i)=>{
      toggleRow(pp,label,!!perms[key],async state=>{
        await dbUpdate(`warehouses/${whId}`,{[`permissions/${key}`]:state});
        perms[key]=state;
        if(!wh.permissions)wh.permissions={};wh.permissions[key]=state;
      },i===permDefs.length-1);
    });

    // ── סידור ──
    const sp=section("ברירת מחדל לסידור פריטים");
    const sortOpts=[
      {val:'manual',label:'ידני (גרירה)'},
      {val:'alpha',label:'א-ב (אלפביתי)'},
      {val:'qty-desc',label:'כמות: גבוה לנמוך'},
      {val:'qty-asc',label:'כמות: נמוך לגבוה'},
    ];
    sortOpts.forEach(({val,label},i)=>{
      const row=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"11px 0",borderBottom:i===sortOpts.length-1?"none":"1px solid var(--border)",cursor:"pointer"},onClick:async()=>{
        await dbSet(`warehouses/${whId}/sortMode`,val);
        wh.sortMode=val;
        sp.querySelectorAll('.sort-chk').forEach(cEl=>cEl.textContent='');
        row.querySelector('.sort-chk').textContent='✓';
      }});
      const chk=el("span",{className:"sort-chk",style:{color:"var(--accent)",fontWeight:"600",width:"16px",display:"inline-block",flexShrink:"0"}},(wh.sortMode||'manual')===val?'✓':'');
      row.appendChild(chk);row.appendChild(el("span",{style:{fontSize:"13px"}},label));
      sp.appendChild(row);
    });

    // ── תצוגה ──
    const dp=section("תצוגת פריטים");
    const features=wh.features||{};
    const featDefs=[
      {key:'showSku',label:'הצג מק"ט על פריטים'},
      {key:'showImages',label:'הצג תמונות על פריטים'},
      {key:'showLowStock',label:'התראות מלאי נמוך (כבוי כברירת מחדל)'},
    ];
    if(featDefs.some(f=>userPrefs[f.key]===false))dp.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)",marginBottom:"6px"}},"חלק מהאפשרויות כבויות אצלך בהגדרות הכלליות ולכן לא יוצגו לך גם אם הן מופעלות כאן."));
    featDefs.forEach(({key,label},i)=>{
      toggleRow(dp,userPrefs[key]===false?label+" (כבוי בהגדרות הכלליות)":label,whFeatOn(features,key),async state=>{
        await dbUpdate(`warehouses/${whId}`,{[`features/${key}`]:state});
        features[key]=state;
        if(!wh.features)wh.features={};wh.features[key]=state;
        if(currentWhData){if(!currentWhData.features)currentWhData.features={};currentWhData.features[key]=state;}
      },i===featDefs.length-1);
    });
  }

  document.body.appendChild(ov);
}

    if(members.length>0){
      const ml=el("div",{style:{marginBottom:"16px"}});
      ml.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)",marginBottom:"6px"}},"חברים:"));

        label.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)"}},u));
        if(isMe)label.appendChild(el("span",{style:{fontSize:"13px",color:"var(--accent)"}},"(אתה)"));
        if(isThisOwner)label.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-muted)"}},"(בעלים)"));
        row.appendChild(label);

        if(isOwner&&!isMe){
          const btnsRow=el("div",{style:{display:"flex",gap:"4px"}});
          const transferBtn=el("button",{className:"btn btn-sm",style:{padding:"4px 8px",fontSize:"13px"},onClick:async()=>{
            const c2=await showActionSheet([
              {label:`העבר בעלות ל-${u} והישאר חבר`,value:'stay'},
              {label:`העבר בעלות ל-${u} ועזוב`,style:'danger',value:'leave'},
            ],`העבר בעלות ל-${u}?`);

            await dbSet(`warehouses/${whId}/owner`,u);

              await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
              await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
