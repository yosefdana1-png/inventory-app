    :root {

<div id="splash" style="position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .2s ease">
  <img src="icon-192.png" alt="" style="width:88px;height:88px;border-radius:8px">
  <div style="font-size:24px;font-weight:600">ניהול מלאי</div>
</div>
<div id="app" style="height:100vh;height:100dvh"></div>

<script>
// ── Boot-failure notice: if nothing renders within 12s (Firebase blocked,
// no network, a broken cached bundle), replace the loading dots with a
// friendly Hebrew message and a retry button. Normal starts never show it. ──
window.__bootErr=function(){}; // kept as a no-op for the module bootstrap
function showBootNotice(){
  try{
    var sp=document.getElementById("splash");
    if(!sp||document.querySelector("#app .screen")||sp.querySelector(".boot-notice"))return;
    var box=document.createElement("div");
    box.className="boot-notice";
    box.style.cssText="margin-top:8px;padding:0 28px;text-align:center;max-width:340px";
    var t=document.createElement("div");
    t.style.cssText="font-size:16px;color:#e8ecf4;margin-bottom:6px";
    t.textContent="לא הצלחנו להתחבר";
    var m=document.createElement("div");
    m.style.cssText="font-size:13px;color:#8b95a8;line-height:1.5;margin-bottom:14px";
    m.textContent="בדוק את החיבור לאינטרנט ונסה שוב.";
    var btn=document.createElement("button");
    btn.className="btn btn-primary";
    btn.style.cssText="padding:10px 26px";
    btn.textContent="נסה שוב";
    btn.onclick=function(){location.reload()};
    box.appendChild(t);box.appendChild(m);box.appendChild(btn);
    var dots=sp.querySelector("div[style*='gap:6px']");if(dots)dots.style.display="none";
    sp.appendChild(box);
  }catch(x){}
}
setTimeout(showBootNotice,12000);
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...ch)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")e.className=v;else if(k==="innerHTML")e.innerHTML=v;else e.setAttribute(k,v)}for(const c of ch){if(typeof c==="string")e.appendChild(document.createTextNode(c));else if(c)e.appendChild(c)}return e};
const icon=(name,size=20)=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("width",size);s.setAttribute("height",size);s.innerHTML=`<use href="#icon-${name}"/>`;return s};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let FB=null,currentUser=null,unsubscribers=[];

function dbRef(p){return FB.ref(FB.db,p)}
async function dbGet(p){const s=await FB.get(dbRef(p));return s.exists()?s.val():null}
async function dbSet(p,v){await FB.set(dbRef(p),v)}
async function dbRemove(p){await FB.remove(dbRef(p))}
async function dbUpdate(p,v){await FB.update(dbRef(p),v)}
// A Firebase write shows up on screen at once, but its promise settles only
// when the server answers: never while the connection is down, or with a
// rejection when the server refuses it (sign-in lost). Modals must not wait
// on it; they close right away and a refusal is reported here.
function writeFailed(e){
  console.warn("write failed",e);
  const t=String(e&&(e.code||e.message)||"");
  if(/permission/i.test(t))showNotice("השינוי לא נשמר: החיבור לחשבון פג. צא מהחשבון והתחבר מחדש");
  else showNotice("השינוי לא נשמר. נסה שוב");
}
function writeOrWarn(promise){return promise.catch(writeFailed)}
// Safety net for every other write that is awaited without a catch.
window.addEventListener("unhandledrejection",ev=>{
  const t=String(ev.reason&&(ev.reason.code||ev.reason.message)||"");
  if(/permission/i.test(t))writeFailed(ev.reason);
});
function dbListen(p,cb){const u=FB.onValue(dbRef(p),s=>cb(s.exists()?s.val():null));unsubscribers.push(u);return u}

// ── Firebase Authentication glue ──
// The login UX stays username+password; behind the scenes each username maps to
// a synthetic email for Firebase email/password auth. Passwords live ONLY in
// Firebase Auth — never in the database.
// ASCII usernames map directly; Hebrew/spaces/anything else is encoded to
// lowercase base32 (case-insensitive-safe — Firebase may normalize email case).
const b32enc=bytes=>{const A="abcdefghijklmnopqrstuvwxyz234567";let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=A[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=A[(val<<(5-bits))&31];return out};
const emailForUsername=u=>/^[a-z0-9._-]+$/.test(u)?`${u}@inv-user.app`:`u-${b32enc(new TextEncoder().encode(u))}@inv-user.app`;
// Firebase requires passwords of 6+ chars; legacy accounts allowed 4-5. Pad
// short ones deterministically with zeros so old passwords keep working
// unchanged ("1234" → auth password "123400"). The same padding must be used
// when an admin pre-creates accounts in the Firebase console.
const authPw=p=>p.length>=6?p:p+"0".repeat(6-p.length);
// usernames/<name> → {uid,displayName} and uids/<uid> → {username} let the
// security rules translate between the app's username keys and auth uids, and
// give an existence check for sharing that doesn't expose user data.
async function ensureIdentity(username,displayName){
  const u=FB.auth&&FB.auth.currentUser;if(!u)return;
  try{await dbUpdate(`usernames/${username}`,displayName?{uid:u.uid,displayName}:{uid:u.uid})}catch(e){}
  try{await dbUpdate(`uids/${u.uid}`,{username})}catch(e){}
}

// Local cache for instant loading. Stored in localStorage so it survives
// app restarts (sessionStorage is wiped every launch on iOS standalone).
// On quota overflow, retry with item images stripped so text data still caches.
function cacheSet(key,data){
  const k='inv_'+key;
  try{localStorage.setItem(k,JSON.stringify(data))}
  catch(e){
    try{
      if(data&&data.items){
        const slim={...data,items:{}};
        for(const[id,it]of Object.entries(data.items)){const{image,...rest}=it;slim.items[id]=rest}
        localStorage.setItem(k,JSON.stringify(slim));
      }else localStorage.removeItem(k);
    }catch(e2){try{localStorage.removeItem(k)}catch(e3){}}
  }
}
function cacheGet(key){try{const d=localStorage.getItem('inv_'+key);return d?JSON.parse(d):null}catch(e){return null}}
// Clears cached DB data only. Session/device keys share the "inv_" prefix and
// must survive: wiping them lost the account list (no way back after "הוסף
// חשבון") and the device id (each switch registered a "new" device).
const INV_KEEP_KEYS=["inv_user","inv_accounts","inv_active","inv_adding_from","inv_device"];
function cacheClearAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('inv_')&&!INV_KEEP_KEYS.includes(k)&&!k.startsWith('inv_devreg_')).forEach(k=>localStorage.removeItem(k))}catch(e){}}

function dbListenCached(p,cb){
  const cached=cacheGet(p);
  let cacheShown=false;
  if(cached!==null){cb(cached);cacheShown=true}
  const u=FB.onValue(dbRef(p),s=>{
    const val=s.exists()?s.val():null;
    const valStr=JSON.stringify(val);
    const oldStr=cacheShown?JSON.stringify(cacheGet(p)):null;
    cacheSet(p,val);
    // Skip if data is same as what we already showed from cache
    if(cacheShown&&valStr===oldStr){cacheShown=false;return}
    cacheShown=false;
    cb(val);
  });
  unsubscribers.push(u);return u;
}
const splashShownAt=Date.now();
function hideSplash(){
  const sp=document.getElementById("splash");if(!sp)return;
  const wait=Math.max(0,500-(Date.now()-splashShownAt));
  setTimeout(()=>{sp.style.opacity="0";sp.style.pointerEvents="none";setTimeout(()=>sp.remove(),250)},wait);
}
function render(s){const a=$("#app");a.classList.remove("split");a.innerHTML="";a.appendChild(s);hideSplash()}


// ═══════════ INVITATIONS (accepted by the invitee) ═══════════
// Adding a member by username no longer adds them directly. The inviter writes
//   warehouses/<id>/invites/<user> = token          (shows as "ממתין לאישור")
//   users/<user>/invites/<id> = {from, fromUser, whName, date, token}
// The invitee accepts from the bell on the home screen: the rules let them set
// members/<me> to that token, exactly like joining by QR. Declining (or the
// inviter cancelling) removes both nodes.
let myInvites={},inviteBellEl=null,inviteCountSeen=-1;
// The inviter hears back: accepting or declining drops a notice in
//   users/<inviter>/notices/<id> = {type:"accepted"|"declined", by, byUser, whName, whId, date}
// (rules: anyone signed in may create one under their own byUser; only the
// owner reads or deletes). It shows under the same bell until dismissed.
let myNotices={},noticeCountSeen=-1;
function notifyInviter(inv,whId,type){
  if(!inv||!inv.fromUser||inv.fromUser===currentUser.username)return;
  dbSet(`users/${inv.fromUser}/notices/${genId()}`,{type,by:currentUser.displayName,byUser:currentUser.username,whName:inv.whName||"",whId,date:new Date().toISOString()}).catch(()=>{});
}
function noticeText(n){
  const who=n.by||n.byUser||"מישהו";
  return n.type==="accepted"?`${who} הצטרף/ה למחסן "${n.whName||""}"`:`${who} דחה/תה את ההזמנה למחסן "${n.whName||""}"`;
}
async function sendInvite(whId,wh,target){
  const token=genId()+genId();
  await dbSet(`warehouses/${whId}/invites/${target}`,token);
  await dbSet(`users/${target}/invites/${whId}`,{from:currentUser.displayName,fromUser:currentUser.username,whName:wh.name||"",date:new Date().toISOString(),token});
  if(!wh.invites)wh.invites={};wh.invites[target]=token;
}
async function cancelInvite(whId,wh,target){
  await dbRemove(`users/${target}/invites/${whId}`).catch(()=>{});
  await dbRemove(`warehouses/${whId}/invites/${target}`).catch(()=>{});
  if(wh.invites)delete wh.invites[target];
}
async function acceptInvite(whId,inv){
  const me=currentUser.username;
  await dbSet(`warehouses/${whId}/members/${me}`,inv.token);
  await dbSet(`users/${me}/warehouses/${whId}`,Date.now());
  dbRemove(`warehouses/${whId}/invites/${me}`).catch(()=>{});
  await dbRemove(`users/${me}/invites/${whId}`).catch(()=>{});
  notifyInviter(inv,whId,"accepted");
}
async function declineInvite(whId,inv){
  const me=currentUser.username;
  await dbRemove(`users/${me}/invites/${whId}`).catch(()=>{});
  dbRemove(`warehouses/${whId}/invites/${me}`).catch(()=>{});
  if(inv)notifyInviter(inv,whId,"declined");
}
function updateInviteBell(){
  const ni=Object.keys(myInvites||{}).length,nn=Object.keys(myNotices||{}).length,n=ni+nn;
  if(inviteBellEl){
    const b=inviteBellEl.querySelector(".bell-badge");
    if(b){b.textContent=n>9?"9+":String(n);b.style.display=n?"flex":"none"}
    inviteBellEl.style.color=n?"var(--accent)":"";
  }
  if(inviteCountSeen>=0&&ni>inviteCountSeen)showNotice("קיבלת הזמנה למחסן — לחץ על הפעמון");
  else if(noticeCountSeen>=0&&nn>noticeCountSeen){
    const last=Object.values(myNotices).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
    if(last)showNotice(noticeText(last));
  }
  inviteCountSeen=ni;noticeCountSeen=nn;
}
function showNotificationsModal(){
  showModal(document.body,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"12px"}},"התראות"));
    const list=el("div");m.appendChild(list);
    const draw=()=>{
      list.innerHTML="";
      const entries=Object.entries(myInvites||{}).sort((a,b)=>String(b[1].date||"").localeCompare(String(a[1].date||"")));
      const notes=Object.entries(myNotices||{}).sort((a,b)=>String(b[1].date||"").localeCompare(String(a[1].date||"")));
      notes.forEach(([nid,n])=>{
        const card=el("div",{style:{border:"1px solid var(--border)",borderRadius:"8px",padding:"12px",marginBottom:"10px",background:"var(--bg)",display:"flex",alignItems:"center",gap:"10px"}});
        const txt=el("div",{style:{flex:"1",minWidth:"0"}});
        txt.appendChild(el("div",{style:{fontSize:"14px",lineHeight:"1.5",marginBottom:"2px"}},noticeText(n)));
        txt.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)"}},n.date?timeAgo(Date.parse(n.date)):""));
        const ok=el("button",{className:"btn btn-ghost btn-sm",style:{flexShrink:"0"},onClick:()=>{dbRemove(`users/${currentUser.username}/notices/${nid}`).catch(()=>{});delete myNotices[nid];noticeCountSeen=Object.keys(myNotices).length;updateInviteBell();draw()}},"הבנתי");
        card.append(txt,ok);list.appendChild(card);
      });

// ═══════════ JOIN-BY-QR ═══════════
// A warehouse QR encodes APP_URL#join=<whId>.<inviteToken>. Scanning it with
// the phone camera opens the app; after login the app presents the token and
// the security rules let the scanner add themselves as a member — no manual
// username typing. The token lives at warehouses/<id>/inviteToken; renewing it
// invalidates every previously printed/shared QR.
const APP_URL="https://yosefdana1-png.github.io/inventory-app/";
let pendingJoin=null;
(function(){
  const m=location.hash.match(/^#join=([A-Za-z0-9]+)\.([A-Za-z0-9]+)$/);
  if(m){pendingJoin={whId:m[1],token:m[2]};try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
})();
async function processPendingJoin(){
  if(!pendingJoin||!FB||!currentUser)return; // retried on the next home render
  const{whId,token}=pendingJoin;pendingJoin=null;
  try{
    // The rules accept this write only when the value equals the warehouse's
    // current inviteToken (or if we're already a member).
    await dbSet(`warehouses/${whId}/members/${currentUser.username}`,token);
    await dbSet(`users/${currentUser.username}/warehouses/${whId}`,Date.now());
    let name="";try{name=(await dbGet(`warehouses/${whId}/name`))||""}catch(e){}
    showNotice(name?`הצטרפת למחסן "${name}"`:"הצטרפת למחסן");
  }catch(e){
    showNotice("קוד ההצטרפות אינו תקף — בקש קוד חדש מחבר במחסן");
  }
}

// ═══════════ UNDO TOAST ═══════════
// A short-lived "בטל" bar after destructive actions. One at a time — a new
// action replaces the previous toast (and its undo window).
let undoToastEl=null,undoTimer=null;
function hideUndoToast(){
  if(undoTimer){clearTimeout(undoTimer);undoTimer=null}
  if(undoToastEl){undoToastEl.remove();undoToastEl=null}
}
function showUndoToast(message,restoreFn){
  hideUndoToast();
  const t=el("div",{className:"undo-toast"});
  t.appendChild(el("span",{style:{flex:"1",minWidth:"0",overflow:"hidden",textOverflow:"ellipsis"}},message));
  let remaining=8;
  const btn=el("button",{className:"undo-btn",onClick:async()=>{
    hideUndoToast();
    try{await restoreFn()}catch(e){}
  }},`בטל (${remaining})`);
  t.appendChild(btn);
  document.body.appendChild(t);
  undoToastEl=t;
  // Countdown in the button itself — the user sees how long the offer lasts.
  undoTimer=setInterval(()=>{
    remaining--;
    if(remaining<=0){hideUndoToast();return}
    btn.textContent=`בטל (${remaining})`;
  },1000);
}
function cleanup(){unsubscribers.forEach(f=>f());unsubscribers=[]}

function probePx(expr){const d=document.createElement("div");d.style.cssText="position:fixed;visibility:hidden;width:"+expr;document.body.appendChild(d);const w=d.getBoundingClientRect().width;d.remove();return Math.round(w)}
function foldDiag(){
  const segs=(window.viewport&&window.viewport.segments)||null;
  const segTxt=segs?segs.map(r=>Math.round(r.x)+"+"+Math.round(r.width)).join("|"):"-";
  const envSeg=probePx("env(viewport-segment-left 1 0, 0px)");
  const sb=document.querySelector("#app.split>.home-screen");
  const line=sb?Math.round(sb.getBoundingClientRect().left):"-";
  return `w${innerWidth} h${innerHeight} s${screen.width}x${screen.height} ×${devicePixelRatio} · L${probePx("var(--sl)")} R${probePx("var(--sr)")} · seg ${segTxt} env${envSeg} · line ${line} · ${isWide()?"split":"single"}`;
}
// If the JS Viewport Segments API exists, pin the split line to the real fold.
function applyFold(){
  const segs=window.viewport&&window.viewport.segments;
  if(segs&&segs.length===2&&segs[1].x>0)document.documentElement.style.setProperty("--fold-x",Math.round(segs[1].x)+"px");
  else document.documentElement.style.removeProperty("--fold-x");
}

// ── System back button (Android) ──
// Every in-app "layer" (detail screen, modal, fullscreen page, action sheet)
// pushes a history entry; popstate closes the topmost layer. Programmatic
// closes pop their own entry (flagged so the popstate handler ignores it).
let navDepth=0,ignorePop=0,closingFromPop=false;
function pushNav(){try{history.pushState({nav:++navDepth},"");}catch(e){}}
// A layer closed BY the back button must not pop again (its entry is already gone).
function popNav(){if(closingFromPop)return;if(navDepth>0){navDepth--;ignorePop++;try{history.back()}catch(e){ignorePop--}}}
function closeTopLayer(){
  const viewer=document.querySelector('.viewer-overlay');
  if(viewer){viewer.click();return true}
  const sheet=document.querySelector('.action-sheet-overlay');
  if(sheet){sheet.click();return true}
  const modal=document.querySelector('.modal-overlay');
  if(modal){modal.click();return true}
  const fs=[...document.querySelectorAll('.fullscreen-modal')].pop();
  if(fs){const x=fs.querySelector('.icon-btn');if(x)x.click();else fs.remove();return true}
  if(isShowingDetail&&!isWide()){renderHome();return true}
  return false;
}
window.addEventListener("popstate",()=>{
  if(ignorePop>0){ignorePop--;return}
  if(navDepth>0)navDepth--;
  closingFromPop=true;
  try{closeTopLayer()}finally{closingFromPop=false}
});

function navShowHome(animated){
  const app=$("#app");
  if(!homeScreen)return;
  hideSplash();
  if(isShowingDetail&&!isWide())popNav();

  if(isWide()){
    // Split view: keep the sidebar, clear the detail pane.
    app.innerHTML="";
    homeScreen.style.cssText="";homeScreen.classList.add("home-screen");
    app.appendChild(homeScreen);app.appendChild(detailPlaceholder());
    app.classList.add("split");
    if(detailScreen)detailScreen.style.cssText="";
    isShowingDetail=false;markSelectedWh();
    return;
  }
  app.classList.remove("split");
  
  if(!isShowingDetail||!animated){
    app.innerHTML="";
    homeScreen.style.transform="";homeScreen.style.transition="";
    app.appendChild(homeScreen);
    isShowingDetail=false;
    return;
  }
  
  // Animate back: detail slides right, home slides in from left
  if(!app.contains(homeScreen)){
    homeScreen.style.transform="translateX(25%)";
    homeScreen.style.opacity="0.6";
    homeScreen.style.position="absolute";homeScreen.style.top="0";homeScreen.style.left="var(--sl)";homeScreen.style.right="var(--sr)";
    app.insertBefore(homeScreen,detailScreen);
  }
  
  if(detailScreen){
    detailScreen.style.position="relative";
    detailScreen.style.zIndex="2";
    detailScreen.style.transition="transform 0.22s cubic-bezier(0.32,0.72,0,1)";
    detailScreen.style.transform="translateX(-100%)";
  }
  homeScreen.style.transition="transform 0.22s cubic-bezier(0.32,0.72,0,1), opacity 0.22s cubic-bezier(0.32,0.72,0,1)";
  homeScreen.style.transform="translateX(0)";
  homeScreen.style.opacity="1";
  
  setTimeout(()=>{
    app.innerHTML="";
    homeScreen.style.position="";homeScreen.style.transform="";homeScreen.style.transition="";homeScreen.style.opacity="";
    app.appendChild(homeScreen);
    if(detailScreen){detailScreen.style.transform="";detailScreen.style.transition="";detailScreen.style.position="";detailScreen.style.zIndex="";}
    isShowingDetail=false;
  },240);
}

function navShowDetail(screen){
  const app=$("#app");
  hideSplash();
  if(!isShowingDetail&&!isWide())pushNav();
  detailScreen=screen;
  isShowingDetail=true;

  if(isWide()&&homeScreen){
    app.innerHTML="";
    homeScreen.style.cssText="";homeScreen.classList.add("home-screen");
    screen.style.cssText="";
    app.appendChild(homeScreen);app.appendChild(screen);
    app.classList.add("split");markSelectedWh();
    return;
  }
  app.classList.remove("split");
  
  if(homeScreen&&app.contains(homeScreen)){
    // Set up home to be behind
    homeScreen.style.position="absolute";homeScreen.style.top="0";homeScreen.style.left="var(--sl)";homeScreen.style.right="var(--sr)";
    homeScreen.style.zIndex="1";
    
    // Slide detail in from right
    screen.style.position="relative";
    screen.style.zIndex="2";
    screen.style.transform="translateX(-100%)";
    app.appendChild(screen);
    
    requestAnimationFrame(()=>{
      screen.style.transition="transform 0.22s cubic-bezier(0.32,0.72,0,1)";
      screen.style.transform="translateX(0)";
      homeScreen.style.transition="transform 0.22s cubic-bezier(0.32,0.72,0,1), opacity 0.22s cubic-bezier(0.32,0.72,0,1)";
      homeScreen.style.transform="translateX(25%)";
      homeScreen.style.opacity="0.6";
    });
    
    setTimeout(()=>{
      app.innerHTML="";
      screen.style.position="";screen.style.zIndex="";screen.style.transform="";screen.style.transition="";
      app.appendChild(screen);
      homeScreen.style.position="";homeScreen.style.zIndex="";homeScreen.style.transform="";homeScreen.style.transition="";homeScreen.style.opacity="";
    },240);
  }else{
    app.innerHTML="";
    app.appendChild(screen);
  }
}

// ═══════════ AUTH ═══════════
function renderAuth(){
  cleanup();let mode="login";
  const wrap=el("div",{className:"screen",style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px"}});
  const box=el("div",{style:{textAlign:"center",width:"100%",maxWidth:"340px"}});
  const iw=el("div",{style:{width:"72px",height:"72px",margin:"0 auto 24px"}});
  iw.appendChild(el("img",{src:"icon-192.png",alt:"",style:{width:"72px",height:"72px",borderRadius:"16px",display:"block"}}));
  box.append(iw,el("h1",{style:{fontSize:"24px",fontWeight:"600",marginBottom:"8px"}},"ניהול מלאי"),el("p",{style:{color:"var(--text-sec)",fontSize:"13px",marginBottom:"24px"}},"התחבר או צור חשבון חדש"));
  const tabs=el("div",{className:"tab-bar"});
  const lt=el("button",{className:"tab-btn active",onClick:()=>{mode="login";lt.className="tab-btn active";rt.className="tab-btn";nr.style.display="none";err.textContent="";ab.textContent="התחבר";}},"התחברות");
  const rt=el("button",{className:"tab-btn",onClick:()=>{mode="register";rt.className="tab-btn active";lt.className="tab-btn";nr.style.display="block";err.textContent="";ab.textContent="צור חשבון";}},"הרשמה");
  tabs.append(lt,rt);box.appendChild(tabs);
  const nr=el("div",{style:{display:"none",marginBottom:"12px"}});
  const ni=el("input",{className:"app-input",placeholder:"שם תצוגה"});nr.appendChild(ni);
  const ui=el("input",{className:"app-input",placeholder:"שם משתמש",style:{marginBottom:"12px"},autocapitalize:"off",autocorrect:"off"});
  const pi=el("input",{type:"password",className:"app-input",placeholder:"סיסמה"});
  const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",marginTop:"10px",minHeight:"20px"}});
  const ab=el("button",{className:"btn btn-primary",style:{width:"100%",marginTop:"16px",height:"48px"},onClick:async()=>{
    const username=ui.value.trim().toLowerCase(),password=pi.value;
    if(!username||!password){err.textContent="יש למלא שם משתמש וסיסמה";return}
    if(username.length<2){err.textContent="שם משתמש חייב להיות לפחות 2 תווים";return}
    if(mode==="register"&&username.length>20){err.textContent="שם משתמש יכול להכיל עד 20 תווים";return}
    if(mode==="register"&&password.length<6){err.textContent="סיסמה חייבת להיות לפחות 6 תווים";return}
    if(password.length<4){err.textContent="סיסמה חייבת להיות לפחות 4 תווים";return}
    if(!FB){err.textContent="אין חיבור — נסה שוב";return}
    ab.disabled=true;ab.textContent="...";err.textContent="";
    const fail=msg=>{err.textContent=msg;ab.disabled=false;ab.textContent=mode==="login"?"התחבר":"צור חשבון";box.classList.add("shaking");setTimeout(()=>box.classList.remove("shaking"),500)};
    const email=emailForUsername(username);
    try{
      if(mode==="register"){
        try{await FB.createUserWithEmailAndPassword(FB.auth,email,authPw(password))}
        catch(e){
          if(e.code==="auth/email-already-in-use"){fail("שם משתמש כבר תפוס")}
          else if(e.code==="auth/network-request-failed"){fail("שגיאה בחיבור — נסה שוב")}
          else fail("שגיאה ביצירת החשבון — נסה שוב");
          return;
        }
        const dn=ni.value.trim()||username;
        await ensureIdentity(username,dn);
        await dbSet(`users/${username}`,{displayName:dn,createdAt:new Date().toISOString()});
        currentUser={username,displayName:dn};localStorage.setItem("inv_user",JSON.stringify(currentUser));rememberAccount();renderHome();
      }else{
        try{await FB.signInWithEmailAndPassword(FB.auth,email,authPw(password))}
        catch(e){
          const code=e.code||"";
          if(code==="auth/network-request-failed"){fail("שגיאה בחיבור — נסה שוב");return}
          if(code==="auth/too-many-requests"){fail("יותר מדי ניסיונות — נסה שוב בעוד כמה דקות");return}
          // No auth account (or auth rejected) — legacy migration path: accounts
          // from before Firebase Auth keep their password in the DB. Verify it,
          // create the real auth account with the SAME password, then delete the
          // plaintext copy for good.
          let legacy=null;
          try{legacy=await dbGet(`users/${username}/password`)}catch(e2){}
          if(legacy===null||legacy!==password){fail("שם משתמש או סיסמה שגויים");return}
          try{await FB.createUserWithEmailAndPassword(FB.auth,email,authPw(password))}
          catch(e3){fail("שם משתמש או סיסמה שגויים");return}
          try{await dbRemove(`users/${username}/password`)}catch(e4){}
        }
        // The rules key every user-data access off usernames/<u>/uid, so the
        // mapping must exist before the profile read on a first login.
        await ensureIdentity(username);
        // Sweep any plaintext password left from before Firebase Auth. Accounts
        // pre-created by the admin sign in successfully and never hit the
        // legacy-migration branch, so this is what removes their old password
        // node on first login. No-op once gone.
        dbRemove(`users/${username}/password`).catch(()=>{});
        let ud=null;
        try{ud=await dbGet(`users/${username}`)}catch(e){}
        currentUser={username,displayName:(ud&&ud.displayName)||username};
        localStorage.setItem("inv_user",JSON.stringify(currentUser));
        await ensureIdentity(username,currentUser.displayName);
        rememberAccount();
        renderHome();
      }
    }catch(e){fail("שגיאה בחיבור — נסה שוב")}
  }},"התחבר");
  ni.addEventListener("keydown",e=>{if(e.key==="Enter")ui.focus()});
  ui.addEventListener("keydown",e=>{if(e.key==="Enter")pi.focus()});
  pi.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click()});
  box.append(nr,ui,pi,err,ab);
  // Adding another account: offer a way back to the one we came from.
  const prev=addingFrom();
  if(prev){
    const back=el("button",{className:"btn btn-ghost",style:{width:"100%",marginTop:"12px",height:"44px"},onClick:()=>switchAccount(prev.slot)},`ביטול — חזרה ל${prev.displayName}`);
    box.appendChild(back);
  }
  wrap.appendChild(box);render(wrap);ui.focus();
}

// ═══════════ HOME ═══════════
let cachedHomeContent=null;
let homeUnsubs=[];

// Personal warehouse order is stored as a number per id in users/<uid>/warehouses.
// Legacy entries stored as `true` sort first (treated as 0).
function sortedWhIds(data){
  const entries=data?Object.entries(data):[];
  entries.sort((a,b)=>(typeof a[1]==='number'?a[1]:0)-(typeof b[1]==='number'?b[1]:0));
  return entries.map(([id])=>id);
}

// Category chips on the home screen. Categories are personal (stored under the
// user's own node), so everyone organizes THEIR list without affecting others.
// Chips derive from categories actually assigned to current warehouses.
function currentCats(){
  const cats=[...new Set(lastHomeWhIds.map(id=>whCategories[id]).filter(Boolean))];
  return cats.sort((a,b)=>{
    const ia=catOrder.indexOf(a),ib=catOrder.indexOf(b);
    if(ia===-1&&ib===-1)return a.localeCompare(b,"he");
    if(ia===-1)return 1;
    if(ib===-1)return -1;
    return ia-ib;
  });
}

// One management screen: inline rename, one-tap delete (with undo), and
// up/down reordering — replaces the old multi-sheet flow.
function manageCategoriesSheet(){
  if(!homeScreen)return;
  showModal(homeScreen,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"14px"}},"ניהול קטגוריות"));
    const listWrap=el("div");

      listWrap.innerHTML="";

      if(!cats.length){
        listWrap.appendChild(el("p",{style:{color:"var(--text-muted)",fontSize:"13px",textAlign:"center",padding:"18px 0"}},"אין קטגוריות עדיין"));
        return;
      }
      cats.forEach((cat,i)=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",gap:"4px",padding:"8px 12px",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"8px",marginBottom:"8px"}});
        const count=Object.values(whCategories).filter(v=>v===cat).length;
        const nameWrap=el("div",{style:{flex:"1",minWidth:"0"}});

        nameWrap.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)"}},`${count} מחסנים`));
        row.appendChild(nameWrap);
        const mkIcon=(name,fn,danger)=>{const b=el("button",{className:"icon-btn",style:{padding:"7px",color:danger?"var(--danger)":"var(--text-sec)"},onClick:fn});b.appendChild(icon(name,16));return b};
        const move=async dir=>{
          const arr=currentCats();
          const j=i+dir;if(j<0||j>=arr.length)return;
          [arr[i],arr[j]]=[arr[j],arr[i]];
          catOrder=arr;
          redraw();renderCatChips();
          await dbSet(`users/${currentUser.username}/catOrder`,arr).catch(()=>{});
        };
        const upB=mkIcon("up",()=>move(-1));if(i===0)upB.style.visibility="hidden";
        const downB=mkIcon("down",()=>move(1));if(i===cats.length-1)downB.style.visibility="hidden";

            const upd={};Object.entries(whCategories).forEach(([id,v])=>{if(v===cat)upd[id]=name});
            Object.keys(upd).forEach(id=>{whCategories[id]=name});

            redraw();renderCatChips();applyCatFilter();

            await dbSet(`users/${currentUser.username}/catOrder`,catOrder).catch(()=>{});
          };
          row.innerHTML="";
          row.append(inp,el("button",{className:"btn btn-primary btn-sm",onClick:save},"שמור"));
          inp.addEventListener("keydown",e=>{if(e.key==="Enter")save()});
          setTimeout(()=>{inp.focus();inp.select()},50);
        }));
        row.appendChild(mkIcon("trash",async()=>{
          const restore={};
          Object.entries(whCategories).forEach(([id,v])=>{if(v===cat)restore[id]=v});
          const upd={};Object.keys(restore).forEach(id=>{upd[id]=null;delete whCategories[id]});
          catOrder=catOrder.filter(x=>x!==cat);
          if(catFilter===cat){catFilter=null}

          await dbSet(`users/${currentUser.username}/catOrder`,catOrder).catch(()=>{});

    m.appendChild(el("button",{className:"btn btn-primary",style:{width:"100%",marginTop:"12px"},onClick:close},"סגור"));
  });
}
// ── Global search (home screen): searches every warehouse the user can see,
// straight from the per-warehouse cache the cards already keep fresh. ──
function buildGlobalSearch(wrap,content){
  const sw=el("div",{id:"globalSearchWrap",style:{position:"sticky",top:"0",zIndex:"50",background:"var(--bg)",padding:"8px 16px 4px"}});
  const pinUnderHeader=()=>{const h=wrap.querySelector('.header');if(h)sw.style.top=h.offsetHeight+"px"};
  requestAnimationFrame(pinUnderHeader);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(pinUnderHeader);
  requestAnimationFrame(()=>{const h=wrap.querySelector('.header');if(h&&window.ResizeObserver)new ResizeObserver(pinUnderHeader).observe(h,{box:'border-box'})});
  const row=el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
  const bar=el("div",{className:"search-bar",style:{flex:"1",position:"relative"}});
  const inp=el("input",{className:"app-input",id:"globalSearchInput",placeholder:"חיפוש מחסנים ופריטים...",style:{paddingRight:"40px",paddingLeft:"40px"},autocapitalize:"off"});
  const clr=el("button",{style:{position:"absolute",left:"12px",top:"50%",transform:"translateY(-50%)",background:"var(--border)",border:"none",borderRadius:"6px",width:"22px",height:"22px",color:"var(--text)",cursor:"pointer",display:"none",alignItems:"center",justifyContent:"center"},onClick:()=>{inp.value="";run();inp.focus()}});
  clr.appendChild(icon("close",14));
  const cancel=el("button",{className:"btn btn-ghost",style:{padding:"10px 14px",borderRadius:"8px",whiteSpace:"nowrap",fontSize:"13px",height:"46px",display:"none"},onClick:()=>{inp.value="";inp.blur();run();cancel.style.display="none"}},"ביטול");
  bar.append(inp,icon("search",18),clr);row.append(bar,cancel);sw.appendChild(row);
  const results=el("div",{id:"globalResults",style:{display:"none",padding:"8px 16px 0"}});
  wrap.appendChild(sw);wrap.appendChild(results);
  inp.addEventListener("focus",()=>{cancel.style.display="flex"});
  inp.addEventListener("blur",()=>{if(!inp.value)setTimeout(()=>{cancel.style.display="none"},150)});
  inp.addEventListener("input",run);
  inp.addEventListener("keydown",e=>{if(e.key==="Escape")cancel.click()});
  function run(){
    const q=inp.value.trim().toLowerCase();
    clr.style.display=q?"flex":"none";
    if(!q){results.style.display="none";content.style.display="";return}
    content.style.display="none";results.style.display="";results.innerHTML="";
    let total=0;const MAX=60;
    // Warehouses whose name matches come first.
    const whHits=lastHomeWhIds.map(id=>[id,cacheGet(`warehouses/${id}`)]).filter(([,wh])=>wh&&(wh.name||"").toLowerCase().includes(q));
    if(whHits.length){
      const group=el("div",{style:{marginBottom:"14px"}});
      group.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"600",color:"var(--text-sec)",padding:"6px 4px"}},"מחסנים"));
      whHits.forEach(([whId,wh])=>{
        total++;
        const n=wh.items?Object.keys(wh.items).length:0;
        const rowEl=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",padding:"11px 14px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:"8px",marginBottom:"6px",cursor:"pointer"},onClick:()=>{inp.blur();renderListDetail(whId)}});
        rowEl.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"600",minWidth:"0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},wh.name||""));
        rowEl.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)",flexShrink:"0"}},n===1?"פריט אחד":`${n} פריטים`));
        group.appendChild(rowEl);
      });
      results.appendChild(group);
    }
    lastHomeWhIds.forEach(whId=>{
      if(total>=MAX)return;
      const wh=cacheGet(`warehouses/${whId}`);if(!wh||!wh.items)return;
      const hits=Object.entries(wh.items).filter(([,it])=>(it.name||"").toLowerCase().includes(q)||(it.sku&&String(it.sku).toLowerCase().includes(q))||(it.note&&it.note.toLowerCase().includes(q)));
      if(!hits.length)return;
      hits.sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"","he"));
      const group=el("div",{style:{marginBottom:"14px"}});
      const head=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 4px",cursor:"pointer"},onClick:()=>{inp.blur();renderListDetail(whId)}});
      head.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"600",color:"var(--text-sec)"}},wh.name));
      head.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)"}},`${hits.length} פריטים`));
      group.appendChild(head);
      const showSku=userPrefs.showSku!==false&&whFeatOn(wh.features,'showSku');
      const lowOn=userPrefs.showLowStock!==false&&whFeatOn(wh.features,'showLowStock');
      hits.forEach(([itemId,it])=>{
        if(total>=MAX)return;total++;
        const q0=it.quantity||0;
        const rowEl=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",padding:"11px 14px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:"8px",marginBottom:"6px",cursor:"pointer"},onClick:()=>{pendingSearch=inp.value.trim();inp.blur();renderListDetail(whId)}});
        const info=el("div",{style:{minWidth:"0"}});
        info.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"400",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},it.name||""));
        const sub=[];if(showSku&&it.sku)sub.push(`מק"ט: ${it.sku}`);if(it.note)sub.push(it.note);
        if(sub.length)info.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},sub.join(" · ")));
        const right=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexShrink:"0"}});
        const low=lowOn&&(q0===0||(it.lowStock&&q0<=it.lowStock));
        if(low)right.appendChild(el("span",{style:{fontSize:"13px",fontWeight:"600",padding:"2px 8px",borderRadius:"8px",background:q0===0?"var(--danger-bg)":"var(--warning-bg)",color:q0===0?"var(--danger)":"var(--warning)"}},q0===0?"אזל":"מלאי נמוך"));
        right.appendChild(el("span",{style:{fontSize:"24px",fontWeight:"600",color:q0===0?"var(--danger)":low?"var(--warning)":"var(--text)"}},String(q0)));
        rowEl.append(info,right);group.appendChild(rowEl);
      });
      results.appendChild(group);
    });
    if(!total)results.appendChild(el("div",{className:"empty-state"},`לא נמצאו תוצאות עבור "${inp.value.trim()}"`));
    else if(total>=MAX)results.appendChild(el("div",{style:{textAlign:"center",fontSize:"13px",color:"var(--text-muted)",padding:"6px"}},"מוצגות 60 התוצאות הראשונות — דייק את החיפוש"));
  }
}

  const u4=dbListenCached(`users/${currentUser.username}/prefs`,data=>{userPrefs=data||{}});
  // Home listeners live in homeUnsubs only: cleanup() (run when a warehouse
  // opens) must not kill the sidebar in split view. dbListenCached also pushed

  inviteCountSeen=-1;noticeCountSeen=-1;

  const u6=FB.onValue(dbRef(`users/${currentUser.username}/notices`),snap=>{myNotices=snap.exists()?snap.val():{};updateInviteBell()},()=>{});
  [u,u2,u3,u4].forEach(f=>{const i=unsubscribers.indexOf(f);if(i>=0)unsubscribers.splice(i,1)});
