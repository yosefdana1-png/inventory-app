  <style>
    :root {
      --bg: #0c0f14; --surface: #161b24; --card: #1a2030; --card-hover: #212a3a;
      --accent: #4f8cff; --accent-glow: rgba(79,140,255,0.15);
      --danger: #ff5c5c; --danger-bg: rgba(255,92,92,0.1);
      --success: #34d399; --success-bg: rgba(52,211,153,0.1);
      --warning: #fbbf24; --warning-bg: rgba(251,191,36,0.1);
      --text: #e8ecf4; --text-sec: #8b95a8; --text-muted: #5a6478; --border: #252d3d;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .app-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;direction:rtl;transition:border-color .2s}
    .app-input:focus{border-color:var(--accent)}.app-input::placeholder{color:var(--text-muted)}
    textarea.app-input{resize:vertical;min-height:60px}
    .btn{border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--accent);color:#fff}.btn-danger{background:var(--danger);color:#fff}
    .btn-success{background:var(--success);color:#000}.btn-ghost{background:transparent;color:var(--text-sec);border:1px solid var(--border)}
    .btn-warning{background:var(--warning);color:#000}
    .btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn .15s ease}
    .modal{background:var(--surface);border-radius:20px;padding:28px;width:100%;max-width:400px;border:1px solid var(--border);animation:scaleIn .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
    .modal h3{font-size:18px;font-weight:600;margin-bottom:4px}
    .header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:max(16px,env(safe-area-inset-top)) 20px 16px;display:flex;align-items:center;justify-content:space-between}
    .list-card{background:var(--card);border-radius:16px;padding:18px 20px;border:1px solid var(--border);cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:space-between}
    .list-card:active,.list-card:hover{background:var(--card-hover)}
    .item-card{background:var(--card);border-radius:16px;padding:14px 12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;transition:all .2s;gap:4px;overflow:hidden}
    .item-card.dragging{opacity:.5;border-color:var(--accent)}
    .item-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
    /* Only the card being dragged gets its transition killed, so it tracks the
       finger with zero lag. The OTHER cards must keep their transition — that's
       what animates them sliding out of the way. (An earlier version killed
       transitions on every card in the list, which silently disabled the whole
       make-room animation.) */
    .item-card.drag-active{transition:none!important}
    [data-wh-id].drag-over .list-card{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
    .icon-btn{background:none;border:none;color:var(--text-sec);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center}
    .qty-btn{width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .qty-btn-add{background:var(--success-bg);border:1px solid rgba(52,211,153,.2);color:var(--success)}
    .qty-btn-sub{background:var(--danger-bg);border:1px solid rgba(255,92,92,.2);color:var(--danger)}
    .fab{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:18px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(79,140,255,.4);z-index:90}
    .toggle-group{display:flex;gap:8px;margin-bottom:20px}
    .toggle-pill{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-sec);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .2s}
    .toggle-pill.active-add{border-color:var(--success);background:var(--success-bg);color:var(--success)}
    .toggle-pill.active-sub{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .history-row{padding:10px 0;display:flex;justify-content:space-between;align-items:center}
    .history-row+.history-row{border-top:1px solid var(--border)}
    .spinning{animation:spin .6s linear}.shaking{animation:shake .5s ease}.screen{background:var(--bg);min-height:100vh;min-height:100dvh;height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .tab-bar{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;border:1px solid var(--border);margin-bottom:16px}
    .tab-btn{flex:1;padding:9px 4px;border-radius:10px;border:none;background:transparent;color:var(--text-sec);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:all .2s;white-space:nowrap}
    .tab-btn.active{background:var(--accent);color:#fff}
    .user-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;background:var(--accent-glow);border:1px solid rgba(79,140,255,.2);border-radius:20px;font-size:13px;color:var(--accent)}
    .shared-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--warning-bg);border:1px solid rgba(251,191,36,.2);border-radius:8px;font-size:11px;color:var(--warning);margin-top:4px}
    .members-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .member-chip{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-sec)}
    .search-bar{position:relative}
    .search-bar>svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
    .toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .toolbar-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-sec);cursor:pointer;font-family:inherit;font-size:12px;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
    @keyframes sheetUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
    .action-sheet-overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px max(env(safe-area-inset-bottom),12px);animation:fadeIn .22s ease}
    .action-sheet-group,.action-sheet-cancel-group{border-radius:22px;overflow:hidden;margin-bottom:8px;animation:sheetUp .42s cubic-bezier(0.32,0.72,0,1);position:relative;background:rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(80px) saturate(180%) brightness(1.12);backdrop-filter:blur(80px) saturate(180%) brightness(1.12);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.30),inset 0 2px 1px rgba(255,255,255,0.50),inset 0 -1px 1px rgba(0,0,0,0.10),0 20px 60px rgba(0,0,0,0.50)}
    .action-sheet-group::before,.action-sheet-cancel-group::before{content:'';position:absolute;inset:0;background:linear-gradient(175deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.06) 25%,transparent 55%,rgba(255,255,255,0.04) 100%);pointer-events:none;border-radius:inherit;z-index:0}
    .action-sheet-item{width:100%;padding:17px 20px;text-align:center;font-size:17px;font-family:inherit;border:none;cursor:pointer;display:block;background:transparent;color:#0a84ff;position:relative;z-index:1;transition:background .12s;-webkit-tap-highlight-color:transparent}
    .action-sheet-item:not(:last-child){border-bottom:0.5px solid rgba(255,255,255,0.14)}
    .action-sheet-item:active{background:rgba(255,255,255,0.16)}
    .action-sheet-item.danger{color:#ff453a}
    .action-sheet-cancel{width:100%;padding:17px 20px;text-align:center;font-size:17px;font-weight:600;font-family:inherit;border:none;cursor:pointer;display:block;background:transparent;color:#fff;position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
    .action-sheet-cancel:active{background:rgba(255,255,255,0.16)}
    .scroll-top-btn{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:20px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(80px) saturate(180%) brightness(1.12);backdrop-filter:blur(80px) saturate(180%) brightness(1.12);border:none;color:#0a84ff;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:80;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.30),inset 0 2px 1px rgba(255,255,255,0.50),0 8px 24px rgba(0,0,0,0.50);opacity:0;transform:translateY(8px);transition:opacity .25s ease, transform .25s ease}
    .scroll-top-btn.visible{display:flex;opacity:1;transform:translateY(0)}
    .toolbar-btn:hover,.toolbar-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
    .toolbar-btn.danger-hover:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
    .note-text{font-size:12px;color:var(--text-muted);margin-top:2px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cat-chip{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-sec);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;flex-shrink:0}
    .cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .cat-chip:active{transform:scale(.96)}
    .drag-handle{cursor:grab;touch-action:none;color:var(--text-muted);padding:4px}
    .drag-handle:active{cursor:grabbing}
    .undo-toast{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:16px;right:16px;z-index:4000;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px 12px 12px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.55);animation:fadeIn .2s ease}
    .undo-btn{background:var(--accent-glow);border:1px solid rgba(79,140,255,.3);color:var(--accent);border-radius:10px;padding:8px 18px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
    .item-img-slot{width:56px;height:56px;flex-shrink:0;margin-right:10px;border-radius:10px}
    .item-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--border);display:block}
  </style>

</head>

<script>
// ── Temporary boot-failure reporter: if anything throws before the first
// screen renders, show it instead of the eternal loading dots. ──
window.__bootErr=e=>{
  try{
    var app=document.getElementById("app");
    if(!app||app.querySelector(".screen"))return;
    var msg=(e&&(e.message||(e.reason&&(e.reason.message||e.reason.code))||e.type))||String(e);
    var src=(e&&e.filename)?e.filename.split("/").pop()+":"+e.lineno:"";
    var d=document.createElement("div");
    d.style.cssText="padding:40px 24px;color:#ff5c5c;font-size:13px;direction:ltr;text-align:left;word-break:break-all;font-family:monospace";
    d.textContent="BOOT ERROR: "+msg+(src?" @ "+src:"");
    app.appendChild(d);
  }catch(x){}
};
window.addEventListener("error",window.__bootErr,true);
window.addEventListener("unhandledrejection",window.__bootErr);
setTimeout(()=>{
  try{
    var app=document.getElementById("app");
    if(app&&!app.querySelector(".screen")&&!app.querySelector("div[style*='monospace']")){
      var d=document.createElement("div");
      d.style.cssText="padding:40px 24px;color:#fbbf24;font-size:13px;direction:ltr;text-align:left;font-family:monospace";
      d.textContent="BOOT STALL: no screen after 12s. FB="+(!!window.FB)+" auth="+(!!(window.FB&&window.FB.auth))+" user="+(function(){try{return !!localStorage.getItem("inv_user")}catch(e){return "ls-err"}})();
      app.appendChild(d);
    }
  }catch(x){}
},12000);
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...ch)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")e.className=v;else if(k==="innerHTML")e.innerHTML=v;else e.setAttribute(k,v)}for(const c of ch){if(typeof c==="string")e.appendChild(document.createTextNode(c));else if(c)e.appendChild(c)}return e};
const icon=(name,size=20)=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("width",size);s.setAttribute("height",size);s.innerHTML=`<use href="#icon-${name}"/>`;return s};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let FB=null,currentUser=null,unsubscribers=[];

function dbRef(p){return FB.ref(FB.db,p)}
async function dbGet(p){const s=await FB.get(dbRef(p));return s.exists()?s.val():null}
async function dbSet(p,v){await FB.set(dbRef(p),v)}
async function dbRemove(p){await FB.remove(dbRef(p))}
async function dbUpdate(p,v){await FB.update(dbRef(p),v)}
function dbListen(p,cb){const u=FB.onValue(dbRef(p),s=>cb(s.exists()?s.val():null));unsubscribers.push(u);return u}

// ── Firebase Authentication glue ──
// The login UX stays username+password; behind the scenes each username maps to
// a synthetic email for Firebase email/password auth. Passwords live ONLY in
// Firebase Auth — never in the database.
// ASCII usernames map directly; Hebrew/spaces/anything else is encoded to
// lowercase base32 (case-insensitive-safe — Firebase may normalize email case).
const b32enc=bytes=>{const A="abcdefghijklmnopqrstuvwxyz234567";let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=A[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=A[(val<<(5-bits))&31];return out};
const emailForUsername=u=>/^[a-z0-9._-]+$/.test(u)?`${u}@inv-user.app`:`u-${b32enc(new TextEncoder().encode(u))}@inv-user.app`;
// Firebase requires passwords of 6+ chars; legacy accounts allowed 4-5. Pad
// short ones deterministically with zeros so old passwords keep working
// unchanged ("1234" → auth password "123400"). The same padding must be used
// when an admin pre-creates accounts in the Firebase console.
const authPw=p=>p.length>=6?p:p+"0".repeat(6-p.length);
// usernames/<name> → {uid,displayName} and uids/<uid> → {username} let the
// security rules translate between the app's username keys and auth uids, and
// give an existence check for sharing that doesn't expose user data.
async function ensureIdentity(username,displayName){
  const u=FB.auth&&FB.auth.currentUser;if(!u)return;
  try{await dbUpdate(`usernames/${username}`,displayName?{uid:u.uid,displayName}:{uid:u.uid})}catch(e){}
  try{await dbUpdate(`uids/${u.uid}`,{username})}catch(e){}
}

// Local cache for instant loading. Stored in localStorage so it survives
// app restarts (sessionStorage is wiped every launch on iOS standalone).
// On quota overflow, retry with item images stripped so text data still caches.
function cacheSet(key,data){
  const k='inv_'+key;
  try{localStorage.setItem(k,JSON.stringify(data))}
  catch(e){
    try{
      if(data&&data.items){
        const slim={...data,items:{}};
        for(const[id,it]of Object.entries(data.items)){const{image,...rest}=it;slim.items[id]=rest}
        localStorage.setItem(k,JSON.stringify(slim));
      }else localStorage.removeItem(k);
    }catch(e2){try{localStorage.removeItem(k)}catch(e3){}}
  }
}
function cacheGet(key){try{const d=localStorage.getItem('inv_'+key);return d?JSON.parse(d):null}catch(e){return null}}
function cacheClearAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('inv_')&&k!=='inv_user').forEach(k=>localStorage.removeItem(k))}catch(e){}}

function dbListenCached(p,cb){
  const cached=cacheGet(p);
  let cacheShown=false;
  if(cached!==null){cb(cached);cacheShown=true}
  const u=FB.onValue(dbRef(p),s=>{
    const val=s.exists()?s.val():null;
    const valStr=JSON.stringify(val);
    const oldStr=cacheShown?JSON.stringify(cacheGet(p)):null;
    cacheSet(p,val);
    // Skip if data is same as what we already showed from cache
    if(cacheShown&&valStr===oldStr){cacheShown=false;return}
    cacheShown=false;
    cb(val);
  });
  unsubscribers.push(u);return u;
}
function render(s){const a=$("#app");a.innerHTML="";a.appendChild(s)}

// ═══════════ JOIN-BY-QR ═══════════
// A warehouse QR encodes APP_URL#join=<whId>.<inviteToken>. Scanning it with
// the phone camera opens the app; after login the app presents the token and
// the security rules let the scanner add themselves as a member — no manual
// username typing. The token lives at warehouses/<id>/inviteToken; renewing it
// invalidates every previously printed/shared QR.
const APP_URL="https://yosefdana1-png.github.io/inventory-app/";
let pendingJoin=null;
(function(){
  const m=location.hash.match(/^#join=([A-Za-z0-9]+)\.([A-Za-z0-9]+)$/);
  if(m){pendingJoin={whId:m[1],token:m[2]};try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
})();
async function processPendingJoin(){
  if(!pendingJoin||!FB||!currentUser)return; // retried on the next home render
  const{whId,token}=pendingJoin;pendingJoin=null;
  try{
    // The rules accept this write only when the value equals the warehouse's
    // current inviteToken (or if we're already a member).
    await dbSet(`warehouses/${whId}/members/${currentUser.username}`,token);
    await dbSet(`users/${currentUser.username}/warehouses/${whId}`,Date.now());
    let name="";try{name=(await dbGet(`warehouses/${whId}/name`))||""}catch(e){}
    showNotice(name?`הצטרפת למחסן "${name}"`:"הצטרפת למחסן");
  }catch(e){
    showNotice("קוד ההצטרפות אינו תקף — בקש קוד חדש מחבר במחסן");
  }
}
// Small auto-hiding notice (no button) in the same style as the undo toast.
function showNotice(message){
  hideUndoToast();
  const t=el("div",{className:"undo-toast"});
  t.appendChild(el("span",{style:{flex:"1"}},message));
  document.body.appendChild(t);

  undoTimer=setTimeout(hideUndoToast,4000);
}
// Fullscreen QR display (image-viewer style) — tap anywhere to close.

  ov.appendChild(el('div',{style:{color:'rgba(255,255,255,0.35)',fontSize:'12px'}},'הקש לסגירה'));

function loadQRLib(){
  return window.QRCode?Promise.resolve():new Promise((res,rej)=>{

// ═══════════ UNDO TOAST ═══════════
// A short-lived "בטל" bar after destructive actions. One at a time — a new
// action replaces the previous toast (and its undo window).
let undoToastEl=null,undoTimer=null;
function hideUndoToast(){
  if(undoTimer){clearTimeout(undoTimer);undoTimer=null}
  if(undoToastEl){undoToastEl.remove();undoToastEl=null}
}
function showUndoToast(message,restoreFn){
  hideUndoToast();
  const t=el("div",{className:"undo-toast"});
  t.appendChild(el("span",{style:{flex:"1",minWidth:"0",overflow:"hidden",textOverflow:"ellipsis"}},message));
  let remaining=8;
  const btn=el("button",{className:"undo-btn",onClick:async()=>{
    hideUndoToast();
    try{await restoreFn()}catch(e){}
  }},`בטל (${remaining})`);
  t.appendChild(btn);
  document.body.appendChild(t);
  undoToastEl=t;
  // Countdown in the button itself — the user sees how long the offer lasts.
  undoTimer=setInterval(()=>{
    remaining--;
    if(remaining<=0){hideUndoToast();return}
    btn.textContent=`בטל (${remaining})`;
  },1000);
}
function cleanup(){unsubscribers.forEach(f=>f());unsubscribers=[]}

// ═══════════ iOS-STYLE NAVIGATION STACK ═══════════
// Both screens live in DOM. We slide the detail screen on/off.
let homeScreen=null;
let detailScreen=null;
let isShowingDetail=false;

function navInit(){
  const app=$("#app");
  app.style.position="relative";
  app.style.width="100%";
}

function navShowHome(animated){
  const app=$("#app");
  if(!homeScreen)return;
  
  if(!isShowingDetail||!animated){
    app.innerHTML="";
    homeScreen.style.transform="";homeScreen.style.transition="";
    app.appendChild(homeScreen);
    isShowingDetail=false;
    return;
  }
  
  // Animate back: detail slides right, home slides in from left
  if(!app.contains(homeScreen)){
    homeScreen.style.transform="translateX(-25%)";
    homeScreen.style.opacity="0.6";
    homeScreen.style.position="absolute";homeScreen.style.top="0";homeScreen.style.left="0";homeScreen.style.right="0";
    app.insertBefore(homeScreen,detailScreen);
  }
  
  if(detailScreen){
    detailScreen.style.position="relative";
    detailScreen.style.zIndex="2";
    detailScreen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1)";
    detailScreen.style.transform="translateX(100%)";
  }
  homeScreen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1), opacity 0.35s cubic-bezier(0.32,0.72,0,1)";
  homeScreen.style.transform="translateX(0)";
  homeScreen.style.opacity="1";
  
  setTimeout(()=>{
    app.innerHTML="";
    homeScreen.style.position="";homeScreen.style.transform="";homeScreen.style.transition="";homeScreen.style.opacity="";
    app.appendChild(homeScreen);
    if(detailScreen){detailScreen.style.transform="";detailScreen.style.transition="";detailScreen.style.position="";detailScreen.style.zIndex="";}
    isShowingDetail=false;
  },360);
}

function navShowDetail(screen){
  const app=$("#app");
  detailScreen=screen;
  isShowingDetail=true;
  
  if(homeScreen&&app.contains(homeScreen)){
    // Set up home to be behind
    homeScreen.style.position="absolute";homeScreen.style.top="0";homeScreen.style.left="0";homeScreen.style.right="0";
    homeScreen.style.zIndex="1";
    
    // Slide detail in from right
    screen.style.position="relative";
    screen.style.zIndex="2";
    screen.style.transform="translateX(100%)";
    app.appendChild(screen);
    
    requestAnimationFrame(()=>{
      screen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1)";
      screen.style.transform="translateX(0)";
      homeScreen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1), opacity 0.35s cubic-bezier(0.32,0.72,0,1)";
      homeScreen.style.transform="translateX(-25%)";
      homeScreen.style.opacity="0.6";
    });
    
    setTimeout(()=>{
      app.innerHTML="";
      screen.style.position="";screen.style.zIndex="";screen.style.transform="";screen.style.transition="";
      app.appendChild(screen);
      homeScreen.style.position="";homeScreen.style.zIndex="";homeScreen.style.transform="";homeScreen.style.transition="";homeScreen.style.opacity="";
    },360);
  }else{
    app.innerHTML="";
    app.appendChild(screen);
  }
}

// ═══════════ AUTH ═══════════
function renderAuth(){
  cleanup();let mode="login";
  const wrap=el("div",{className:"screen",style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px"}});
  const box=el("div",{style:{textAlign:"center",width:"100%",maxWidth:"340px"}});
  const iw=el("div",{style:{width:"80px",height:"80px",borderRadius:"20px",background:"var(--accent-glow)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",border:"1px solid var(--border)"}});
  iw.appendChild(icon("box",40));
  box.append(iw,el("h1",{style:{fontSize:"26px",fontWeight:"600",marginBottom:"8px"}},"ניהול מלאי"),el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"24px"}},"התחבר או צור חשבון חדש"));
  const tabs=el("div",{className:"tab-bar"});
  const lt=el("button",{className:"tab-btn active",onClick:()=>{mode="login";lt.className="tab-btn active";rt.className="tab-btn";nr.style.display="none";err.textContent="";ab.textContent="התחבר";}},"התחברות");
  const rt=el("button",{className:"tab-btn",onClick:()=>{mode="register";rt.className="tab-btn active";lt.className="tab-btn";nr.style.display="block";err.textContent="";ab.textContent="צור חשבון";}},"הרשמה");
  tabs.append(lt,rt);box.appendChild(tabs);
  const nr=el("div",{style:{display:"none",marginBottom:"12px"}});
  const ni=el("input",{className:"app-input",placeholder:"שם תצוגה"});nr.appendChild(ni);
  const ui=el("input",{className:"app-input",placeholder:"שם משתמש",style:{marginBottom:"12px"},autocapitalize:"off",autocorrect:"off"});
  const pi=el("input",{type:"password",className:"app-input",placeholder:"סיסמה"});
  const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",marginTop:"10px",minHeight:"20px"}});
  const ab=el("button",{className:"btn btn-primary",style:{width:"100%",marginTop:"16px",height:"48px"},onClick:async()=>{
    const username=ui.value.trim().toLowerCase(),password=pi.value;
    if(!username||!password){err.textContent="יש למלא שם משתמש וסיסמה";return}
    if(username.length<2){err.textContent="שם משתמש חייב להיות לפחות 2 תווים";return}
    if(mode==="register"&&username.length>20){err.textContent="שם משתמש יכול להכיל עד 20 תווים";return}
    if(mode==="register"&&password.length<6){err.textContent="סיסמה חייבת להיות לפחות 6 תווים";return}
    if(password.length<4){err.textContent="סיסמה חייבת להיות לפחות 4 תווים";return}
    if(!FB){err.textContent="אין חיבור — נסה שוב";return}
    ab.disabled=true;ab.textContent="...";err.textContent="";
    const fail=msg=>{err.textContent=msg;ab.disabled=false;ab.textContent=mode==="login"?"התחבר":"צור חשבון";box.classList.add("shaking");setTimeout(()=>box.classList.remove("shaking"),500)};
    const email=emailForUsername(username);
    try{
      if(mode==="register"){
        try{await FB.createUserWithEmailAndPassword(FB.auth,email,authPw(password))}
        catch(e){
          if(e.code==="auth/email-already-in-use"){fail("שם משתמש כבר תפוס")}
          else if(e.code==="auth/network-request-failed"){fail("שגיאה בחיבור — נסה שוב")}
          else fail("שגיאה ביצירת החשבון — נסה שוב");
          return;
        }
        const dn=ni.value.trim()||username;
        await ensureIdentity(username,dn);
        await dbSet(`users/${username}`,{displayName:dn,createdAt:new Date().toISOString()});
        currentUser={username,displayName:dn};localStorage.setItem("inv_user",JSON.stringify(currentUser));renderHome();
      }else{
        try{await FB.signInWithEmailAndPassword(FB.auth,email,authPw(password))}
        catch(e){
          const code=e.code||"";
          if(code==="auth/network-request-failed"){fail("שגיאה בחיבור — נסה שוב");return}
          if(code==="auth/too-many-requests"){fail("יותר מדי ניסיונות — נסה שוב בעוד כמה דקות");return}
          // No auth account (or auth rejected) — legacy migration path: accounts
          // from before Firebase Auth keep their password in the DB. Verify it,
          // create the real auth account with the SAME password, then delete the
          // plaintext copy for good.
          let legacy=null;
          try{legacy=await dbGet(`users/${username}/password`)}catch(e2){}
          if(legacy===null||legacy!==password){fail("שם משתמש או סיסמה שגויים");return}
          try{await FB.createUserWithEmailAndPassword(FB.auth,email,authPw(password))}
          catch(e3){fail("שם משתמש או סיסמה שגויים");return}
          try{await dbRemove(`users/${username}/password`)}catch(e4){}
        }
        // The rules key every user-data access off usernames/<u>/uid, so the
        // mapping must exist before the profile read on a first login.
        await ensureIdentity(username);
        // Sweep any plaintext password left from before Firebase Auth. Accounts
        // pre-created by the admin sign in successfully and never hit the
        // legacy-migration branch, so this is what removes their old password
        // node on first login. No-op once gone.
        dbRemove(`users/${username}/password`).catch(()=>{});
        let ud=null;
        try{ud=await dbGet(`users/${username}`)}catch(e){}
        currentUser={username,displayName:(ud&&ud.displayName)||username};
        localStorage.setItem("inv_user",JSON.stringify(currentUser));
        await ensureIdentity(username,currentUser.displayName);
        renderHome();
      }
    }catch(e){fail("שגיאה בחיבור — נסה שוב")}
  }},"התחבר");
  pi.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click()});
  box.append(nr,ui,pi,err,ab);wrap.appendChild(box);render(wrap);ui.focus();
}

// ═══════════ HOME ═══════════
let cachedHomeContent=null;
let homeUnsubs=[];

// Personal warehouse order is stored as a number per id in users/<uid>/warehouses.
// Legacy entries stored as `true` sort first (treated as 0).
function sortedWhIds(data){
  const entries=data?Object.entries(data):[];
  entries.sort((a,b)=>(typeof a[1]==='number'?a[1]:0)-(typeof b[1]==='number'?b[1]:0));
  return entries.map(([id])=>id);
}

// Category chips on the home screen. Categories are personal (stored under the
// user's own node), so everyone organizes THEIR list without affecting others.
// Chips derive from categories actually assigned to current warehouses.
function currentCats(){
  const cats=[...new Set(lastHomeWhIds.map(id=>whCategories[id]).filter(Boolean))];
  return cats.sort((a,b)=>{
    const ia=catOrder.indexOf(a),ib=catOrder.indexOf(b);
    if(ia===-1&&ib===-1)return a.localeCompare(b,"he");
    if(ia===-1)return 1;
    if(ib===-1)return -1;
    return ia-ib;
  });
}
function showCategoryNameModal(whId,initial){
  if(!homeScreen)return;
  showModal(homeScreen,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"16px"}},initial?"שינוי שם קטגוריה":"קטגוריה חדשה"));
    const inp=el("input",{className:"app-input",placeholder:'שם הקטגוריה (למשל: "בית")'});

function attachHomeWarehouseListener(content,screen){

  const u=dbListenCached(`users/${currentUser.username}/warehouses`,data=>{
    lastHomeWhIds=sortedWhIds(data);
    renderWarehouseList(content,lastHomeWhIds,screen);
    renderCatChips();applyCatFilter();
  });
  const u2=dbListenCached(`users/${currentUser.username}/whCategories`,data=>{

}

let currentWhIds=[];
let whCardListeners=[];

function renderWarehouseList(c,whIds,wrap){
  // Never rebuild the list under an active drag — defer to finishWhTouchDrag.
  if(whTouchDrag){pendingWhRender=true;return}
  const same=currentWhIds.length===whIds.length&&currentWhIds.every((id,i)=>id===whIds[i]);
  const cardsExist=c.querySelector('#warehouseCards');

  if(same&&cardsExist&&whCardListeners.length>0)return;

  if(same&&cardsExist&&whCardListeners.length===0&&FB){
    whIds.forEach(whId=>{
      const cw=document.getElementById(`wh-${whId}`);
      if(!cw)return;
      const unsub=FB.onValue(dbRef(`warehouses/${whId}`),snap=>{
        const wh=snap.exists()?snap.val():null;
        cacheSet(`warehouses/${whId}`,wh);
        if(!wh){cw.innerHTML="";return}
        buildWarehouseCard(cw,whId,wh,wrap);
      });
      whCardListeners.push(unsub);
    });
    return;
  }

  whCardListeners.forEach(f=>f());
  whCardListeners=[];
  currentWhIds=[...whIds];

  c.innerHTML="";
  if(whIds.length===0){
    const empty=el("div",{className:"empty-state"});empty.appendChild(icon("box",40));
    empty.appendChild(el("p",{style:{marginTop:"16px",fontSize:"16px"}},"אין מחסנים עדיין"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"4px"}},"לחץ על + כדי ליצור מחסן"));
    c.appendChild(empty);return;
  }

  const cardsContainer=el("div",{id:"warehouseCards"});
  c.appendChild(cardsContainer);

  whIds.forEach((whId)=>{
    const cardWrapper=el("div",{id:`wh-${whId}`,style:{marginBottom:"10px"}});
    cardsContainer.appendChild(cardWrapper);

    const cachedWh=cacheGet(`warehouses/${whId}`);
    if(cachedWh)buildWarehouseCard(cardWrapper,whId,cachedWh,wrap);

    if(FB){
      const unsub=FB.onValue(dbRef(`warehouses/${whId}`),snap=>{
        const wh=snap.exists()?snap.val():null;
        cacheSet(`warehouses/${whId}`,wh);
        if(!wh){cardWrapper.innerHTML="";return}
        buildWarehouseCard(cardWrapper,whId,wh,wrap);
      });
      whCardListeners.push(unsub);
    }
  });
  applyCatFilter();
}

function buildWarehouseCard(cardWrapper,whId,wh,wrap){
  const existing=cardWrapper.querySelector('.list-card');
  if(existing){
    if(!whReorderMode){
      const countEl=existing.querySelector('.wh-count');
      const totalEl=existing.querySelector('.wh-total');
      const items=wh.items?Object.values(wh.items):[];
      const total=items.reduce((s,it)=>s+(it.quantity||0),0);
      if(countEl)countEl.textContent=`${items.length} פריטים`;
      if(totalEl)totalEl.textContent=`סה״כ: ${total}`;
    }
    return;
  }

  const card=el("div",{className:"list-card"});
  if(!whReorderMode)card.onclick=()=>renderListDetail(whId);

  const items=wh.items?Object.values(wh.items):[];
  const total=items.reduce((s,it)=>s+(it.quantity||0),0);
  const members=wh.members?Object.keys(wh.members):[];
  const isShared=members.length>1;
  const info=el("div",{style:{flex:"1"}});
  info.appendChild(el("h3",{style:{fontSize:"17px",fontWeight:"600",marginBottom:"2px"}},wh.name));
  if(isShared){const sb=el("div",{className:"shared-badge"});sb.appendChild(icon("share",12));sb.appendChild(document.createTextNode(`משותף (${members.length})`));info.appendChild(sb)}
  const meta=el("div",{style:{display:"flex",gap:"12px",alignItems:"center",marginTop:"4px"}});
  meta.appendChild(el("span",{className:"wh-count",style:{fontSize:"13px",color:"var(--text-sec)"}},`${items.length} פריטים`));
  meta.appendChild(el("span",{className:"wh-total",style:{fontSize:"13px",color:"var(--text-muted)"}},`סה״כ: ${total}`));
  info.appendChild(meta);
  const actions=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});

  if(whReorderMode){
    const handle=el("div",{className:"drag-handle",style:{padding:"4px 6px",display:"flex",alignItems:"center"}});
    handle.appendChild(icon("grip",22));
    actions.appendChild(handle);

    // HTML5 drag
    cardWrapper.setAttribute("draggable","true");
    cardWrapper.addEventListener("dragstart",e=>{
      whDragSrcId=whId;cardWrapper.style.opacity="0.5";
      e.dataTransfer.effectAllowed="move";
    });
    cardWrapper.addEventListener("dragend",()=>{
      cardWrapper.style.opacity="";
      document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
    });
    cardWrapper.addEventListener("dragover",e=>{
      e.preventDefault();e.dataTransfer.dropEffect="move";
      if(whDragSrcId&&whDragSrcId!==whId){
        document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
        cardWrapper.classList.add("drag-over");
      }
    });
    cardWrapper.addEventListener("dragleave",()=>cardWrapper.classList.remove("drag-over"));
    cardWrapper.addEventListener("drop",async e=>{
      e.preventDefault();cardWrapper.classList.remove("drag-over");
      if(!whDragSrcId||whDragSrcId===whId)return;
      const container=cardWrapper.parentElement;
      const cards=[...container.querySelectorAll('[data-wh-id]')];
      const fromIdx=cards.findIndex(c=>c.dataset.whId===whDragSrcId);
      const toIdx=cards.findIndex(c=>c.dataset.whId===whId);
      if(fromIdx===-1||toIdx===-1)return;
      const newOrder=[...lastHomeWhIds];
      const[moved]=newOrder.splice(fromIdx,1);newOrder.splice(toIdx,0,moved);
      whDragSrcId=null;
      const upd={};newOrder.forEach((id,i)=>{upd[id]=i+1});
      await dbUpdate(`users/${currentUser.username}/warehouses`,upd);
    });

    // Touch drag — same transform-only mechanism as the items list: geometry
    // is measured ONCE at touchstart, the dragged card follows the finger with
    // a transform, displaced cards slide by a fixed precomputed distance, the
    // drop slot is derived purely from the frozen geometry, and the real
    // re-order happens exactly once at drop. No DOM mutations and no
    // measurements mid-drag (Android drops the touch stream on DOM churn; live
    // measurement of animating cards made the drop slot oscillate on iOS).
    handle.addEventListener("touchstart",e=>{
      e.preventDefault();
      if(whTouchDrag)return; // a second finger must not hijack an active drag
      const container=cardWrapper.parentElement;
      // Clean slate in case a previous drag was interrupted mid-animation.
      [...container.children].forEach(elm=>{elm.style.transition="";elm.style.transform="";elm.style.zIndex="";elm.style.position="";elm.style.boxShadow=""});
      const touch=e.touches[0];
      const cardEls=[...container.children];
      const rects=cardEls.map(elm=>elm.getBoundingClientRect());
      const dragIndex=cardEls.indexOf(cardWrapper);
      const rect=rects[dragIndex];
      const gap=rects.length>1?rects[1].top-rects[0].bottom:10;
      whTouchDrag={whId,container,grabOffsetY:touch.clientY-rect.top,cardHeight:rect.height,
        lastClientY:touch.clientY,cardEls,dragIndex,curIndex:dragIndex,rafId:null,
        startTop:rect.top,mids:rects.map(r=>r.top+r.height/2),shift:rect.height+gap,
        docEnd:null,docCancel:null};
      cardWrapper.style.transition="none";
      cardWrapper.style.zIndex="500";
      cardWrapper.style.position="relative";
      cardWrapper.style.boxShadow="0 8px 24px rgba(0,0,0,.4)";
      whTouchDrag.docEnd=ev=>{if(ev.touches.length===0)finishWhTouchDrag(true)};
      whTouchDrag.docCancel=ev=>{if(ev.touches.length===0)finishWhTouchDrag(false)};
      document.addEventListener("touchend",whTouchDrag.docEnd);
      document.addEventListener("touchcancel",whTouchDrag.docCancel);
    },{passive:false});
    const updateWhDragFrame=()=>{
      const top=whTouchDrag.lastClientY-whTouchDrag.grabOffsetY;
      cardWrapper.style.transform=`translateY(${top-whTouchDrag.startTop}px)`;
      const center=top+whTouchDrag.cardHeight/2;
      let newIndex=0;
      for(let i=0;i<whTouchDrag.mids.length;i++){
        if(i===whTouchDrag.dragIndex)continue;
        if(center>whTouchDrag.mids[i])newIndex++;
      }
      if(newIndex!==whTouchDrag.curIndex){
        whTouchDrag.curIndex=newIndex;
        whTouchDrag.cardEls.forEach((elm,i)=>{
          if(i===whTouchDrag.dragIndex)return;
          let dy=0;
          if(i>whTouchDrag.dragIndex&&i<=whTouchDrag.curIndex)dy=-whTouchDrag.shift;
          else if(i<whTouchDrag.dragIndex&&i>=whTouchDrag.curIndex)dy=whTouchDrag.shift;
          const t=dy?`translateY(${dy}px)`:"";
          if(elm.style.transform!==t){
            elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
            elm.style.transform=t;
          }
        });
      }
    };
    handle.addEventListener("touchmove",e=>{
      if(!whTouchDrag)return;e.preventDefault();
      whTouchDrag.lastClientY=e.touches[0].clientY;
      if(whTouchDrag.rafId)return;
      whTouchDrag.rafId=requestAnimationFrame(()=>{
        if(!whTouchDrag)return;
        whTouchDrag.rafId=null;
        updateWhDragFrame();
      });
    },{passive:false});
    const finishWhTouchDrag=async(commit)=>{
      if(!whTouchDrag)return;
      if(whTouchDrag.rafId)cancelAnimationFrame(whTouchDrag.rafId);
      document.removeEventListener("touchend",whTouchDrag.docEnd);
      document.removeEventListener("touchcancel",whTouchDrag.docCancel);
      const{cardEls,dragIndex,curIndex,container}=whTouchDrag;
      whTouchDrag=null;
      [...container.children].forEach(elm=>{elm.style.transition="";elm.style.transform="";elm.style.zIndex="";elm.style.position="";elm.style.boxShadow=""});
      if(commit&&dragIndex!==curIndex){
        // Wrapper ids are wh-<id> from renderWarehouseList, present even before
        // a card's data arrives, so derive the new order from them.
        const newOrder=cardEls.map(elm=>elm.id.slice(3));
        const[moved]=newOrder.splice(dragIndex,1);
        newOrder.splice(curIndex,0,moved);
        // Re-render synchronously in the new order BEFORE the async DB write —
        // the DOM was deliberately left untouched during the drag, so this is
        // what prevents a visible snap-back while the write is in flight.
        lastHomeWhIds=newOrder;
        currentWhIds=[];
        if(cachedHomeContent&&homeScreen)renderWarehouseList(cachedHomeContent,lastHomeWhIds,homeScreen);
        pendingWhRender=false;
        const upd={};newOrder.forEach((id,i)=>{upd[id]=i+1});
        await dbUpdate(`users/${currentUser.username}/warehouses`,upd);
      }else if(pendingWhRender){
        // A data update arrived mid-drag and was deferred — apply it now.
        pendingWhRender=false;
        currentWhIds=[];
        if(cachedHomeContent&&homeScreen)renderWarehouseList(cachedHomeContent,lastHomeWhIds,homeScreen);
      }
    };
    handle.addEventListener("touchend",()=>finishWhTouchDrag(true));
    handle.addEventListener("touchcancel",()=>finishWhTouchDrag(false));
  }else{
    const moreBtn=el("button",{className:"icon-btn",onClick:async e=>{
      e.stopPropagation();
      const isOwner=wh.owner===currentUser.username;
      // Role computed from the card's own data — currentWhData belongs to the
      // detail screen and isn't reliable here on the home screen.
      const isAdminHere=isOwner||(wh.roles&&wh.roles[currentUser.username]==='admin');
      const canShare=isAdminHere||!(wh.permissions&&wh.permissions.restrict_share);
      const menuOpts=[{label:"יצוא רשימה",value:"export"}];
      if(canShare){
        menuOpts.push({label:"שיתוף וניהול חברים",value:"share"});
        menuOpts.push({label:"שלח עותק למשתמש",value:"copy"});
      }
      menuOpts.push({label:"שכפל מחסן",value:"duplicate"});
      menuOpts.push({label:whCategories[whId]?`קטגוריה: ${whCategories[whId]}`:"קטגוריה",value:"category"});
      menuOpts.push({label:isOwner?"מחק מחסן":"עזוב מחסן",style:"danger",value:"delete"});
      const choice=await showActionSheet(menuOpts);
      if(choice==="export"){
        const items=await dbGet(`warehouses/${whId}/items`);
        showExportModal(wrap,whId,Object.entries(items||{}));
      }
      else if(choice==="duplicate"){
        // Duplicate FOR MYSELF (unlike "send copy" which targets another user):
        // a fresh private warehouse with all items, thumbs, thresholds and the
        // display/sort settings — no members, no invite token, fresh history.
        const c2=await showActionSheet([{label:`שכפל את "${wh.name}" למחסן חדש`,value:"ok"}]);
        if(c2!=="ok")return;
        try{
          const newWhId=genId();
          const idMap={};
          const newItems={};
          if(wh.items){
            for(const[oldId,item]of Object.entries(wh.items)){
              const newId=genId();idMap[oldId]=newId;
              const ni={name:item.name,quantity:item.quantity||0,order:item.order||0,
                history:{[genId()]:{action:"שוכפל",amount:item.quantity||0,by:currentUser.displayName,date:new Date().toISOString()}}};
              if(item.note)ni.note=item.note;
              if(item.sku)ni.sku=item.sku;
              if(item.thumb)ni.thumb=item.thumb;
              if(item.lowStock)ni.lowStock=item.lowStock;
              if(item.image)ni.image=item.image;
              newItems[newId]=ni;
            }
          }
          const newWh={name:`${wh.name} (עותק)`,owner:currentUser.username,members:{[currentUser.username]:true},createdAt:new Date().toISOString()};
          if(wh.sortMode)newWh.sortMode=wh.sortMode;
          if(wh.features)newWh.features=JSON.parse(JSON.stringify(wh.features));
          if(Object.keys(newItems).length)newWh.items=newItems;
          await dbSet(`warehouses/${newWhId}`,newWh);
          // Full-size images live outside the warehouse node — copy them
          // directly (allowed: we're a member of the new warehouse by now).
          try{
            const imgs=await dbGet(`itemImages/${whId}`);
            if(imgs){
              const newImgs={};
              for(const[oldId,img]of Object.entries(imgs)){if(idMap[oldId])newImgs[idMap[oldId]]=img}
              if(Object.keys(newImgs).length)await dbSet(`itemImages/${newWhId}`,newImgs);
            }
          }catch(e){}
          await dbSet(`users/${currentUser.username}/warehouses/${newWhId}`,Date.now());
          showNotice(`נוצר עותק: "${newWh.name}"`);
        }catch(e){showNotice("שגיאה בשכפול — נסה שוב")}
      }
      else if(choice==="category"){
        const cats=[...new Set(lastHomeWhIds.map(id=>whCategories[id]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
        const cur=whCategories[whId]||null;
        const opts=cats.map(cat=>({label:(cat===cur?"✓ ":"")+cat,value:"set:"+cat}));
        opts.push({label:"קטגוריה חדשה...",value:"new"});
        if(cur)opts.push({label:"הסר מהקטגוריה",style:"danger",value:"clear"});
        const c2=await showActionSheet(opts,`קטגוריה עבור "${wh.name}" (אישי — רק אצלך)`);
        if(!c2)return;
        if(c2==="new"){
          showCategoryNameModal(whId,null);
        }else if(c2==="clear"){
          await dbRemove(`users/${currentUser.username}/whCategories/${whId}`);
        }else if(c2.indexOf("set:")===0){
          await dbSet(`users/${currentUser.username}/whCategories/${whId}`,c2.slice(4));
        }
      }
      else if(choice==="share")showShareModal(wrap,whId,wh);
      else if(choice==="copy")showCopyWarehouseModal(wrap,whId,wh);
      else if(choice==="delete"){
        // Membership must be checked BEFORE removing ourselves — the security
        // rules only let members read a warehouse, so after self-removal every
        // follow-up read/write here would be denied.
        let mems=null;try{mems=await dbGet(`warehouses/${whId}/members`)}catch(e){}
        const memberList=mems?Object.keys(mems):[currentUser.username];
        const others=memberList.filter(u=>u!==currentUser.username);
        if(isOwner&&others.length>0){
          // An owner "deleting" a shared warehouse used to silently just LEAVE,
          // stranding an ownerless warehouse for everyone else. Now it really
          // deletes — for all members — after an explicit warning.
          showDeleteModal(wrap,`"${wh.name}" משותף עם עוד ${others.length} חברים. המחיקה תסיר אותו לכולם. (רוצה רק לצאת? העבר קודם בעלות דרך "שיתוף וניהול חברים")`,async()=>{
            // Snapshot everything BEFORE deleting so undo can rebuild it.
            const snapshot=JSON.parse(JSON.stringify(wh));
            let imgs=null;try{imgs=await dbGet(`itemImages/${whId}`)}catch(e){}
            // Order matters under the rules: images and member links are only
            // writable while the warehouse (and our membership) still exist,
            // so the warehouse node itself goes LAST.
            await dbRemove(`itemImages/${whId}`).catch(()=>{});
            for(const u of others)await dbRemove(`users/${u}/warehouses/${whId}`).catch(()=>{});
            await dbRemove(`warehouses/${whId}`);
            await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
            showUndoToast(`המחסן "${wh.name}" נמחק`,async()=>{
              // Warehouse first — restoring it restores our membership, which
              // is what authorizes the link and image writes that follow.
              await dbSet(`warehouses/${whId}`,snapshot);
              await dbSet(`users/${currentUser.username}/warehouses/${whId}`,Date.now());
              for(const u of others)await dbSet(`users/${u}/warehouses/${whId}`,Date.now()).catch(()=>{});
              if(imgs)await dbSet(`itemImages/${whId}`,imgs);
            });
          });
        }else{
          showDeleteModal(wrap,isOwner?`למחוק את "${wh.name}"?`:`לעזוב את "${wh.name}"?`,async()=>{
            if(others.length===0){
              const snapshot=JSON.parse(JSON.stringify(wh));
              let imgs=null;try{imgs=await dbGet(`itemImages/${whId}`)}catch(e){}
              // Sole member: full cleanup. Images BEFORE the warehouse node —
              // once the node is gone the rules no longer see our membership.
              await dbRemove(`itemImages/${whId}`).catch(()=>{});
              await dbRemove(`warehouses/${whId}`);
              await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
              showUndoToast(`המחסן "${wh.name}" נמחק`,async()=>{
                await dbSet(`warehouses/${whId}`,snapshot);
                await dbSet(`users/${currentUser.username}/warehouses/${whId}`,Date.now());
                if(imgs)await dbSet(`itemImages/${whId}`,imgs);
              });
            }else{
              // Leaving a shared warehouse is not undoable — once out, the
              // rules don't let a non-member re-add themselves.
              await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
              await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
            }
          });
        }
      }
    }});
    moreBtn.appendChild(icon("more",18));
    const arrow=icon("forward",18);arrow.style.color="var(--text-muted)";
    actions.append(moreBtn,arrow);
  }

  card.append(info,actions);
  cardWrapper.dataset.whId=whId;
  cardWrapper.appendChild(card);
}
