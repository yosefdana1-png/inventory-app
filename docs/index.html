  <style>
    :root {
      --bg: #0c0f14; --surface: #161b24; --card: #1a2030; --card-hover: #212a3a;
      --accent: #4f8cff; --accent-glow: rgba(79,140,255,0.15);
      --danger: #ff5c5c; --danger-bg: rgba(255,92,92,0.1);
      --success: #34d399; --success-bg: rgba(52,211,153,0.1);
      --warning: #fbbf24; --warning-bg: rgba(251,191,36,0.1);
      --text: #e8ecf4; --text-sec: #8b95a8; --text-muted: #5a6478; --border: #252d3d;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .app-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;direction:rtl;transition:border-color .2s}
    .app-input:focus{border-color:var(--accent)}.app-input::placeholder{color:var(--text-muted)}
    textarea.app-input{resize:vertical;min-height:60px}
    .btn{border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--accent);color:#fff}.btn-danger{background:var(--danger);color:#fff}
    .btn-success{background:var(--success);color:#000}.btn-ghost{background:transparent;color:var(--text-sec);border:1px solid var(--border)}
    .btn-warning{background:var(--warning);color:#000}
    .btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn .15s ease}
    .modal{background:var(--surface);border-radius:20px;padding:28px;width:100%;max-width:400px;border:1px solid var(--border);animation:scaleIn .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
    .modal h3{font-size:18px;font-weight:600;margin-bottom:4px}
    .header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:max(16px,env(safe-area-inset-top)) 20px 16px;display:flex;align-items:center;justify-content:space-between}
    .list-card{background:var(--card);border-radius:16px;padding:18px 20px;border:1px solid var(--border);cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:space-between}
    .list-card:active,.list-card:hover{background:var(--card-hover)}
    .item-card{background:var(--card);border-radius:16px;padding:14px 12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;transition:all .2s;gap:4px;overflow:hidden}
    .item-card.dragging{opacity:.5;border-color:var(--accent)}
    .item-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
    /* Only the card being dragged gets its transition killed, so it tracks the
       finger with zero lag. The OTHER cards must keep their transition — that's
       what animates them sliding out of the way. (An earlier version killed
       transitions on every card in the list, which silently disabled the whole
       make-room animation.) */
    .item-card.drag-active{transition:none!important}
    [data-wh-id].drag-over .list-card{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
    .icon-btn{background:none;border:none;color:var(--text-sec);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center}
    .qty-btn{width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .qty-btn-add{background:var(--success-bg);border:1px solid rgba(52,211,153,.2);color:var(--success)}
    .qty-btn-sub{background:var(--danger-bg);border:1px solid rgba(255,92,92,.2);color:var(--danger)}
    .fab{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:18px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(79,140,255,.4);z-index:90}
    .toggle-group{display:flex;gap:8px;margin-bottom:20px}
    .toggle-pill{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-sec);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .2s}
    .toggle-pill.active-add{border-color:var(--success);background:var(--success-bg);color:var(--success)}
    .toggle-pill.active-sub{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .history-row{padding:10px 0;display:flex;justify-content:space-between;align-items:center}
    .history-row+.history-row{border-top:1px solid var(--border)}
    .spinning{animation:spin .6s linear}.shaking{animation:shake .5s ease}.screen{background:var(--bg);min-height:100vh;min-height:100dvh;height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}

    .tab-btn{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--text-sec);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .2s}
    .tab-btn.active{background:var(--accent);color:#fff}
    .user-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;background:var(--accent-glow);border:1px solid rgba(79,140,255,.2);border-radius:20px;font-size:13px;color:var(--accent)}

    .members-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .member-chip{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-sec)}
    .search-bar{position:relative}
    .search-bar>svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
    .toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .toolbar-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-sec);cursor:pointer;font-family:inherit;font-size:12px;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
    @keyframes sheetUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
    .action-sheet-overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px max(env(safe-area-inset-bottom),12px);animation:fadeIn .22s ease}
    .action-sheet-group,.action-sheet-cancel-group{border-radius:22px;overflow:hidden;margin-bottom:8px;animation:sheetUp .42s cubic-bezier(0.32,0.72,0,1);position:relative;background:rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(80px) saturate(180%) brightness(1.12);backdrop-filter:blur(80px) saturate(180%) brightness(1.12);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.30),inset 0 2px 1px rgba(255,255,255,0.50),inset 0 -1px 1px rgba(0,0,0,0.10),0 20px 60px rgba(0,0,0,0.50)}
    .action-sheet-group::before,.action-sheet-cancel-group::before{content:'';position:absolute;inset:0;background:linear-gradient(175deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.06) 25%,transparent 55%,rgba(255,255,255,0.04) 100%);pointer-events:none;border-radius:inherit;z-index:0}
    .action-sheet-item{width:100%;padding:17px 20px;text-align:center;font-size:17px;font-family:inherit;border:none;cursor:pointer;display:block;background:transparent;color:#0a84ff;position:relative;z-index:1;transition:background .12s;-webkit-tap-highlight-color:transparent}
    .action-sheet-item:not(:last-child){border-bottom:0.5px solid rgba(255,255,255,0.14)}
    .action-sheet-item:active{background:rgba(255,255,255,0.16)}
    .action-sheet-item.danger{color:#ff453a}
    .action-sheet-cancel{width:100%;padding:17px 20px;text-align:center;font-size:17px;font-weight:600;font-family:inherit;border:none;cursor:pointer;display:block;background:transparent;color:#fff;position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
    .action-sheet-cancel:active{background:rgba(255,255,255,0.16)}
    .scroll-top-btn{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:20px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(80px) saturate(180%) brightness(1.12);backdrop-filter:blur(80px) saturate(180%) brightness(1.12);border:none;color:#0a84ff;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:80;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.30),inset 0 2px 1px rgba(255,255,255,0.50),0 8px 24px rgba(0,0,0,0.50);opacity:0;transform:translateY(8px);transition:opacity .25s ease, transform .25s ease}
    .scroll-top-btn.visible{display:flex;opacity:1;transform:translateY(0)}
    .toolbar-btn:hover,.toolbar-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
    .toolbar-btn.danger-hover:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
    .note-text{font-size:12px;color:var(--text-muted);margin-top:2px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .drag-handle{cursor:grab;touch-action:none;color:var(--text-muted);padding:4px}
    .drag-handle:active{cursor:grabbing}
    .item-img-slot{width:56px;height:56px;flex-shrink:0;margin-right:10px;border-radius:10px}
    .item-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--border);display:block}
  </style>

</head>

const $=s=>document.querySelector(s);
const el=(tag,attrs={},...ch)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")e.className=v;else if(k==="innerHTML")e.innerHTML=v;else e.setAttribute(k,v)}for(const c of ch){if(typeof c==="string")e.appendChild(document.createTextNode(c));else if(c)e.appendChild(c)}return e};
const icon=(name,size=20)=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("width",size);s.setAttribute("height",size);s.innerHTML=`<use href="#icon-${name}"/>`;return s};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let FB=null,currentUser=null,unsubscribers=[];

function dbRef(p){return FB.ref(FB.db,p)}
async function dbGet(p){const s=await FB.get(dbRef(p));return s.exists()?s.val():null}
async function dbSet(p,v){await FB.set(dbRef(p),v)}
async function dbRemove(p){await FB.remove(dbRef(p))}
async function dbUpdate(p,v){await FB.update(dbRef(p),v)}
function dbListen(p,cb){const u=FB.onValue(dbRef(p),s=>cb(s.exists()?s.val():null));unsubscribers.push(u);return u}

// Local cache for instant loading. Stored in localStorage so it survives
// app restarts (sessionStorage is wiped every launch on iOS standalone).
// On quota overflow, retry with item images stripped so text data still caches.
function cacheSet(key,data){
  const k='inv_'+key;
  try{localStorage.setItem(k,JSON.stringify(data))}
  catch(e){
    try{
      if(data&&data.items){
        const slim={...data,items:{}};
        for(const[id,it]of Object.entries(data.items)){const{image,...rest}=it;slim.items[id]=rest}
        localStorage.setItem(k,JSON.stringify(slim));
      }else localStorage.removeItem(k);
    }catch(e2){try{localStorage.removeItem(k)}catch(e3){}}
  }
}
function cacheGet(key){try{const d=localStorage.getItem('inv_'+key);return d?JSON.parse(d):null}catch(e){return null}}
function cacheClearAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('inv_')&&k!=='inv_user').forEach(k=>localStorage.removeItem(k))}catch(e){}}

function dbListenCached(p,cb){
  const cached=cacheGet(p);
  let cacheShown=false;
  if(cached!==null){cb(cached);cacheShown=true}
  const u=FB.onValue(dbRef(p),s=>{
    const val=s.exists()?s.val():null;
    const valStr=JSON.stringify(val);
    const oldStr=cacheShown?JSON.stringify(cacheGet(p)):null;
    cacheSet(p,val);
    // Skip if data is same as what we already showed from cache
    if(cacheShown&&valStr===oldStr){cacheShown=false;return}
    cacheShown=false;
    cb(val);
  });
  unsubscribers.push(u);return u;
}
function render(s){const a=$("#app");a.innerHTML="";a.appendChild(s)}
function cleanup(){unsubscribers.forEach(f=>f());unsubscribers=[]}

// ═══════════ iOS-STYLE NAVIGATION STACK ═══════════
// Both screens live in DOM. We slide the detail screen on/off.
let homeScreen=null;
let detailScreen=null;
let isShowingDetail=false;

function navInit(){
  const app=$("#app");
  app.style.position="relative";
  app.style.width="100%";
}

function navShowHome(animated){
  const app=$("#app");
  if(!homeScreen)return;
  
  if(!isShowingDetail||!animated){
    app.innerHTML="";
    homeScreen.style.transform="";homeScreen.style.transition="";
    app.appendChild(homeScreen);
    isShowingDetail=false;
    return;
  }
  
  // Animate back: detail slides right, home slides in from left
  if(!app.contains(homeScreen)){
    homeScreen.style.transform="translateX(-25%)";
    homeScreen.style.opacity="0.6";
    homeScreen.style.position="absolute";homeScreen.style.top="0";homeScreen.style.left="0";homeScreen.style.right="0";
    app.insertBefore(homeScreen,detailScreen);
  }
  
  if(detailScreen){
    detailScreen.style.position="relative";
    detailScreen.style.zIndex="2";
    detailScreen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1)";
    detailScreen.style.transform="translateX(100%)";
  }
  homeScreen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1), opacity 0.35s cubic-bezier(0.32,0.72,0,1)";
  homeScreen.style.transform="translateX(0)";
  homeScreen.style.opacity="1";
  
  setTimeout(()=>{
    app.innerHTML="";
    homeScreen.style.position="";homeScreen.style.transform="";homeScreen.style.transition="";homeScreen.style.opacity="";
    app.appendChild(homeScreen);
    if(detailScreen){detailScreen.style.transform="";detailScreen.style.transition="";detailScreen.style.position="";detailScreen.style.zIndex="";}
    isShowingDetail=false;
  },360);
}

function navShowDetail(screen){
  const app=$("#app");
  detailScreen=screen;
  isShowingDetail=true;
  
  if(homeScreen&&app.contains(homeScreen)){
    // Set up home to be behind
    homeScreen.style.position="absolute";homeScreen.style.top="0";homeScreen.style.left="0";homeScreen.style.right="0";
    homeScreen.style.zIndex="1";
    
    // Slide detail in from right
    screen.style.position="relative";
    screen.style.zIndex="2";
    screen.style.transform="translateX(100%)";
    app.appendChild(screen);
    
    requestAnimationFrame(()=>{
      screen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1)";
      screen.style.transform="translateX(0)";
      homeScreen.style.transition="transform 0.35s cubic-bezier(0.32,0.72,0,1), opacity 0.35s cubic-bezier(0.32,0.72,0,1)";
      homeScreen.style.transform="translateX(-25%)";
      homeScreen.style.opacity="0.6";
    });
    
    setTimeout(()=>{
      app.innerHTML="";
      screen.style.position="";screen.style.zIndex="";screen.style.transform="";screen.style.transition="";
      app.appendChild(screen);
      homeScreen.style.position="";homeScreen.style.zIndex="";homeScreen.style.transform="";homeScreen.style.transition="";homeScreen.style.opacity="";
    },360);
  }else{
    app.innerHTML="";
    app.appendChild(screen);
  }
}

let cachedHomeContent=null;
let homeUnsubs=[];

// Personal warehouse order is stored as a number per id in users/<uid>/warehouses.
// Legacy entries stored as `true` sort first (treated as 0).
function sortedWhIds(data){
  const entries=data?Object.entries(data):[];
  entries.sort((a,b)=>(typeof a[1]==='number'?a[1]:0)-(typeof b[1]==='number'?b[1]:0));
  return entries.map(([id])=>id);
}

function attachHomeWarehouseListener(content,screen){
  homeUnsubs.forEach(f=>f());homeUnsubs=[];
  if(!FB){
    const cached=cacheGet(`users/${currentUser.username}/warehouses`);
    if(cached){lastHomeWhIds=sortedWhIds(cached);renderWarehouseList(content,lastHomeWhIds,screen)}
    return;
  }
  const u=dbListenCached(`users/${currentUser.username}/warehouses`,data=>{
    lastHomeWhIds=sortedWhIds(data);
    renderWarehouseList(content,lastHomeWhIds,screen);
  });
  homeUnsubs.push(u);unsubscribers.push(u);
  return u;
}

let currentWhIds=[];
let whCardListeners=[];

function renderWarehouseList(c,whIds,wrap){
  const same=currentWhIds.length===whIds.length&&currentWhIds.every((id,i)=>id===whIds[i]);
  const cardsExist=c.querySelector('#warehouseCards');

  if(same&&cardsExist&&whCardListeners.length>0)return;

  if(same&&cardsExist&&whCardListeners.length===0&&FB){
    whIds.forEach(whId=>{
      const cw=document.getElementById(`wh-${whId}`);
      if(!cw)return;
      const unsub=FB.onValue(dbRef(`warehouses/${whId}`),snap=>{
        const wh=snap.exists()?snap.val():null;
        cacheSet(`warehouses/${whId}`,wh);
        if(!wh){cw.innerHTML="";return}
        buildWarehouseCard(cw,whId,wh,wrap);
      });
      whCardListeners.push(unsub);
    });
    return;
  }

  whCardListeners.forEach(f=>f());
  whCardListeners=[];
  currentWhIds=[...whIds];

  c.innerHTML="";
  if(whIds.length===0){
    const empty=el("div",{className:"empty-state"});empty.appendChild(icon("box",40));
    empty.appendChild(el("p",{style:{marginTop:"16px",fontSize:"16px"}},"אין מחסנים עדיין"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"4px"}},"לחץ על + כדי ליצור מחסן"));
    c.appendChild(empty);return;
  }

  const cardsContainer=el("div",{id:"warehouseCards"});
  c.appendChild(cardsContainer);

  whIds.forEach((whId)=>{
    const cardWrapper=el("div",{id:`wh-${whId}`,style:{marginBottom:"10px"}});
    cardsContainer.appendChild(cardWrapper);

    const cachedWh=cacheGet(`warehouses/${whId}`);
    if(cachedWh)buildWarehouseCard(cardWrapper,whId,cachedWh,wrap);

    if(FB){
      const unsub=FB.onValue(dbRef(`warehouses/${whId}`),snap=>{
        const wh=snap.exists()?snap.val():null;
        cacheSet(`warehouses/${whId}`,wh);
        if(!wh){cardWrapper.innerHTML="";return}
        buildWarehouseCard(cardWrapper,whId,wh,wrap);
      });
      whCardListeners.push(unsub);
    }
  });
}

function buildWarehouseCard(cardWrapper,whId,wh,wrap){
  const existing=cardWrapper.querySelector('.list-card');
  if(existing){
    if(!whReorderMode){
      const countEl=existing.querySelector('.wh-count');
      const totalEl=existing.querySelector('.wh-total');
      const items=wh.items?Object.values(wh.items):[];
      const total=items.reduce((s,it)=>s+(it.quantity||0),0);
      if(countEl)countEl.textContent=`${items.length} פריטים`;
      if(totalEl)totalEl.textContent=`סה״כ: ${total}`;
    }
    return;
  }

  const card=el("div",{className:"list-card"});
  if(!whReorderMode)card.onclick=()=>renderListDetail(whId);

  const items=wh.items?Object.values(wh.items):[];
  const total=items.reduce((s,it)=>s+(it.quantity||0),0);
  const members=wh.members?Object.keys(wh.members):[];
  const isShared=members.length>1;
  const info=el("div",{style:{flex:"1"}});
  info.appendChild(el("h3",{style:{fontSize:"17px",fontWeight:"600",marginBottom:"2px"}},wh.name));
  if(isShared){const sb=el("div",{className:"shared-badge"});sb.appendChild(icon("share",12));sb.appendChild(document.createTextNode(`משותף (${members.length})`));info.appendChild(sb)}
  const meta=el("div",{style:{display:"flex",gap:"12px",alignItems:"center",marginTop:"4px"}});
  meta.appendChild(el("span",{className:"wh-count",style:{fontSize:"13px",color:"var(--text-sec)"}},`${items.length} פריטים`));
  meta.appendChild(el("span",{className:"wh-total",style:{fontSize:"13px",color:"var(--text-muted)"}},`סה״כ: ${total}`));
  info.appendChild(meta);
  const actions=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});

  if(whReorderMode){
    const handle=el("div",{className:"drag-handle",style:{padding:"4px 6px",display:"flex",alignItems:"center"}});
    handle.appendChild(icon("grip",22));
    actions.appendChild(handle);

    // HTML5 drag
    cardWrapper.setAttribute("draggable","true");
    cardWrapper.addEventListener("dragstart",e=>{
      whDragSrcId=whId;cardWrapper.style.opacity="0.5";
      e.dataTransfer.effectAllowed="move";
    });
    cardWrapper.addEventListener("dragend",()=>{
      cardWrapper.style.opacity="";
      document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
    });
    cardWrapper.addEventListener("dragover",e=>{
      e.preventDefault();e.dataTransfer.dropEffect="move";
      if(whDragSrcId&&whDragSrcId!==whId){
        document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
        cardWrapper.classList.add("drag-over");
      }
    });
    cardWrapper.addEventListener("dragleave",()=>cardWrapper.classList.remove("drag-over"));
    cardWrapper.addEventListener("drop",async e=>{
      e.preventDefault();cardWrapper.classList.remove("drag-over");
      if(!whDragSrcId||whDragSrcId===whId)return;
      const container=cardWrapper.parentElement;
      const cards=[...container.querySelectorAll('[data-wh-id]')];
      const fromIdx=cards.findIndex(c=>c.dataset.whId===whDragSrcId);
      const toIdx=cards.findIndex(c=>c.dataset.whId===whId);
      if(fromIdx===-1||toIdx===-1)return;
      const newOrder=[...lastHomeWhIds];
      const[moved]=newOrder.splice(fromIdx,1);newOrder.splice(toIdx,0,moved);
      whDragSrcId=null;
      const upd={};newOrder.forEach((id,i)=>{upd[id]=i+1});
      await dbUpdate(`users/${currentUser.username}/warehouses`,upd);
    });

    // Touch drag
    handle.addEventListener("touchstart",e=>{
      e.preventDefault();
      const touch=e.touches[0];const rect=cardWrapper.getBoundingClientRect();
      whTouchDrag={whId,startY:touch.clientY,rectTop:rect.top,rectLeft:rect.left,rectWidth:rect.width,clone:null,targetId:null};
      whTouchDrag.timer=setTimeout(()=>{
        const clone=cardWrapper.cloneNode(true);
        clone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;z-index:9999;opacity:.85;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);border-radius:16px;`;
        document.body.appendChild(clone);whTouchDrag.clone=clone;cardWrapper.style.opacity="0.3";
      },80);
    },{passive:false});
    handle.addEventListener("touchmove",e=>{
      if(!whTouchDrag)return;e.preventDefault();
      const touch=e.touches[0];const dy=touch.clientY-whTouchDrag.startY;
      if(whTouchDrag.clone)whTouchDrag.clone.style.top=(whTouchDrag.rectTop+dy)+"px";
      const under=document.elementFromPoint(touch.clientX,touch.clientY);
      const targetCard=under?.closest("[data-wh-id]");const tid=targetCard?.dataset.whId;
      document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
      if(tid&&tid!==whTouchDrag.whId){targetCard.classList.add("drag-over");whTouchDrag.targetId=tid;}
      else whTouchDrag.targetId=null;
    },{passive:false});
    // touchcancel too — Android can cancel a touch sequence without firing
    // touchend, which would otherwise leave the floating clone stuck on screen
    // forever (it's appended to document.body, outside the normal re-render).
    const finishWhTouchDrag=async(commit)=>{
      if(!whTouchDrag)return;
      clearTimeout(whTouchDrag.timer);if(whTouchDrag.clone)whTouchDrag.clone.remove();
      cardWrapper.style.opacity="";
      document.querySelectorAll('[data-wh-id]').forEach(c=>c.classList.remove("drag-over"));
      const tid=whTouchDrag.targetId;const srcId=whTouchDrag.whId;whTouchDrag=null;
      if(commit&&tid&&srcId!==tid){
        const newOrder=[...lastHomeWhIds];
        const fromIdx=newOrder.indexOf(srcId);const toIdx=newOrder.indexOf(tid);
        if(fromIdx!==-1&&toIdx!==-1){newOrder.splice(fromIdx,1);newOrder.splice(toIdx,0,srcId);}
        const upd={};newOrder.forEach((id,i)=>{upd[id]=i+1});
        await dbUpdate(`users/${currentUser.username}/warehouses`,upd);
      }
    };
    handle.addEventListener("touchend",()=>finishWhTouchDrag(true));
    handle.addEventListener("touchcancel",()=>finishWhTouchDrag(false));
  }else{
    const moreBtn=el("button",{className:"icon-btn",onClick:async e=>{
      e.stopPropagation();
      const isOwner=wh.owner===currentUser.username;
      const choice=await showActionSheet([
        {label:"יצוא רשימה",value:"export"},
        {label:"שיתוף וניהול חברים",value:"share"},
        {label:"שלח עותק למשתמש",value:"copy"},
        {label:isOwner?"מחק מחסן":"עזוב מחסן",style:"danger",value:"delete"},
      ]);
      if(choice==="export"){
        const items=await dbGet(`warehouses/${whId}/items`);
        showExportModal(wrap,whId,Object.entries(items||{}));
      }
      else if(choice==="share")showShareModal(wrap,whId,wh);
      else if(choice==="copy")showCopyWarehouseModal(wrap,whId,wh);
      else if(choice==="delete")showDeleteModal(wrap,isOwner?`למחוק את "${wh.name}"?`:`לעזוב את "${wh.name}"?`,async()=>{
        await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
        await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
        const r=await dbGet(`warehouses/${whId}/members`);
        if(!r||Object.keys(r).length===0)await dbRemove(`warehouses/${whId}`);
      });
    }});
    moreBtn.appendChild(icon("more",18));
    const arrow=icon("forward",18);arrow.style.color="var(--text-muted)";
    actions.append(moreBtn,arrow);
  }

  card.append(info,actions);
  cardWrapper.dataset.whId=whId;
  cardWrapper.appendChild(card);
}

let currentSort="alpha"; // alpha, manual
let searchQuery="";
let reorderMode=false;
let currentItems=[];
let currentWhId=null;
let dragSrcId=null;
let touchDrag=null;
let desktopDrag=null;

let whTouchDrag=null;

function memberCan(action){
  if(userWarehouseRole==='owner'||userWarehouseRole==='admin')return true;
  const perms=(currentWhData&&currentWhData.permissions)||{};
  return !perms['restrict_'+action];
}

function renderListDetail(whId){
  cleanup();currentSort="manual";searchQuery="";reorderMode=false;userWarehouseRole='member';currentWhData=null;

  });

// FLIP-style reorder helpers for the manual drag-to-reorder feature: as the
// dragged card crosses other cards, we move its element to its new slot in the
// real DOM order and animate every displaced card sliding into place — so
// items visibly make room for the one being dragged, instead of just
// highlighting whichever card sits under the pointer.
function indexForY(cardEls,y){
  for(let i=0;i<cardEls.length;i++){
    const r=cardEls[i].getBoundingClientRect();
    if(y<r.top+r.height/2)return i;
  }
  return cardEls.length-1;
}
// Wipes every drag-related inline style off every card in the list. Called at the
// start and end of every drag so a card can never be left displaced/invisible by
// a half-finished animation — which is what produced the stuck cards and the
// card-sized gaps in the list on Android.
function clearDragStyles(container){
  [...container.children].forEach(elm=>{
    elm.style.transition="";elm.style.transform="";elm.style.opacity="";
    elm.style.zIndex="";elm.style.boxShadow="";
  });
}
function flipReorder(container,cardEls,fromIndex,toIndex,skipEl){
  if(fromIndex===toIndex||fromIndex<0||toIndex<0)return cardEls;
  const firstRects=new Map();
  // Freeze any in-flight transition BEFORE measuring: getBoundingClientRect on a
  // mid-animation element returns its animated position, not its layout position,
  // so measuring without this makes each successive reorder compute its offset
  // against a wrong baseline — the errors compound into the visible gaps.
  cardEls.forEach(elm=>{if(elm!==skipEl){elm.style.transition="none";elm.style.transform=""}});
  void container.offsetHeight;
  cardEls.forEach(elm=>firstRects.set(elm,elm.getBoundingClientRect()));
  const newArr=[...cardEls];
  const[moved]=newArr.splice(fromIndex,1);
  newArr.splice(toIndex,0,moved);
  newArr.forEach(elm=>container.appendChild(elm));
  newArr.forEach(elm=>{
    if(elm===skipEl)return;
    const first=firstRects.get(elm);
    const last=elm.getBoundingClientRect();
    const dy=first.top-last.top;
    if(dy){
      elm.style.transition="none";
      elm.style.transform=`translateY(${dy}px)`;
      // Force a layout flush so the browser commits the "jump back to old spot"
      // state above before we flip the transition back on — a nested
      // requestAnimationFrame here (the previous approach) can interleave with a
      // *second* reorder landing before the first one's frame fires, leaving a
      // card's transform permanently stuck mid-animation (the frozen/duplicated
      // card seen on Android). Reading offsetHeight is synchronous, so there's no
      // window for another call to race it.
      void elm.offsetHeight;
      elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
      elm.style.transform="";
    }
  });
  return newArr;
}

function renderItemsList(c,whId,items,wrap){
  const listContainer=c.querySelector('#itemsList');
  if(!listContainer)return;

  let filtered=items;
  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    filtered=items.filter(([,item])=>item.name.toLowerCase().includes(q)||(item.note&&item.note.toLowerCase().includes(q))||(item.sku&&item.sku.toLowerCase().includes(q)));
  }
  if(currentSort==="alpha"){
    filtered=[...filtered].sort((a,b)=>a[1].name.localeCompare(b[1].name,"he"));
  }else if(currentSort==="qty-desc"){
    filtered=[...filtered].sort((a,b)=>(b[1].quantity||0)-(a[1].quantity||0));
  }else if(currentSort==="qty-asc"){
    filtered=[...filtered].sort((a,b)=>(a[1].quantity||0)-(b[1].quantity||0));
  }else{
    filtered=[...filtered].sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  }

  // Check if we can do an in-place update (same items, same order)
  const existingCards=listContainer.querySelectorAll('[data-item-id]');
  const existingIds=[...existingCards].map(c=>c.dataset.itemId);
  const newIds=filtered.map(([id])=>id);
  const sameStructure=existingIds.length===newIds.length&&existingIds.every((id,i)=>id===newIds[i]);
  // If the currently-rendered DOM is still showing reorder-mode chrome (drag
  // handles / the save bar) but reorderMode just turned off (or vice versa),
  // force a full rebuild even if the item ids match — otherwise the smart
  // in-place update below skips touching that chrome and the "שמור" button
  // (and drag handles) look like they did nothing.
  const listWasInReorderMode=!!listContainer.querySelector('.drag-handle');

  if(sameStructure&&existingIds.length>0&&!reorderMode&&!listWasInReorderMode){
    // Smart update - only update quantities, names, notes
    filtered.forEach(([itemId,item])=>{
      const card=listContainer.querySelector(`[data-item-id="${itemId}"]`);
      if(!card)return;
      const qtyEl=card.querySelector('.item-qty');
      if(qtyEl&&qtyEl.textContent!==String(item.quantity||0)){
        qtyEl.textContent=String(item.quantity||0);
        qtyEl.style.color=item.quantity===0?"var(--danger)":"var(--accent)";
        // Brief flash animation
        qtyEl.style.transition="transform 0.15s";
        qtyEl.style.transform="scale(1.2)";
        setTimeout(()=>{qtyEl.style.transform="scale(1)"},150);
      }
      const nameEl=card.querySelector('.item-name');
      if(nameEl&&nameEl.textContent!==item.name)nameEl.textContent=item.name;
      const showImgs=currentWhData?.features?.showImages!==false;
      const slotEl=card.querySelector('.item-img-slot');
      if(showImgs){
        if(slotEl){
          const thumbEl=slotEl.querySelector('.item-thumb');
          const thumbSrc=item.thumb||item.image;
          if(thumbSrc){if(thumbEl){if(thumbEl.src!==thumbSrc)thumbEl.src=thumbSrc;}else{const t=el("img",{className:"item-thumb",src:thumbSrc,onClick:async()=>showImageViewer(await fetchFullImage(whId,itemId,item))});slotEl.appendChild(t);}}
          else if(thumbEl)thumbEl.remove();
        }
      }else if(slotEl)slotEl.remove();
      const showSku=currentWhData?.features?.showSku!==false;
      const skuEl=card.querySelector('.item-sku');
      if(showSku&&item.sku){
        if(skuEl)skuEl.textContent=`מק"ט: ${item.sku}`;
        else{const ne=el("div",{className:"item-sku",style:{fontSize:"11px",color:"var(--text-muted)",marginBottom:"2px"}},`מק"ט: ${item.sku}`);const info=card.querySelector('.item-info');if(info)info.insertBefore(ne,info.querySelector('.item-note')||info.querySelector('.item-qty-row'));}
      }else if(skuEl)skuEl.remove();
      const noteEl=card.querySelector('.item-note');
      if(item.note){
        if(noteEl)noteEl.textContent=item.note;
        else{
          const ne=el("div",{className:"note-text item-note"},item.note);
          const info=card.querySelector('.item-info');
          if(info)info.insertBefore(ne,info.querySelector('.item-qty-row'));
        }
      }else if(noteEl)noteEl.remove();
    });
    return;
  }

  // Full rebuild needed (items added/removed/reordered)
  listContainer.innerHTML="";

  if(reorderMode){
    const saveBar=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",background:"var(--accent-glow)",border:"1px solid rgba(79,140,255,.3)",borderRadius:"12px",padding:"10px 14px",marginBottom:"12px"}});
    saveBar.appendChild(el("span",{style:{fontSize:"13px",color:"var(--accent)",fontWeight:"500"}},"מצב סידור ידני — גרור פריטים לסידור"));
    const doneBtn=el("button",{className:"btn btn-primary btn-sm",onClick:()=>{
      reorderMode=false;
      renderItemsList(c,whId,items,wrap);
    }},"שמור");
    saveBar.appendChild(doneBtn);
    listContainer.appendChild(saveBar);
  }

  if(filtered.length===0&&items.length>0){
    listContainer.appendChild(el("div",{className:"empty-state",style:{padding:"30px 20px"}},
      el("p",{style:{fontSize:"14px"}},"לא נמצאו פריטים")
    ));return;
  }
  if(filtered.length===0){
    const empty=el("div",{className:"empty-state"});empty.appendChild(icon("box",40));
    empty.appendChild(el("p",{style:{marginTop:"16px",fontSize:"15px"}},"אין פריטים עדיין"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"4px"}},"לחץ על + כדי להוסיף פריט"));
    listContainer.appendChild(empty);return;
  }

  const itemsContainer=el("div");
  filtered.forEach(([itemId,item],i)=>{
    const card=el("div",{className:"item-card",style:{marginBottom:"8px"}});
    card.dataset.itemId=itemId;

    if(reorderMode){
      // Drag handle
      const handle=el("div",{className:"drag-handle",style:{marginLeft:"8px",display:"flex",alignItems:"center"}});
      handle.appendChild(icon("grip",22));
      card.appendChild(handle);
      card.setAttribute("draggable","true");

      // HTML5 drag (desktop) — live "push apart" reorder: as the pointer crosses
      // other cards they slide out of the way (FLIP animation) instead of just
      // highlighting a drop target.
      card.addEventListener("dragstart",e=>{
        dragSrcId=itemId;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",itemId);
        const cardEls=[...itemsContainer.children];
        desktopDrag={cardEls,dragIndex:cardEls.indexOf(card),curIndex:cardEls.indexOf(card),srcEl:card};
      });
      card.addEventListener("dragend",()=>{
        card.classList.remove("dragging");
        dragSrcId=null;desktopDrag=null;
        clearDragStyles(itemsContainer);
      });
      card.addEventListener("dragover",e=>{
        e.preventDefault();e.dataTransfer.dropEffect="move";
        if(!desktopDrag)return;
        const newIndex=indexForY(desktopDrag.cardEls,e.clientY);
        if(newIndex!==desktopDrag.curIndex){
          desktopDrag.cardEls=flipReorder(itemsContainer,desktopDrag.cardEls,desktopDrag.curIndex,newIndex,desktopDrag.srcEl);
          desktopDrag.curIndex=newIndex;
        }
      });
      card.addEventListener("drop",async e=>{
        e.preventDefault();
        if(!desktopDrag)return;
        const finalEls=desktopDrag.cardEls;
        const changed=desktopDrag.dragIndex!==desktopDrag.curIndex;
        if(changed){
          const updates={};
          finalEls.forEach((elm,i)=>{updates[`items/${elm.dataset.itemId}/order`]=i+1});
          await dbUpdate(`warehouses/${whId}`,updates);
        }
      });

      // Touch drag (mobile) — no floating clone. The real card itself is lifted
      // (transform + shadow) and follows the finger directly; other cards FLIP
      // out of the way as it crosses them. A clone appended to document.body was
      // the earlier design, but on Android a cancelled/lost touch sequence could
      // leave that clone orphaned on screen forever since nothing but our own
      // cleanup code would ever remove it. With no second node to lose track of,
      // there's nothing left to get stuck: worst case the real card just keeps
      // whatever transform it had, and the very next full re-render (leaving
      // reorder mode, or any Firebase update) wipes it clean like every other
      // card.
      handle.addEventListener("touchstart",e=>{
        e.preventDefault();
        // Start from a guaranteed-clean slate — if any previous drag left a card
        // displaced (interrupted gesture, backgrounded app, etc.) this wipes it
        // instead of measuring against the broken state.
        clearDragStyles(itemsContainer);
        const touch=e.touches[0];
        const rect=card.getBoundingClientRect();
        const cardEls=[...itemsContainer.children];
        const dragIndex=cardEls.indexOf(card);
        touchDrag={itemId,grabOffsetY:touch.clientY-rect.top,cardHeight:rect.height,lastClientY:touch.clientY,cardEls,dragIndex,curIndex:dragIndex,rafId:null};
        card.classList.add("drag-active");
        card.style.zIndex="500";
        card.style.position="relative";
        card.style.boxShadow="0 8px 24px rgba(0,0,0,.4)";
      },{passive:false});
      const followFinger=()=>{
        // Natural top = where the card sits in the flow right now, transform
        // cleared first since the rect would otherwise include our own offset.
        card.style.transform="none";
        const naturalTop=card.getBoundingClientRect().top;
        card.style.transform=`translateY(${touchDrag.lastClientY-touchDrag.grabOffsetY-naturalTop}px)`;
      };
      handle.addEventListener("touchmove",e=>{
        if(!touchDrag)return;e.preventDefault();
        touchDrag.lastClientY=e.touches[0].clientY;
        if(touchDrag.rafId)return;
        touchDrag.rafId=requestAnimationFrame(()=>{
          touchDrag.rafId=null;
          if(!touchDrag)return;
          followFinger();
          const cardCenterY=touchDrag.lastClientY-touchDrag.grabOffsetY+touchDrag.cardHeight/2;
          const newIndex=indexForY(touchDrag.cardEls,cardCenterY);
          if(newIndex!==touchDrag.curIndex){
            touchDrag.cardEls=flipReorder(itemsContainer,touchDrag.cardEls,touchDrag.curIndex,newIndex,card);
            touchDrag.curIndex=newIndex;
            followFinger();
          }
        });
      },{passive:false});
      // touchend AND touchcancel both need to clean up — Android in particular can
      // cancel an in-progress touch (e.g. if it decides the gesture is a scroll or
      // a system edge-swipe) without ever firing touchend.
      const finishTouchDrag=async(commit)=>{
        if(!touchDrag)return;
        if(touchDrag.rafId)cancelAnimationFrame(touchDrag.rafId);
        card.classList.remove("drag-active");
        card.style.position="";
        // Hard-reset EVERY card, not just the dragged one — any card left holding a
        // transform from an interrupted slide-out-of-the-way animation is exactly
        // what showed up as a card-sized gap in the list.
        clearDragStyles(itemsContainer);
        const finalEls=touchDrag.cardEls;
        const changed=touchDrag.dragIndex!==touchDrag.curIndex;
        touchDrag=null;
        if(commit&&changed){
          const updates={};
          finalEls.forEach((elm,i)=>{updates[`items/${elm.dataset.itemId}/order`]=i+1});
          // Update the in-memory order too, so the re-render below (and any smart
          // in-place update from the Firebase listener) agrees with the new order
          // instead of briefly snapping items back.
          finalEls.forEach((elm,i)=>{
            const entry=items.find(([id])=>id===elm.dataset.itemId);
            if(entry)entry[1].order=i+1;
          });
          await dbUpdate(`warehouses/${whId}`,updates);
        }
        renderItemsList(c,whId,items,wrap);
      };
      handle.addEventListener("touchend",()=>finishTouchDrag(true));
      handle.addEventListener("touchcancel",()=>finishTouchDrag(false));
    }

    const info=el("div",{className:"item-info",style:{flex:"1",minWidth:"0"}});
    info.appendChild(el("div",{className:"item-name",style:{fontSize:"16px",fontWeight:"500",marginBottom:"2px"}},item.name));
    if(currentWhData?.features?.showSku!==false&&item.sku)info.appendChild(el("div",{className:"item-sku",style:{fontSize:"11px",color:"var(--text-muted)",marginBottom:"2px"}},`מק"ט: ${item.sku}`));
    if(item.note){info.appendChild(el("div",{className:"note-text item-note"},item.note))}
    const qr=el("div",{className:"item-qty-row",style:{display:"flex",alignItems:"center",gap:"8px",marginTop:"4px"}});
    qr.appendChild(el("span",{className:"item-qty",style:{fontSize:"24px",fontWeight:"700",fontVariantNumeric:"tabular-nums",color:item.quantity===0?"var(--danger)":"var(--accent)"}},String(item.quantity||0)));
    qr.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-muted)"}},"יחידות"));
    info.appendChild(qr);

    const actions=el("div",{style:{display:"flex",gap:"2px",alignItems:"center",flexShrink:"0",marginRight:"8px"}});
    if(!reorderMode){
      const canEdit=memberCan('edit');
      const sb=el("button",{className:"qty-btn qty-btn-sub",style:{width:"36px",height:"36px"},onClick:()=>showAdjustModal(wrap,whId,itemId,item,"remove")});sb.appendChild(icon("minus",18));
      const ab=el("button",{className:"qty-btn qty-btn-add",style:{width:"36px",height:"36px"},onClick:()=>showAdjustModal(wrap,whId,itemId,item,"add")});ab.appendChild(icon("plus",18));
      const mb=el("button",{className:"icon-btn",style:{color:"var(--text-muted)",padding:"6px"},onClick:async()=>{
        // Main menu loop — inline actions keep it open.
        // Cards update in place without rebuilding, so the closure's `item` can be
        // stale (e.g. built from image-stripped cache) — refresh from currentItems.
        while(true){
          const fresh=currentItems.find(([id])=>id===itemId);
          if(fresh)item=fresh[1];
          const mainOpts=[];
          if(canEdit)mainOpts.push({label:"עריכה",value:"edit"});
          mainOpts.push({label:"היסטוריה",value:"history"});
          if(memberCan('reset')&&(item.quantity||0)>0)mainOpts.push({label:"אפס כמות ל-0",style:"danger",value:"reset"});
          if(canEdit)mainOpts.push({label:`מחק "${item.name}"`,style:"danger",value:"delete"});
          const choice=await showActionSheet(mainOpts,item.name);
          if(!choice)return; // closed

          if(choice==="edit"){
            showEditItemModal(wrap,whId,itemId,item);return;
          }else if(choice==="history"){
            showHistoryModal(wrap,item);return;
          }else if(choice==="reset"){
            await dbUpdate(`warehouses/${whId}`,{
              [`items/${itemId}/quantity`]:0,
              [`items/${itemId}/history/${genId()}`]:{action:"איפוס",amount:item.quantity||0,result:0,by:currentUser.displayName,date:new Date().toISOString()}
            });
            item.quantity=0;
            // stay in main loop
          }else if(choice==="delete"){
            showDeleteModal(wrap,`למחוק את "${item.name}"?`,async()=>{await dbRemove(`warehouses/${whId}/items/${itemId}`);await dbRemove(`itemImages/${whId}/${itemId}`)});
            return;
          }
        }
      }});
      mb.appendChild(icon("more",18));
      actions.append(mb,sb,ab);
    }
    // Image slot always reserved when feature on — keeps text at uniform position
    if(currentWhData?.features?.showImages!==false&&!reorderMode){
      const slot=el("div",{className:"item-img-slot"});
      const thumbSrc=item.thumb||item.image;
      if(thumbSrc){const t=el("img",{className:"item-thumb",src:thumbSrc,onClick:async()=>showImageViewer(await fetchFullImage(whId,itemId,item))});slot.appendChild(t);}
      card.append(info,slot,actions);
    }else{
      card.append(info,actions);
    }
    itemsContainer.appendChild(card);
  });
  listContainer.appendChild(itemsContainer);
}

// ═══════════ IMAGE HELPERS ═══════════
// Full-size images are stored separately at itemImages/{whId}/{itemId} (NOT inside
// the warehouse/items tree) so opening a warehouse only downloads small thumbnails.
// The full image is fetched on demand only when someone actually opens the viewer.
function encodeImageVariants(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      function toDataUrl(maxPx,quality){
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        return canvas.toDataURL('image/jpeg',quality);
      }
      cb({full:toDataUrl(800,0.72),thumb:toDataUrl(160,0.55)});
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function makeThumbFromDataUrl(dataUrl,maxPx,quality,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    cb(canvas.toDataURL('image/jpeg',quality));
  };
  img.src=dataUrl;
}
// Returns the full-resolution image for viewing. Legacy items (from before this
// change) still carry it inline as item.image; newer items keep it at itemImages/.
async function fetchFullImage(whId,itemId,item){
  if(item.image)return item.image;
  const full=await dbGet(`itemImages/${whId}/${itemId}`);
  return full||item.thumb||null;
}
// One-time background migration: moves any old inline item.image out to itemImages/
// and leaves a small item.thumb behind, so the item stops being part of every
// warehouse load. Naturally stops repeating once item.image is cleared.
const migratingItemImages=new Set();
async function migrateLegacyItemImages(whId,items){
  for(const[itemId,item] of items){
    if(!item.image||item.thumb)continue;
    const key=whId+"/"+itemId;
    if(migratingItemImages.has(key))continue;
    migratingItemImages.add(key);
    try{
      const thumb=await new Promise(res=>makeThumbFromDataUrl(item.image,160,0.55,res));
      await dbSet(`itemImages/${whId}/${itemId}`,item.image);
      await dbUpdate(`warehouses/${whId}`,{[`items/${itemId}/thumb`]:thumb,[`items/${itemId}/image`]:null});
    }catch(e){/* leave it; will retry on next load */}
    finally{migratingItemImages.delete(key)}
  }
}

  const img=el('img',{src:imgData,style:{maxWidth:'92vw',maxHeight:'88vh',borderRadius:'14px',objectFit:'contain',boxShadow:'0 20px 60px rgba(0,0,0,0.6)'}});

// Unified item edit modal — all fields in one window, same layout as new-item.
// Empty SKU/note save as null, which removes them from Firebase.
function showEditItemModal(parent,whId,itemId,item){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"עריכת פריט"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},item.name));

    // Image row — staged locally, written to Firebase only on save.
    // pendingThumb is what shows in the small preview slot; pendingFull is the new
    // full-res photo (only set when the user actually picks a new one).
    let pendingThumb=item.thumb||item.image||null;
    let pendingFull=null;
    let imageChanged=false;
    const imgRow=el("div",{style:{display:"flex",alignItems:"center",gap:"12px",marginBottom:"14px"}});
    const imgSlot=el("div",{style:{width:"64px",height:"64px",borderRadius:"12px",border:"1px solid var(--border)",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:"0",cursor:"pointer",color:"var(--text-muted)"}});
    const imgBtns=el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
    const fileInput=el("input",{type:"file",accept:"image/*",style:{display:"none"}});
    const pickBtn=el("button",{className:"btn btn-ghost btn-sm",style:{fontSize:"13px",padding:"7px 14px"},onClick:()=>fileInput.click()});
    const delImgBtn=el("button",{className:"btn btn-ghost btn-sm",style:{fontSize:"13px",padding:"7px 14px",color:"var(--danger)",borderColor:"rgba(255,92,92,.3)"},onClick:async()=>{
      const c=await showActionSheet([{label:"הסר תמונה",style:"danger",value:"confirm"}],"להסיר את התמונה? היא תימחק בשמירה");
      if(c!=="confirm")return;
      pendingThumb=null;pendingFull=null;imageChanged=true;refreshImgUI();
    }},"הסר");
    function refreshImgUI(){
      imgSlot.innerHTML="";
      if(pendingThumb)imgSlot.appendChild(el("img",{src:pendingThumb,style:{width:"100%",height:"100%",objectFit:"cover"}}));
      else imgSlot.appendChild(icon("camera",26));
      pickBtn.textContent=pendingThumb?"החלף תמונה":"הוסף תמונה";
      delImgBtn.style.display=pendingThumb?"":"none";
    }
    imgSlot.addEventListener("click",async()=>{
      if(!pendingThumb){fileInput.click();return}
      if(imageChanged)showImageViewer(pendingFull||pendingThumb);
      else showImageViewer(await fetchFullImage(whId,itemId,item));
    });
    fileInput.addEventListener("change",e=>{
      const file=e.target.files[0];if(!file)return;
      encodeImageVariants(file,({full,thumb})=>{
        pendingFull=full;pendingThumb=thumb;imageChanged=true;refreshImgUI();
      });
      fileInput.value="";
    });
    refreshImgUI();
    imgBtns.append(pickBtn,delImgBtn);
    imgRow.append(imgSlot,imgBtns);
    m.append(imgRow,fileInput);

    const ni=el("input",{className:"app-input",placeholder:"שם הפריט",style:{marginBottom:"12px"}});
    ni.value=item.name;
    const qi=el("input",{className:"app-input",placeholder:"כמות",type:"number",inputMode:"numeric",style:{marginBottom:"12px"}});
    qi.value=item.quantity||0;
    const skuInput=el("input",{className:"app-input",placeholder:'מק"ט (אופציונלי)',inputMode:"numeric",pattern:"[0-9]*",autocapitalize:"off",style:{marginBottom:"12px"}});
    skuInput.value=item.sku||"";
    const noteInput=el("textarea",{className:"app-input",placeholder:"הערה (אופציונלי)",rows:"2"});
    noteInput.value=item.note||"";
    m.append(ni,qi,skuInput,noteInput);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const sb=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const name=ni.value.trim();if(!name)return;sb.disabled=true;
      const upd={
        [`items/${itemId}/name`]:name,
        [`items/${itemId}/sku`]:skuInput.value.trim()||null,
        [`items/${itemId}/note`]:noteInput.value.trim()||null,
      };
      if(imageChanged){upd[`items/${itemId}/thumb`]=pendingThumb;upd[`items/${itemId}/image`]=null;}
      const nq=parseInt(qi.value);
      if(!isNaN(nq)&&nq>=0&&nq!==(item.quantity||0)){
        upd[`items/${itemId}/quantity`]=nq;
        upd[`items/${itemId}/history/${genId()}`]={action:"עריכה",amount:Math.abs(nq-(item.quantity||0)),result:nq,by:currentUser.displayName,date:new Date().toISOString()};
      }
      await dbUpdate(`warehouses/${whId}`,upd);
      if(imageChanged){
        if(pendingFull)await dbSet(`itemImages/${whId}/${itemId}`,pendingFull);
        else await dbRemove(`itemImages/${whId}/${itemId}`);
      }
      close();
    }},"שמור");
    btns.appendChild(sb);m.appendChild(btns);
    ni.addEventListener("keydown",e=>{if(e.key==="Enter")qi.focus()});
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")skuInput.focus()});
    skuInput.addEventListener("keydown",e=>{if(e.key==="Enter")sb.click()});
    setTimeout(()=>{ni.focus();ni.select()},100);
  });
}

    m.appendChild(hc);
    if(entries.length>200)m.appendChild(el("p",{style:{fontSize:"12px",color:"var(--text-muted)",textAlign:"center",marginTop:"10px"}},`מוצגות 200 הפעולות האחרונות מתוך ${entries.length}`));
  });
}

function showWarehouseSettingsModal(parent,whId,wh){
  const isAdmin=userWarehouseRole==='owner'||userWarehouseRole==='admin';
  showModal(parent,(m,close)=>{
    m.style.maxHeight='none';m.style.overflow='visible';
    m.appendChild(el("h3",{style:{marginBottom:"12px"}},"הגדרות מחסן"));
    if(userWarehouseRole==='owner'){
      const nameRow=el("div",{style:{display:"flex",gap:"8px",alignItems:"center",marginBottom:"14px"}});
      const nameInp=el("input",{className:"app-input",style:{flex:"1"},value:wh.name});
      nameInp.value=wh.name;
      const saveNameBtn=el("button",{className:"btn btn-primary btn-sm",onClick:async()=>{
        const v=nameInp.value.trim();if(!v||v===wh.name)return;
        await dbSet(`warehouses/${whId}/name`,v);
        wh.name=v;saveNameBtn.textContent="נשמר";
        setTimeout(()=>{saveNameBtn.textContent="שמור"},1200);
      }},"שמור");
      nameInp.addEventListener("keydown",e=>{if(e.key==="Enter")saveNameBtn.click()});
      nameRow.append(nameInp,saveNameBtn);
      m.appendChild(nameRow);
    }
    const tabs=isAdmin?['חברים','הרשאות','סידור','תצוגה']:['חברים'];
    const tabBar=el("div",{className:"tab-bar"});
    const panelWrap=el("div",{style:{height:"320px",overflowY:"auto",direction:"ltr"}});
    const panelEls={};
    tabs.forEach((t,i)=>{
      const panel=el("div",{style:{display:i===0?'block':'none',direction:"rtl",padding:"4px 0"}});
      panelEls[t]=panel;panelWrap.appendChild(panel);
      const btn=el("button",{className:"tab-btn"+(i===0?' active':''),onClick:()=>{
        Object.values(panelEls).forEach(p=>p.style.display='none');
        panel.style.display='block';
        tabBar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      }},t);
      tabBar.appendChild(btn);
    });
    m.appendChild(tabBar);m.appendChild(panelWrap);

    // ── חברים ──
    const mp=panelEls['חברים'];
    function refreshMembers(){
      mp.innerHTML='';
      const members=wh.members?Object.keys(wh.members):[];
      if(isAdmin){
        const addRow=el("div",{style:{display:"flex",gap:"8px"}});
        const inp=el("input",{className:"app-input",placeholder:"שם משתמש להוספה",style:{flex:"1"},autocapitalize:"off"});
        const err=el("p",{style:{color:"var(--danger)",fontSize:"12px",marginTop:"6px",minHeight:"16px"}});
        const addBtn=el("button",{className:"btn btn-primary",style:{whiteSpace:"nowrap"},onClick:async()=>{
          const target=inp.value.trim().toLowerCase();if(!target)return;
          const mems=wh.members?Object.keys(wh.members):[];
          if(mems.includes(target)){err.textContent="כבר חבר";return}
          addBtn.disabled=true;err.textContent='';
          const tu=await dbGet(`users/${target}`);
          if(!tu){err.textContent="משתמש לא נמצא";addBtn.disabled=false;return}
          await dbSet(`warehouses/${whId}/members/${target}`,true);
          await dbSet(`users/${target}/warehouses/${whId}`,true);
          if(!wh.members)wh.members={};wh.members[target]=true;
          inp.value='';addBtn.disabled=false;refreshMembers();
        }},"הוסף");
        addRow.append(inp,addBtn);
        mp.appendChild(addRow);mp.appendChild(err);
        inp.addEventListener("keydown",e=>{if(e.key==="Enter")addBtn.click()});
        mp.appendChild(el("div",{style:{borderTop:"1px solid var(--border)",margin:"12px 0 10px"}}));
      }
      members.forEach(u=>{
        const isOwner=u===wh.owner;
        const isCurrentlyAdmin=!isOwner&&wh.roles&&wh.roles[u]==='admin';
        const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"12px",marginBottom:"8px"}});
        const lbl=el("div",{style:{display:"flex",alignItems:"center",gap:"6px"}});
        lbl.appendChild(el("span",{style:{fontSize:"14px",fontWeight:"500"}},u));
        if(u===currentUser.username)lbl.appendChild(el("span",{style:{fontSize:"12px",color:"var(--accent)"}},"(אתה)"));
        row.appendChild(lbl);
        const acts=el("div",{style:{display:"flex",alignItems:"center",gap:"6px"}});
        if(isOwner){
          acts.appendChild(el("span",{style:{fontSize:"12px",color:"var(--warning)",background:"rgba(251,191,36,0.12)",padding:"4px 10px",borderRadius:"20px",fontWeight:"500"}},"בעלים"));
        } else if(isAdmin&&u!==currentUser.username){
          // Role badge (tappable → action sheet)
          const roleBadge=el("button",{style:{
            fontSize:"12px",padding:"4px 12px",borderRadius:"20px",border:"1px solid",cursor:"pointer",fontWeight:"500",
            background:isCurrentlyAdmin?"rgba(52,211,153,0.12)":"transparent",
            color:isCurrentlyAdmin?"var(--success)":"var(--text-muted)",
            borderColor:isCurrentlyAdmin?"var(--success)":"var(--border)"
          },onClick:async()=>{
            const sheetOpts=[
              isCurrentlyAdmin
                ?{label:'הסר מנהל',value:'demote'}
                :{label:'הפוך למנהל',value:'promote'},
            ];
            if(userWarehouseRole==='owner')sheetOpts.push({label:'העבר בעלות',value:'transfer'});
            sheetOpts.push({label:'הסר מהמחסן',style:'danger',value:'remove'});
            const choice=await showActionSheet(sheetOpts,u);
            if(choice==='promote'){
              await dbSet(`warehouses/${whId}/roles/${u}`,'admin');
              if(!wh.roles)wh.roles={};wh.roles[u]='admin';refreshMembers();
            }else if(choice==='demote'){
              await dbRemove(`warehouses/${whId}/roles/${u}`);
              if(!wh.roles)wh.roles={};delete wh.roles[u];refreshMembers();
            }else if(choice==='transfer'){
              const c2=await showActionSheet([
                {label:`העבר בעלות ל-${u} והישאר חבר`,value:'stay'},
                {label:`העבר בעלות ל-${u} ועזוב`,style:'danger',value:'leave'},
              ],`העבר בעלות ל-${u}?`);
              if(c2==='stay'||c2==='leave'){
                await dbSet(`warehouses/${whId}/owner`,u);
                if(c2==='leave'){
                  await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
                  await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
                  close();renderHome();
                }else{
                  wh.owner=u;userWarehouseRole='member';refreshMembers();
                }
              }
            }else if(choice==='remove'){
              await dbRemove(`warehouses/${whId}/members/${u}`);
              await dbRemove(`users/${u}/warehouses/${whId}`);
              await dbRemove(`warehouses/${whId}/roles/${u}`);
              if(wh.members)delete wh.members[u];
              if(wh.roles)delete wh.roles[u];refreshMembers();
            }
          }},isCurrentlyAdmin?'מנהל ▾':'חבר ▾');
          acts.appendChild(roleBadge);
        } else if(isCurrentlyAdmin){
          acts.appendChild(el("span",{style:{fontSize:"12px",color:"var(--success)",background:"rgba(52,211,153,0.12)",padding:"4px 10px",borderRadius:"20px",fontWeight:"500"}},"מנהל"));
        } else if(!isAdmin&&u===currentUser.username){
          const leaveBtn=el("button",{className:"btn btn-danger btn-sm",style:{fontSize:"12px"},onClick:async()=>{
            await dbRemove(`warehouses/${whId}/members/${u}`);
            await dbRemove(`users/${u}/warehouses/${whId}`);
            close();renderHome();
          }},"עזוב");
          acts.appendChild(leaveBtn);
        } else {
          acts.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-muted)",padding:"4px 10px"}},"חבר"));
        }
        row.appendChild(acts);
        mp.appendChild(row);
      });
    }
    refreshMembers();

    // ── הרשאות ──
    if(isAdmin&&panelEls['הרשאות']){
      const pp=panelEls['הרשאות'];
      const perms=wh.permissions||{};
      const permDefs=[
        {key:'restrict_add',label:'מנע הוספת פריטים לחברים'},
        {key:'restrict_reset',label:'מנע איפוס כמויות לחברים'},
        {key:'restrict_edit',label:'מנע עריכה ומחיקה לחברים'},
      ];
      permDefs.forEach(({key,label})=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid var(--border)"}});
        row.appendChild(el("span",{style:{fontSize:"14px"}},label));
        const tog=el("button",{style:{
          width:"44px",height:"24px",borderRadius:"12px",border:"none",cursor:"pointer",
          background:perms[key]?"var(--danger)":"var(--border)",transition:"background .2s",position:"relative",flexShrink:"0"
        },onClick:async()=>{
          const cur=!!perms[key];
          await dbUpdate(`warehouses/${whId}`,{[`permissions/${key}`]:!cur});
          perms[key]=!cur;
          tog.style.background=perms[key]?"var(--danger)":"var(--border)";
          knob.style.right=perms[key]?"2px":"";knob.style.left=perms[key]?"":"2px";
        }});
        const knob=el("div",{style:{
          position:"absolute",width:"20px",height:"20px",borderRadius:"50%",background:"#fff",
          top:"2px",transition:"left .2s, right .2s",
          ...(perms[key]?{right:"2px"}:{left:"2px"})
        }});
        tog.appendChild(knob);row.appendChild(tog);
        pp.appendChild(row);
      });
    }

    // ── תצוגה ──
    if(isAdmin&&panelEls['תצוגה']){
      const dp=panelEls['תצוגה'];
      const features=wh.features||{};
      function makeDisplayToggle(label,featKey,defaultOn){
        const on=features[featKey]!==false;
        const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid var(--border)"}});
        row.appendChild(el("span",{style:{fontSize:"14px"}},label));
        const tog=el("button",{style:{width:"44px",height:"24px",borderRadius:"12px",border:"none",cursor:"pointer",background:on?"var(--accent)":"var(--border)",transition:"background .2s",position:"relative",flexShrink:"0"}
        ,onClick:async()=>{
          const next=features[featKey]===false;
          await dbUpdate(`warehouses/${whId}`,{[`features/${featKey}`]:next});
          features[featKey]=next;
          if(!wh.features)wh.features={};wh.features[featKey]=next;
          if(currentWhData){if(!currentWhData.features)currentWhData.features={};currentWhData.features[featKey]=next;}
          tog.style.background=next?"var(--accent)":"var(--border)";
          knob.style.right=next?"2px":"";knob.style.left=next?"":"2px";
        }});
        const knob=el("div",{style:{position:"absolute",width:"20px",height:"20px",borderRadius:"50%",background:"#fff",top:"2px",transition:"left .2s, right .2s",...(on?{right:"2px"}:{left:"2px"})}});
        tog.appendChild(knob);row.appendChild(tog);dp.appendChild(row);
      }
      makeDisplayToggle('הצג מק"ט על פריטים','showSku');
      makeDisplayToggle('הצג תמונות על פריטים','showImages');
    }

    // ── סידור ──
    if(isAdmin&&panelEls['סידור']){
      const sp=panelEls['סידור'];
      const curSort=wh.sortMode||'manual';
      const sortOpts=[
        {val:'manual',label:'ידני (גרירה)'},
        {val:'alpha',label:'א-ב (אלפביתי)'},
        {val:'qty-desc',label:'כמות: גבוה לנמוך'},
        {val:'qty-asc',label:'כמות: נמוך לגבוה'},
      ];
      sp.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"12px"}},"ברירת מחדל לסידור פריטים:"));
      sortOpts.forEach(({val,label})=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"10px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"},onClick:async()=>{
          await dbSet(`warehouses/${whId}/sortMode`,val);
          wh.sortMode=val;
          sp.querySelectorAll('.sort-chk').forEach(c=>c.textContent='');
          row.querySelector('.sort-chk').textContent='✓';
        }});
        const chk=el("span",{className:"sort-chk",style:{color:"var(--accent)",fontWeight:"700",width:"16px",display:"inline-block"}},(wh.sortMode||'manual')===val?'✓':'');
        row.appendChild(chk);row.appendChild(el("span",{style:{fontSize:"14px"}},label));
        sp.appendChild(row);
      });
    }

    m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%",marginTop:"16px"},onClick:close},"סגור"));
  });
}

function showCopyWarehouseModal(parent,whId,wh){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"שלח עותק מחסן"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},`שלח עותק של "${wh.name}" למשתמש אחר — המחסן שלך לא ישתנה.`));
    const inp=el("input",{className:"app-input",placeholder:"שם משתמש",autocapitalize:"off",style:{marginBottom:"8px"}});
    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"20px"}});
    const suc=el("p",{style:{color:"var(--success)",fontSize:"13px",minHeight:"20px"}});
    m.append(inp,err,suc);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const sendBtn=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const target=inp.value.trim().toLowerCase();if(!target)return;
      if(target===currentUser.username){err.textContent="אי אפשר לשלוח לעצמך";return}
      sendBtn.disabled=true;err.textContent="";suc.textContent="";
      const tu=await dbGet(`users/${target}`);
      if(!tu){err.textContent="משתמש לא נמצא";sendBtn.disabled=false;return}
      const newWhId=genId();
      const newItems={};
      if(wh.items){
        Object.values(wh.items).forEach(item=>{
          const newId=genId();
          const ni={name:item.name,quantity:item.quantity||0,order:item.order||0,
            history:{[genId()]:{action:"יובא",amount:item.quantity||0,by:currentUser.displayName,date:new Date().toISOString()}}};
          if(item.note)ni.note=item.note;
          newItems[newId]=ni;
        });
      }
      const newWh={name:wh.name,owner:target,members:{[target]:true},createdAt:new Date().toISOString()};
      if(Object.keys(newItems).length>0)newWh.items=newItems;
      await dbSet(`warehouses/${newWhId}`,newWh);
      await dbSet(`users/${target}/warehouses/${newWhId}`,true);
      suc.textContent=`עותק נשלח ל-${target}!`;
      inp.value="";sendBtn.disabled=false;
    }},"שלח");
    btns.appendChild(sendBtn);m.appendChild(btns);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")sendBtn.click()});
    setTimeout(()=>inp.focus(),100);
  });
}

function showExportModal(parent,whId,items){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"יצוא רשימה"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},"העתק את הטקסט או שתף אותו"));

    let sorted=[...items].sort((a,b)=>a[1].name.localeCompare(b[1].name,"he"));
    sorted=sorted.filter(([,item])=>(item.quantity||0)>0);
    const hasSku=sorted.some(([,item])=>item.sku);
    const text=sorted.map(([,item])=>{
      let line=`${item.name} (${item.quantity||0})`;
      if(hasSku&&item.sku)line+=` | מק״ט: ${item.sku}`;
      return line;
    }).join("\n");

    const ta=el("textarea",{className:"app-input",rows:"8",style:{direction:"rtl",lineHeight:"1.8",fontSize:"15px"},readonly:"true"});
    ta.value=text;
    m.appendChild(ta);

    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"סגור"));

    const copyBtn=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      try{
        await navigator.clipboard.writeText(text);
        copyBtn.textContent="הועתק!";copyBtn.style.background="var(--success)";
        setTimeout(()=>{copyBtn.textContent="העתק";copyBtn.style.background="var(--accent)"},1500);
      }catch(e){
        ta.select();document.execCommand("copy");
        copyBtn.textContent="הועתק!";copyBtn.style.background="var(--success)";
        setTimeout(()=>{copyBtn.textContent="העתק";copyBtn.style.background="var(--accent)"},1500);
      }
    }},"העתק");

    const shareBtn=el("button",{className:"btn btn-success",style:{flex:"1"},onClick:async()=>{
      if(navigator.share){
        try{await navigator.share({text:text})}catch(e){}
      }else{
        ta.select();document.execCommand("copy");
        shareBtn.textContent="הועתק!";setTimeout(()=>{shareBtn.textContent="שתף"},1500);
      }
    }},"שתף");

    btns.append(copyBtn,shareBtn);m.appendChild(btns);
  });
}

// Parses free-form pasted/typed text (or a loaded CSV/TXT file) into item rows.
// Supports: CSV "שם,כמות,מקט" | "שם (5)" | "שם - 5" | "שם: 5" | "5 שם" | "5x שם" | plain name only.
function parseImportText(text){
  return text.split(/\r?\n/)
    .map(l=>l.trim())
    .filter(l=>l)
    .map(line=>{
      line=line.replace(/^(?:[-*•]|\d+[.)])\s+/,"");
      let name=line,quantity=0,sku="";
      if(line.includes(",")){
        const parts=line.split(",").map(p=>p.trim());
        if(parts.length>=2&&/^\d+$/.test(parts[1])){
          name=parts[0];quantity=parseInt(parts[1]);
          if(parts[2])sku=parts[2];
          return {name,quantity,sku};
        }
      }
      const skuM=line.match(/\|\s*(?:מק"?ט|sku)\s*:?\s*(.+)$/i);
      if(skuM){sku=skuM[1].trim();line=line.slice(0,skuM.index).trim()}
      let m=line.match(/^(.+?)\s*\((\d+)\)\s*$/);
      if(m){name=m[1].trim();quantity=parseInt(m[2]);return {name,quantity,sku}}
      m=line.match(/^(.+?)[\s\-–:]+(\d+)\s*$/);
      if(m&&m[1].trim()){name=m[1].trim();quantity=parseInt(m[2]);return {name,quantity,sku}}
      m=line.match(/^(\d+)\s*[xX×]?\s+(.+)$/);
      if(m){quantity=parseInt(m[1]);name=m[2].trim();return {name,quantity,sku}}
      name=line.trim();
      return {name,quantity,sku};
    })
    .filter(it=>it.name);
}

function showImportModal(parent,whId){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"ייבוא פריטים"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"13px",marginBottom:"12px"}},'הדבק רשימה (למשל מוואטסאפ) או בחר קובץ CSV/טקסט — שורה אחת לכל פריט.'));

    const fileRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"10px"}});
    const fileBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"}},"בחר קובץ");
    const fileInput=el("input",{type:"file",accept:".csv,.txt,text/csv,text/plain",style:{display:"none"}});
    fileBtn.onclick=()=>fileInput.click();
    fileInput.addEventListener("change",()=>{
      const f=fileInput.files[0];if(!f)return;
      const reader=new FileReader();
      reader.onload=()=>{ta.value=reader.result};
      reader.readAsText(f,"UTF-8");
    });
    fileRow.append(fileBtn,fileInput);
    m.appendChild(fileRow);

    const ta=el("textarea",{className:"app-input",rows:"6",placeholder:"לדוגמה:\nחולצה (5)\nמכנס - 3\n2 כובעים",style:{direction:"rtl",lineHeight:"1.7",fontSize:"14px",marginBottom:"12px"}});
    m.appendChild(ta);

    const previewWrap=el("div",{style:{display:"none",marginBottom:"10px",maxHeight:"300px",overflowY:"auto"}});
    m.appendChild(previewWrap);

    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"18px"}});
    m.appendChild(err);

    let mode="edit";
    let parsedRows=[];

    function renderPreview(){
      previewWrap.innerHTML="";
      parsedRows.forEach((row,idx)=>{
        const rowEl=el("div",{style:{display:"flex",gap:"6px",marginBottom:"6px",alignItems:"center"}});
        const nameI=el("input",{className:"app-input",style:{flex:"3",padding:"8px 10px",fontSize:"13px"}});
        nameI.value=row.name;
        nameI.addEventListener("input",()=>{row.name=nameI.value});
        const qtyI=el("input",{className:"app-input",type:"number",inputMode:"numeric",style:{flex:"1",padding:"8px 10px",fontSize:"13px"}});
        qtyI.value=row.quantity;
        qtyI.addEventListener("input",()=>{row.quantity=parseInt(qtyI.value)||0});
        const rmBtn=el("button",{className:"toolbar-btn danger-hover",style:{padding:"6px",flex:"0 0 auto"}});
        rmBtn.appendChild(icon("close",12));
        rmBtn.onclick=()=>{parsedRows.splice(idx,1);renderPreview();mainBtn.textContent=`ייבא ${parsedRows.length} פריטים`};
        rowEl.append(nameI,qtyI,rmBtn);
        previewWrap.appendChild(rowEl);
      });
    }

    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"8px"}});
    const cancelBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול");
    const mainBtn=el("button",{className:"btn btn-primary",style:{flex:"1"}},"המשך");
    mainBtn.onclick=async()=>{
      err.textContent="";
      if(mode==="edit"){
        parsedRows=parseImportText(ta.value);
        if(!parsedRows.length){err.textContent="לא נמצאו פריטים לייבוא";return}
        renderPreview();
        mode="preview";
        ta.style.display="none";fileRow.style.display="none";
        previewWrap.style.display="";
        mainBtn.textContent=`ייבא ${parsedRows.length} פריטים`;
      }else{
        const rows=parsedRows.filter(r=>r.name&&r.name.trim());
        if(!rows.length){err.textContent="אין פריטים תקינים";return}
        mainBtn.disabled=true;mainBtn.textContent="מייבא...";
        try{
          const existingItems=await dbGet(`warehouses/${whId}/items`);
          let maxOrder=0;
          if(existingItems)Object.values(existingItems).forEach(it=>{if((it.order||0)>maxOrder)maxOrder=it.order||0});
          const updates={};
          rows.forEach((r,i)=>{
            const id=genId();
            const qty=r.quantity||0;
            const itemData={name:r.name.trim(),quantity:qty,order:maxOrder+i+1,
              history:{[genId()]:{action:"נוצר (ייבוא)",amount:qty,by:currentUser.displayName,date:new Date().toISOString()}}};
            if(r.sku&&r.sku.trim())itemData.sku=r.sku.trim();
            updates[`items/${id}`]=itemData;
          });
          await dbUpdate(`warehouses/${whId}`,updates);
          close();
        }catch(e){err.textContent="שגיאה בייבוא — נסה שוב";mainBtn.disabled=false;mainBtn.textContent=`ייבא ${rows.length} פריטים`}
      }
    };
    btns.append(cancelBtn,mainBtn);m.appendChild(btns);
  });
}
