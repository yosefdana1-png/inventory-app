// FLIP-style reorder helpers for the manual drag-to-reorder feature: as the
// dragged card crosses other cards, we move its element to its new slot in the
// real DOM order and animate every displaced card sliding into place — so
// items visibly make room for the one being dragged, instead of just
// highlighting whichever card sits under the pointer.
function indexForY(cardEls,y){
  // Measure each card's LAYOUT position, not its animated position: cards mid
  // slide (transform transition running) report their in-flight rect, so near a
  // slot boundary the computed index flip-flopped every frame and the whole list
  // visibly shook. Every drag transform we set is an inline translateY, so
  // subtracting it back out of the rect gives the true resting position.
  for(let i=0;i<cardEls.length;i++){
    const r=cardEls[i].getBoundingClientRect();
    const m=/translateY\((-?[\d.]+)px\)/.exec(cardEls[i].style.transform);
    const top=m?r.top-parseFloat(m[1]):r.top;
    if(y<top+r.height/2)return i;
  }
  return cardEls.length-1;
}
// Wipes every drag-related inline style off every card in the list. Called at the
// start and end of every drag so a card can never be left displaced/invisible by
// a half-finished animation — which is what produced the stuck cards and the
// card-sized gaps in the list on Android.
function clearDragStyles(container){
  [...container.children].forEach(elm=>{
    elm.style.transition="";elm.style.transform="";elm.style.opacity="";
    elm.style.zIndex="";elm.style.boxShadow="";
  });
}
function flipReorder(container,cardEls,fromIndex,toIndex,skipEl){
  if(fromIndex===toIndex||fromIndex<0||toIndex<0)return cardEls;
  const firstRects=new Map();
  // Freeze any in-flight transition BEFORE measuring: getBoundingClientRect on a
  // mid-animation element returns its animated position, not its layout position,
  // so measuring without this makes each successive reorder compute its offset
  // against a wrong baseline — the errors compound into the visible gaps.
  cardEls.forEach(elm=>{if(elm!==skipEl){elm.style.transition="none";elm.style.transform=""}});
  void container.offsetHeight;
  cardEls.forEach(elm=>firstRects.set(elm,elm.getBoundingClientRect()));
  const newArr=[...cardEls];
  const[moved]=newArr.splice(fromIndex,1);
  newArr.splice(toIndex,0,moved);
  // Commit the new order WITHOUT ever detaching skipEl (the card being
  // dragged): appendChild on a node = detach + re-insert, and on Android
  // Chrome detaching the element an active touch sequence started on silently
  // kills the stream — no more touchmove, often no touchcancel either — which
  // is exactly the mid-drag freeze. Iterating in reverse and moving only the
  // OTHER cards around skipEl produces the same final order while the touch
  // target stays attached the whole time.
  let domRef=null;
  for(let i=newArr.length-1;i>=0;i--){
    const elm=newArr[i];
    if(elm===skipEl){domRef=elm;continue}
    if(elm.nextSibling!==domRef)container.insertBefore(elm,domRef);
    domRef=elm;
  }
  newArr.forEach(elm=>{
    if(elm===skipEl)return;
    const first=firstRects.get(elm);
    const last=elm.getBoundingClientRect();
    const dy=first.top-last.top;
    if(dy){
      elm.style.transition="none";
      elm.style.transform=`translateY(${dy}px)`;
      // Force a layout flush so the browser commits the "jump back to old spot"
      // state above before we flip the transition back on — a nested
      // requestAnimationFrame here (the previous approach) can interleave with a
      // *second* reorder landing before the first one's frame fires, leaving a
      // card's transform permanently stuck mid-animation (the frozen/duplicated
      // card seen on Android). Reading offsetHeight is synchronous, so there's no
      // window for another call to race it.
      void elm.offsetHeight;
      elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
      elm.style.transform="";
    }
  });
  return newArr;
}

// Low-stock: an item with lowStock set is "low" when 0 < quantity <= lowStock.
// Quantity 0 is "out of stock" regardless of threshold.
function isLowStock(it){
  const q=it.quantity||0;const t=parseInt(it.lowStock);
  return t>0&&q>0&&q<=t;
}
function stockChip(it){
  const q=it.quantity||0;
  const label=q===0?"אזל":isLowStock(it)?"מלאי נמוך":null;
  if(!label)return null;
  const danger=q===0;
  return el("span",{className:"stock-chip",style:{fontSize:"10px",fontWeight:"600",padding:"2px 8px",borderRadius:"8px",
    background:danger?"var(--danger-bg)":"var(--warning-bg)",
    color:danger?"var(--danger)":"var(--warning)",
    border:"1px solid "+(danger?"rgba(255,92,92,.3)":"rgba(251,191,36,.3)")}},label);
}
function qtyColor(it){
  const q=it.quantity||0;
  return q===0?"var(--danger)":isLowStock(it)?"var(--warning)":"var(--accent)";
}

function renderItemsList(c,whId,items,wrap){
  const listContainer=c.querySelector('#itemsList');
  if(!listContainer)return;

  // A re-render arriving MID-DRAG (another user's update coming through the
  // listener) would replace the cards under the user's finger and break the
  // gesture — defer it; finishTouchDrag re-renders with the fresh data.
  if(touchDrag){pendingListRender=true;return}
  // Search is disabled while reordering (see the sort action sheet comment).
  const searchInputEl=wrap.querySelector('#searchInput');
  if(searchInputEl){
    searchInputEl.disabled=reorderMode;
    searchInputEl.placeholder=reorderMode?"החיפוש כבוי בזמן סידור ידני":"חיפוש פריט...";
  }

  let filtered=items;
  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    filtered=items.filter(([,item])=>item.name.toLowerCase().includes(q)||(item.note&&item.note.toLowerCase().includes(q))||(item.sku&&item.sku.toLowerCase().includes(q)));
  }
  if(currentSort==="alpha"){
    filtered=[...filtered].sort((a,b)=>a[1].name.localeCompare(b[1].name,"he"));
  }else if(currentSort==="qty-desc"){
    filtered=[...filtered].sort((a,b)=>(b[1].quantity||0)-(a[1].quantity||0));
  }else if(currentSort==="qty-asc"){
    filtered=[...filtered].sort((a,b)=>(a[1].quantity||0)-(b[1].quantity||0));
  }else{
    filtered=[...filtered].sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  }
  if(lowFilter)filtered=filtered.filter(([,it])=>(it.quantity||0)===0||isLowStock(it));
  const lowCount=items.filter(([,it])=>(it.quantity||0)===0||isLowStock(it)).length;

  // Check if we can do an in-place update (same items, same order)
  const existingCards=listContainer.querySelectorAll('[data-item-id]');
  const existingIds=[...existingCards].map(c=>c.dataset.itemId);
  const newIds=filtered.map(([id])=>id);
  const sameStructure=existingIds.length===newIds.length&&existingIds.every((id,i)=>id===newIds[i]);
  // If the currently-rendered DOM is still showing reorder-mode chrome (drag
  // handles / the save bar) but reorderMode just turned off (or vice versa),
  // force a full rebuild even if the item ids match — otherwise the smart
  // in-place update below skips touching that chrome and the "שמור" button
  // (and drag handles) look like they did nothing.
  const listWasInReorderMode=!!listContainer.querySelector('.drag-handle');

  if(sameStructure&&existingIds.length>0&&!reorderMode&&!listWasInReorderMode){
    // Smart update - only update quantities, names, notes
    filtered.forEach(([itemId,item])=>{
      const card=listContainer.querySelector(`[data-item-id="${itemId}"]`);
      if(!card)return;
      const qtyEl=card.querySelector('.item-qty');
      if(qtyEl&&qtyEl.textContent!==String(item.quantity||0)){
        qtyEl.textContent=String(item.quantity||0);
        // Brief flash animation
        qtyEl.style.transition="transform 0.15s";
        qtyEl.style.transform="scale(1.2)";
        setTimeout(()=>{qtyEl.style.transform="scale(1)"},150);
      }
      if(qtyEl){
        qtyEl.style.color=qtyColor(item);
        const qrow=card.querySelector('.item-qty-row');
        const oldChip=qrow?qrow.querySelector('.stock-chip'):null;
        const fresh=stockChip(item);
        const desired=fresh?fresh.textContent:null;
        if((oldChip?oldChip.textContent:null)!==desired){
          if(oldChip)oldChip.remove();
          if(fresh&&qrow)qrow.appendChild(fresh);
        }
      }
      const nameEl=card.querySelector('.item-name');
      if(nameEl&&nameEl.textContent!==item.name)nameEl.textContent=item.name;
      const showImgs=currentWhData?.features?.showImages!==false;
      const slotEl=card.querySelector('.item-img-slot');
      if(showImgs){
        if(slotEl){
          const thumbEl=slotEl.querySelector('.item-thumb');
          const thumbSrc=item.thumb||item.image;
          if(thumbSrc){if(thumbEl){if(thumbEl.src!==thumbSrc)thumbEl.src=thumbSrc;}else{const t=el("img",{className:"item-thumb",src:thumbSrc,onClick:async()=>showImageViewer(await fetchFullImage(whId,itemId,item))});slotEl.appendChild(t);}}
          else if(thumbEl)thumbEl.remove();
        }
      }else if(slotEl)slotEl.remove();
      const showSku=currentWhData?.features?.showSku!==false;
      const skuEl=card.querySelector('.item-sku');
      if(showSku&&item.sku){
        if(skuEl)skuEl.textContent=`מק"ט: ${item.sku}`;
        else{const ne=el("div",{className:"item-sku",style:{fontSize:"11px",color:"var(--text-muted)",marginBottom:"2px"}},`מק"ט: ${item.sku}`);const info=card.querySelector('.item-info');if(info)info.insertBefore(ne,info.querySelector('.item-note')||info.querySelector('.item-qty-row'));}
      }else if(skuEl)skuEl.remove();
      const noteEl=card.querySelector('.item-note');
      if(item.note){
        if(noteEl)noteEl.textContent=item.note;
        else{
          const ne=el("div",{className:"note-text item-note"},item.note);
          const info=card.querySelector('.item-info');
          if(info)info.insertBefore(ne,info.querySelector('.item-qty-row'));
        }
      }else if(noteEl)noteEl.remove();
    });
    const lb=listContainer.querySelector('#lowBanner');
    if(lb){
      const txt=lb.querySelector('.low-banner-text');
      if(txt)txt.textContent=`${lowCount} פריטים בחוסר או במלאי נמוך`;
      lb.style.display=(lowCount>0||lowFilter)?"flex":"none";
    }
    return;
  }

  // Full rebuild needed (items added/removed/reordered)
  listContainer.innerHTML="";

  if(reorderMode){
    const saveBar=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",background:"var(--accent-glow)",border:"1px solid rgba(79,140,255,.3)",borderRadius:"12px",padding:"10px 14px",marginBottom:"12px"}});
    saveBar.appendChild(el("span",{style:{fontSize:"13px",color:"var(--accent)",fontWeight:"500"}},"מצב סידור ידני — גרור פריטים לסידור"));
    const doneBtn=el("button",{className:"btn btn-primary btn-sm",onClick:()=>{
      reorderMode=false;
      renderItemsList(c,whId,items,wrap);
    }},"שמור");
    saveBar.appendChild(doneBtn);
    listContainer.appendChild(saveBar);
  }

  {
    const lb=el("div",{id:"lowBanner",style:{display:(lowCount>0||lowFilter)?"flex":"none",alignItems:"center",gap:"8px",
      background:lowFilter?"var(--warning-bg)":"var(--card)",
      border:"1px solid "+(lowFilter?"rgba(251,191,36,.45)":"var(--border)"),
      borderRadius:"12px",padding:"9px 14px",marginBottom:"10px",cursor:"pointer",fontSize:"13px",color:"var(--warning)"},
      onClick:()=>{lowFilter=!lowFilter;renderItemsList(c,whId,items,wrap)}});
    lb.appendChild(el("span",{className:"low-banner-text",style:{flex:"1",fontWeight:"500"}},`${lowCount} פריטים בחוסר או במלאי נמוך`));
    lb.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-sec)"}},lowFilter?"הצג הכל":"הצג רק אותם"));
    listContainer.appendChild(lb);
  }

  if(filtered.length===0&&items.length>0){
    listContainer.appendChild(el("div",{className:"empty-state",style:{padding:"30px 20px"}},
      el("p",{style:{fontSize:"14px"}},"לא נמצאו פריטים")
    ));return;
  }
  if(filtered.length===0){
    const empty=el("div",{className:"empty-state"});empty.appendChild(icon("box",40));
    empty.appendChild(el("p",{style:{marginTop:"16px",fontSize:"15px"}},"אין פריטים עדיין"));
    empty.appendChild(el("p",{style:{fontSize:"13px",marginTop:"4px"}},"לחץ על + כדי להוסיף פריט"));
    listContainer.appendChild(empty);return;
  }

  const itemsContainer=el("div");
  filtered.forEach(([itemId,item],i)=>{
    const card=el("div",{className:"item-card",style:{marginBottom:"8px"}});
    card.dataset.itemId=itemId;

    if(reorderMode){
      // Drag handle
      const handle=el("div",{className:"drag-handle",style:{marginLeft:"8px",display:"flex",alignItems:"center"}});
      handle.appendChild(icon("grip",22));
      card.appendChild(handle);
      card.setAttribute("draggable","true");

      // HTML5 drag (desktop) — live "push apart" reorder: as the pointer crosses
      // other cards they slide out of the way (FLIP animation) instead of just
      // highlighting a drop target.
      card.addEventListener("dragstart",e=>{
        dragSrcId=itemId;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",itemId);
        const cardEls=[...itemsContainer.children];
        desktopDrag={cardEls,dragIndex:cardEls.indexOf(card),curIndex:cardEls.indexOf(card),srcEl:card};
      });
      card.addEventListener("dragend",()=>{
        card.classList.remove("dragging");
        dragSrcId=null;desktopDrag=null;
        clearDragStyles(itemsContainer);
      });
      card.addEventListener("dragover",e=>{
        e.preventDefault();e.dataTransfer.dropEffect="move";
        if(!desktopDrag)return;
        const newIndex=indexForY(desktopDrag.cardEls,e.clientY);
        if(newIndex!==desktopDrag.curIndex){
          desktopDrag.cardEls=flipReorder(itemsContainer,desktopDrag.cardEls,desktopDrag.curIndex,newIndex,desktopDrag.srcEl);
          desktopDrag.curIndex=newIndex;
        }
      });
      card.addEventListener("drop",async e=>{
        e.preventDefault();
        if(!desktopDrag)return;
        const finalEls=desktopDrag.cardEls;
        const changed=desktopDrag.dragIndex!==desktopDrag.curIndex;
        if(changed){
          const updates={};
          finalEls.forEach((elm,i)=>{updates[`items/${elm.dataset.itemId}/order`]=i+1});
          updates["sortMode"]="manual"; // see the touch-drag commit comment
          if(currentWhData)currentWhData.sortMode="manual";
          await dbUpdate(`warehouses/${whId}`,updates);
        }
      });

      // Touch drag (mobile) — transform-only while the finger is down. The
      // previous design re-ordered the real DOM on every crossing (FLIP), which
      // caused both mobile bugs: (1) detaching/re-inserting cards mid-gesture
      // can break the Android touch stream, so touchend/touchcancel never
      // arrive and the lifted card stays stranded on top of the list until the
      // next drag's cleanup; (2) picking the drop slot by measuring cards that
      // are mid-slide returns their in-flight positions, so near a boundary the
      // computed slot flip-flopped every frame and the list below the finger
      // visibly shook (iPhone). Now NOTHING in the DOM moves and NOTHING is
      // measured during the drag: the layout is measured once at touchstart,
      // the dragged card follows the finger with a transform, displaced cards
      // slide by a fixed precomputed distance, and the drop slot is derived
      // purely from that frozen geometry. The real re-order happens exactly
      // once, at drop, via the normal re-render.
      handle.addEventListener("touchstart",e=>{
        e.preventDefault();
        if(touchDrag)return; // a second finger must not hijack an active drag
        // Start from a guaranteed-clean slate — if any previous drag left a card
        // displaced (interrupted gesture, backgrounded app, etc.) this wipes it
        // instead of measuring against the broken state.
        clearDragStyles(itemsContainer);
        const touch=e.touches[0];
        const cardEls=[...itemsContainer.children];
        const rects=cardEls.map(elm=>elm.getBoundingClientRect());
        const dragIndex=cardEls.indexOf(card);
        const rect=rects[dragIndex];
        const gap=rects.length>1?rects[1].top-rects[0].bottom:8;
        touchDrag={itemId,grabOffsetY:touch.clientY-rect.top,cardHeight:rect.height,
          lastClientY:touch.clientY,cardEls,dragIndex,curIndex:dragIndex,rafId:null,
          startTop:rect.top,
          // Frozen geometry: every card's original midpoint, and how far a
          // displaced card must slide (one dragged-card slot).
          mids:rects.map(r=>r.top+r.height/2),shift:rect.height+gap,
          docEnd:null,docCancel:null};
        card.classList.add("drag-active");
        card.style.zIndex="500";
        card.style.position="relative";
        card.style.boxShadow="0 8px 24px rgba(0,0,0,.4)";
        // Safety net: also end the drag from document level, in case the handle
        // itself ever misses the end of the stream. Only when the LAST finger
        // lifts, so resting a second finger on the screen can't end the drag.
        touchDrag.docEnd=ev=>{if(ev.touches.length===0)finishTouchDrag(true)};
        touchDrag.docCancel=ev=>{if(ev.touches.length===0)finishTouchDrag(false)};
        document.addEventListener("touchend",touchDrag.docEnd);
        document.addEventListener("touchcancel",touchDrag.docCancel);
      },{passive:false});
      const updateDragFrame=()=>{
        const top=touchDrag.lastClientY-touchDrag.grabOffsetY;
        card.style.transform=`translateY(${top-touchDrag.startTop}px)`;
        // Drop slot from the geometry frozen at touchstart: how many OTHER
        // cards' original midpoints sit above the dragged card's center. Static
        // inputs, so the result can't oscillate the way live measurement of
        // animating cards did.
        const center=top+touchDrag.cardHeight/2;
        let newIndex=0;
        for(let i=0;i<touchDrag.mids.length;i++){
          if(i===touchDrag.dragIndex)continue;
          if(center>touchDrag.mids[i])newIndex++;
        }
        if(newIndex!==touchDrag.curIndex){
          touchDrag.curIndex=newIndex;
          touchDrag.cardEls.forEach((elm,i)=>{
            if(i===touchDrag.dragIndex)return;
            let dy=0;
            if(i>touchDrag.dragIndex&&i<=touchDrag.curIndex)dy=-touchDrag.shift;
            else if(i<touchDrag.dragIndex&&i>=touchDrag.curIndex)dy=touchDrag.shift;
            const t=dy?`translateY(${dy}px)`:"";
            if(elm.style.transform!==t){
              elm.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";
              elm.style.transform=t;
            }
          });
        }
      };
      handle.addEventListener("touchmove",e=>{
        if(!touchDrag)return;e.preventDefault();
        touchDrag.lastClientY=e.touches[0].clientY;
        if(touchDrag.rafId)return;
        touchDrag.rafId=requestAnimationFrame(()=>{
          if(!touchDrag)return;
          touchDrag.rafId=null;
          updateDragFrame();
        });
      },{passive:false});
      const finishTouchDrag=async(commit)=>{
        if(!touchDrag)return;
        if(touchDrag.rafId)cancelAnimationFrame(touchDrag.rafId);
        document.removeEventListener("touchend",touchDrag.docEnd);
        document.removeEventListener("touchcancel",touchDrag.docCancel);
        card.classList.remove("drag-active");
        card.style.position="";
        const{cardEls,dragIndex,curIndex}=touchDrag;
        touchDrag=null;
        clearDragStyles(itemsContainer);
        const changed=dragIndex!==curIndex;
        if(commit&&changed){
          const finalEls=[...cardEls];
          const[moved]=finalEls.splice(dragIndex,1);
          finalEls.splice(curIndex,0,moved);
          // Update the in-memory order FIRST and re-render synchronously — the
          // DOM was deliberately left in the old order during the drag, so
          // rendering before the (async) DB write is what prevents a visible
          // snap-back to the old order while the write is in flight.
          finalEls.forEach((elm,i)=>{
            const id=elm.dataset.itemId;
            const entry=items.find(([eid])=>eid===id);
            if(entry)entry[1].order=i+1;
            // If a fresher items array arrived mid-drag, mirror the order there
            // too so the deferred re-render below agrees with the drop.
            if(currentItems!==items){const ce=currentItems.find(([eid])=>eid===id);if(ce)ce[1].order=i+1;}
          });
          renderItemsList(c,whId,pendingListRender?currentItems:items,wrap);
          pendingListRender=false;
          const updates={};
          finalEls.forEach((elm,i)=>{updates[`items/${elm.dataset.itemId}/order`]=i+1});
          // Without this, a warehouse whose default sort is alpha/qty re-sorts
          // on every other device and the manual order is silently invisible
          // there (and here too, after leaving and re-entering the list).
          updates["sortMode"]="manual";
          if(currentWhData)currentWhData.sortMode="manual";
          await dbUpdate(`warehouses/${whId}`,updates);
        }else{
          renderItemsList(c,whId,pendingListRender?currentItems:items,wrap);
          pendingListRender=false;
        }
      };
      handle.addEventListener("touchend",()=>finishTouchDrag(true));
      handle.addEventListener("touchcancel",()=>finishTouchDrag(false));
    }

    const info=el("div",{className:"item-info",style:{flex:"1",minWidth:"0"}});
    info.appendChild(el("div",{className:"item-name",style:{fontSize:"16px",fontWeight:"500",marginBottom:"2px"}},item.name));
    if(currentWhData?.features?.showSku!==false&&item.sku)info.appendChild(el("div",{className:"item-sku",style:{fontSize:"11px",color:"var(--text-muted)",marginBottom:"2px"}},`מק"ט: ${item.sku}`));
    if(item.note){info.appendChild(el("div",{className:"note-text item-note"},item.note))}
    const qr=el("div",{className:"item-qty-row",style:{display:"flex",alignItems:"center",gap:"8px",marginTop:"4px"}});
    qr.appendChild(el("span",{className:"item-qty",style:{fontSize:"24px",fontWeight:"700",fontVariantNumeric:"tabular-nums",color:qtyColor(item)}},String(item.quantity||0)));
    qr.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-muted)"}},"יחידות"));
    const chip=stockChip(item);if(chip)qr.appendChild(chip);
    info.appendChild(qr);

    const actions=el("div",{style:{display:"flex",gap:"2px",alignItems:"center",flexShrink:"0",marginRight:"8px"}});
    if(!reorderMode){
      const canEdit=memberCan('edit');
      const sb=el("button",{className:"qty-btn qty-btn-sub",style:{width:"36px",height:"36px"},onClick:()=>showAdjustModal(wrap,whId,itemId,item,"remove")});sb.appendChild(icon("minus",18));
      const ab=el("button",{className:"qty-btn qty-btn-add",style:{width:"36px",height:"36px"},onClick:()=>showAdjustModal(wrap,whId,itemId,item,"add")});ab.appendChild(icon("plus",18));
      const mb=el("button",{className:"icon-btn",style:{color:"var(--text-muted)",padding:"6px"},onClick:async()=>{
        // Cards update in place without rebuilding, so the closure's `item` can be
        // stale (e.g. built from image-stripped cache) — refresh from currentItems.
        {
          const fresh=currentItems.find(([id])=>id===itemId);
          if(fresh)item=fresh[1];
          const mainOpts=[];
          if(canEdit)mainOpts.push({label:"עריכה",value:"edit"});
          mainOpts.push({label:"היסטוריה",value:"history"});
          if(memberCan('reset')&&(item.quantity||0)>0)mainOpts.push({label:"אפס כמות ל-0",style:"danger",value:"reset"});
          if(canEdit)mainOpts.push({label:`מחק "${item.name}"`,style:"danger",value:"delete"});
          const choice=await showActionSheet(mainOpts,item.name);
          if(!choice)return; // closed

          if(choice==="edit"){
            showEditItemModal(wrap,whId,itemId,item);return;
          }else if(choice==="history"){
            showHistoryModal(wrap,item);return;
          }else if(choice==="reset"){
            const prevQ=item.quantity||0;
            await dbUpdate(`warehouses/${whId}`,{
              [`items/${itemId}/quantity`]:0,
              [`items/${itemId}/history/${genId()}`]:{action:"איפוס",amount:prevQ,result:0,by:currentUser.displayName,date:new Date().toISOString()}
            });
            item.quantity=0;
            showUndoToast(`הכמות של "${item.name}" אופסה`,async()=>{
              await dbUpdate(`warehouses/${whId}`,{
                [`items/${itemId}/quantity`]:prevQ,
                [`items/${itemId}/history/${genId()}`]:{action:"שחזור",amount:prevQ,result:prevQ,by:currentUser.displayName,date:new Date().toISOString()}
              });
            });
            // menu closes — the undo toast is now the follow-up UI
          }else if(choice==="delete"){
            showDeleteModal(wrap,`למחוק את "${item.name}"?`,async()=>{
              // Snapshot BEFORE deleting (including the full-size image, which
              // lives outside the item) so undo can restore everything.
              const snapshot=JSON.parse(JSON.stringify(item));
              let fullImg=null;try{fullImg=await dbGet(`itemImages/${whId}/${itemId}`)}catch(e){}
              await dbRemove(`warehouses/${whId}/items/${itemId}`);
              await dbRemove(`itemImages/${whId}/${itemId}`);
              showUndoToast(`"${item.name}" נמחק`,async()=>{
                await dbSet(`warehouses/${whId}/items/${itemId}`,snapshot);
                if(fullImg)await dbSet(`itemImages/${whId}/${itemId}`,fullImg);
              });
            });
            return;
          }
        }
      }});
      mb.appendChild(icon("more",18));
      actions.append(mb,sb,ab);
    }
    // Image slot always reserved when feature on — keeps text at uniform position
    if(currentWhData?.features?.showImages!==false&&!reorderMode){
      const slot=el("div",{className:"item-img-slot"});
      const thumbSrc=item.thumb||item.image;
      if(thumbSrc){const t=el("img",{className:"item-thumb",src:thumbSrc,onClick:async()=>showImageViewer(await fetchFullImage(whId,itemId,item))});slot.appendChild(t);}
      card.append(info,slot,actions);
    }else{
      card.append(info,actions);
    }
    itemsContainer.appendChild(card);
  });
  listContainer.appendChild(itemsContainer);
}

// ═══════════ IMAGE HELPERS ═══════════
// Full-size images are stored separately at itemImages/{whId}/{itemId} (NOT inside
// the warehouse/items tree) so opening a warehouse only downloads small thumbnails.
// The full image is fetched on demand only when someone actually opens the viewer.
function encodeImageVariants(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      function toDataUrl(maxPx,quality){
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        return canvas.toDataURL('image/jpeg',quality);
      }
      cb({full:toDataUrl(800,0.72),thumb:toDataUrl(160,0.55)});
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function makeThumbFromDataUrl(dataUrl,maxPx,quality,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    cb(canvas.toDataURL('image/jpeg',quality));
  };
  img.src=dataUrl;
}
// Returns the full-resolution image for viewing. Legacy items (from before this
// change) still carry it inline as item.image; newer items keep it at itemImages/.
async function fetchFullImage(whId,itemId,item){
  if(item.image)return item.image;
  const full=await dbGet(`itemImages/${whId}/${itemId}`);
  return full||item.thumb||null;
}
// One-time background migration: moves any old inline item.image out to itemImages/
// and leaves a small item.thumb behind, so the item stops being part of every
// warehouse load. Naturally stops repeating once item.image is cleared.
const migratingItemImages=new Set();
async function migrateLegacyItemImages(whId,items){
  for(const[itemId,item] of items){
    // Any inline image gets moved out — including copied items that already
    // arrive with a thumb (their existing thumb is reused as-is).
    if(!item.image)continue;
    const key=whId+"/"+itemId;
    if(migratingItemImages.has(key))continue;
    migratingItemImages.add(key);
    try{
      const thumb=item.thumb||await new Promise(res=>makeThumbFromDataUrl(item.image,160,0.55,res));
      await dbSet(`itemImages/${whId}/${itemId}`,item.image);
      await dbUpdate(`warehouses/${whId}`,{[`items/${itemId}/thumb`]:thumb,[`items/${itemId}/image`]:null});
    }catch(e){/* leave it; will retry on next load */}
    finally{migratingItemImages.delete(key)}
  }
}

function showImageViewer(imgData){
  const ov=el('div',{style:{position:'fixed',inset:'0',zIndex:'5000',background:'rgba(0,0,0,0.96)',display:'flex',alignItems:'center',justifyContent:'center'},onClick:()=>ov.remove()});
  const img=el('img',{src:imgData,style:{maxWidth:'92vw',maxHeight:'88vh',borderRadius:'14px',objectFit:'contain',boxShadow:'0 20px 60px rgba(0,0,0,0.6)'}});
  const closeHint=el('div',{style:{position:'absolute',bottom:'24px',left:'0',right:'0',textAlign:'center',fontSize:'13px',color:'rgba(255,255,255,0.4)'}},'הקש לסגירה');
  ov.append(img,closeHint);document.body.appendChild(ov);
}

// ═══════════ MODALS ═══════════
function showActionSheet(items,title){
  return new Promise(resolve=>{
    const ov=el("div",{className:"action-sheet-overlay",onClick:e=>{if(e.target===ov){ov.remove();resolve(null)}}});
    const mainGroup=el("div",{className:"action-sheet-group"});
    if(title){
      const hdr=el("div",{style:{padding:"14px 20px 10px",textAlign:"center",borderBottom:"0.5px solid rgba(255,255,255,0.11)"}});
      hdr.appendChild(el("span",{style:{fontSize:"13px",color:"rgba(255,255,255,0.45)",fontWeight:"500"}},title));
      mainGroup.appendChild(hdr);
    }
    items.forEach(({label,style:s,value})=>{
      const btn=el("button",{className:"action-sheet-item"+(s==='danger'?' danger':''),onClick:()=>{ov.remove();resolve(value)}},label);
      mainGroup.appendChild(btn);
    });
    const cancelGroup=el("div",{className:"action-sheet-cancel-group"});
    const cancelBtn=el("button",{className:"action-sheet-cancel",onClick:()=>{ov.remove();resolve(null)}},"ביטול");
    cancelGroup.appendChild(cancelBtn);
    ov.appendChild(mainGroup);ov.appendChild(cancelGroup);
    document.body.appendChild(ov);
  });
}

function showModal(parent,builder){
  const ov=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===ov)ov.remove()}});
  const m=el("div",{className:"modal"});builder(m,()=>ov.remove());ov.appendChild(m);parent.appendChild(ov);
}

function showNewListModal(parent){
  showModal(parent,(m,close)=>{

function showAdjustModal(parent,whId,itemId,item,mode){
  showModal(parent,(m,close)=>{
    let cm=mode;
    m.appendChild(el("h3",{},cm==="add"?"הוסף כמות":"הורד כמות"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"20px"}},`${item.name} — כרגע: ${item.quantity||0}`));
    const tg=el("div",{className:"toggle-group"});
    const ap=el("button",{className:`toggle-pill ${cm==="add"?"active-add":""}`,onClick:()=>{cm="add";ap.className="toggle-pill active-add";sp.className="toggle-pill";up()}},"הוספה +");
    const sp=el("button",{className:`toggle-pill ${cm==="remove"?"active-sub":""}`,onClick:()=>{cm="remove";sp.className="toggle-pill active-sub";ap.className="toggle-pill";up()}},"הורדה −");
    tg.append(ap,sp);m.appendChild(tg);
    const qi=el("input",{className:"app-input",type:"number",inputMode:"numeric",placeholder:"הכנס כמות"});m.appendChild(qi);
    const pv=el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginTop:"10px",textAlign:"center",minHeight:"20px"}});m.appendChild(pv);
    function up(){const a=parseInt(qi.value);if(!a||a<=0){pv.textContent="";return}const c=item.quantity||0;const r=cm==="add"?c+a:Math.max(0,c-a);pv.innerHTML=`${c} ${cm==="add"?"+":"−"} ${a} = <span style="color:var(--accent);font-weight:600">${r}</span>`}
    qi.addEventListener("input",up);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const ab=el("button",{className:`btn ${cm==="add"?"btn-success":"btn-danger"}`,style:{flex:"1"},onClick:async()=>{
      const a=parseInt(qi.value);if(!a||a<=0)return;ab.disabled=true;
      // Atomic adjust: quantity is written as a server-side increment, and the
      // history entry rides in the SAME update — two users adjusting at once
      // can no longer overwrite each other (the old read-then-set flow could).
      // The fresh read only clamps removals at zero and estimates the result
      // for the history line.
      const freshItem=await dbGet(`warehouses/${whId}/items/${itemId}`);
      const c=freshItem?freshItem.quantity||0:item.quantity||0;
      const delta=cm==="add"?a:-Math.min(a,c);
      if(delta===0){close();return}
      const nq=Math.max(0,c+delta);
      await dbUpdate(`warehouses/${whId}`,{
        [`items/${itemId}/quantity`]:FB.increment(delta),
        [`items/${itemId}/history/${genId()}`]:{action:cm==="add"?"הוספה":"הורדה",amount:Math.abs(delta),result:nq,by:currentUser.displayName,date:new Date().toISOString()}
      });
      close();
    }},cm==="add"?"הוסף":"הורד");btns.appendChild(ab);m.appendChild(btns);
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click()});setTimeout(()=>qi.focus(),100);
  });
}

function showEditItemModal(parent,whId,itemId,item){

    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},item.name));

    // Image row — staged locally, written to Firebase only on save.
    // pendingThumb is what shows in the small preview slot; pendingFull is the new
    // full-res photo (only set when the user actually picks a new one).
    let pendingThumb=item.thumb||item.image||null;
    let pendingFull=null;
    let imageChanged=false;
    const imgRow=el("div",{style:{display:"flex",alignItems:"center",gap:"12px",marginBottom:"14px"}});
    const imgSlot=el("div",{style:{width:"64px",height:"64px",borderRadius:"12px",border:"1px solid var(--border)",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:"0",cursor:"pointer",color:"var(--text-muted)"}});
    const imgBtns=el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
    const fileInput=el("input",{type:"file",accept:"image/*",style:{display:"none"}});
    const pickBtn=el("button",{className:"btn btn-ghost btn-sm",style:{fontSize:"13px",padding:"7px 14px"},onClick:()=>fileInput.click()});
    const delImgBtn=el("button",{className:"btn btn-ghost btn-sm",style:{fontSize:"13px",padding:"7px 14px",color:"var(--danger)",borderColor:"rgba(255,92,92,.3)"},onClick:async()=>{
      const c=await showActionSheet([{label:"הסר תמונה",style:"danger",value:"confirm"}],"להסיר את התמונה? היא תימחק בשמירה");
      if(c!=="confirm")return;
      pendingThumb=null;pendingFull=null;imageChanged=true;refreshImgUI();
    }},"הסר");
    function refreshImgUI(){
      imgSlot.innerHTML="";
      if(pendingThumb)imgSlot.appendChild(el("img",{src:pendingThumb,style:{width:"100%",height:"100%",objectFit:"cover"}}));
      else imgSlot.appendChild(icon("camera",26));
      pickBtn.textContent=pendingThumb?"החלף תמונה":"הוסף תמונה";
      delImgBtn.style.display=pendingThumb?"":"none";
    }
    imgSlot.addEventListener("click",async()=>{
      if(!pendingThumb){fileInput.click();return}
      if(imageChanged)showImageViewer(pendingFull||pendingThumb);
      else showImageViewer(await fetchFullImage(whId,itemId,item));
    });
    fileInput.addEventListener("change",e=>{
      const file=e.target.files[0];if(!file)return;
      encodeImageVariants(file,({full,thumb})=>{
        pendingFull=full;pendingThumb=thumb;imageChanged=true;refreshImgUI();
      });
      fileInput.value="";
    });
    refreshImgUI();
    imgBtns.append(pickBtn,delImgBtn);
    imgRow.append(imgSlot,imgBtns);
    m.append(imgRow,fileInput);

    const ni=el("input",{className:"app-input",placeholder:"שם הפריט",style:{marginBottom:"12px"}});
    ni.value=item.name;
    const qi=el("input",{className:"app-input",placeholder:"כמות",type:"number",inputMode:"numeric",style:{marginBottom:"12px"}});
    qi.value=item.quantity||0;
    const lowInput=el("input",{className:"app-input",placeholder:"סף התראת מלאי נמוך (אופציונלי)",type:"number",inputMode:"numeric",style:{marginBottom:"12px"}});
    lowInput.value=item.lowStock||"";
    const skuInput=el("input",{className:"app-input",placeholder:'מק"ט (אופציונלי)',inputMode:"numeric",pattern:"[0-9]*",autocapitalize:"off",style:{marginBottom:"12px"}});
    skuInput.value=item.sku||"";
    const noteInput=el("textarea",{className:"app-input",placeholder:"הערה (אופציונלי)",rows:"2"});
    noteInput.value=item.note||"";
    m.append(ni,qi,lowInput,skuInput,noteInput);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"20px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const sb=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const name=ni.value.trim();if(!name)return;sb.disabled=true;
      const upd={
        [`items/${itemId}/name`]:name,
        [`items/${itemId}/sku`]:skuInput.value.trim()||null,
        [`items/${itemId}/note`]:noteInput.value.trim()||null,
        [`items/${itemId}/lowStock`]:parseInt(lowInput.value)>0?parseInt(lowInput.value):null,
      };
      if(imageChanged){upd[`items/${itemId}/thumb`]=pendingThumb;upd[`items/${itemId}/image`]=null;}
      const nq=parseInt(qi.value);
      if(!isNaN(nq)&&nq>=0&&nq!==(item.quantity||0)){
        upd[`items/${itemId}/quantity`]=nq;
        upd[`items/${itemId}/history/${genId()}`]={action:"עריכה",amount:Math.abs(nq-(item.quantity||0)),result:nq,by:currentUser.displayName,date:new Date().toISOString()};
      }
      await dbUpdate(`warehouses/${whId}`,upd);
      if(imageChanged){
        if(pendingFull)await dbSet(`itemImages/${whId}/${itemId}`,pendingFull);
        else await dbRemove(`itemImages/${whId}/${itemId}`);
      }
      close();
    }},"שמור");
    btns.appendChild(sb);m.appendChild(btns);
    ni.addEventListener("keydown",e=>{if(e.key==="Enter")qi.focus()});
    qi.addEventListener("keydown",e=>{if(e.key==="Enter")lowInput.focus()});
    lowInput.addEventListener("keydown",e=>{if(e.key==="Enter")skuInput.focus()});
    skuInput.addEventListener("keydown",e=>{if(e.key==="Enter")sb.click()});
    setTimeout(()=>{ni.focus();ni.select()},100);
  });
}

function showWarehouseSettingsModal(parent,whId,wh){
  const isAdmin=userWarehouseRole==='owner'||userWarehouseRole==='admin';
  showModal(parent,(m,close)=>{
    m.style.maxHeight='none';m.style.overflow='visible';
    m.appendChild(el("h3",{style:{marginBottom:"12px"}},"הגדרות מחסן"));

    const panelWrap=el("div",{style:{maxHeight:"48vh",minHeight:"240px",overflowY:"auto",direction:"ltr"}});

      panelEls[t]=panel;panelWrap.appendChild(panel);
      const btn=el("button",{className:"tab-btn"+(i===0?' active':''),onClick:()=>{
        Object.values(panelEls).forEach(p=>p.style.display='none');
        panel.style.display='block';
        tabBar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      }},t);
      tabBar.appendChild(btn);
    });
    m.appendChild(tabBar);m.appendChild(panelWrap);

    // ── חברים ──
    const mp=panelEls['חברים'];
    function refreshMembers(){
      mp.innerHTML='';
      const members=wh.members?Object.keys(wh.members):[];
      // Join-QR access from settings — straight to the fullscreen view.
      const addQrBtn=()=>{
        if(!(isAdmin||!(wh.permissions&&wh.permissions.restrict_share)))return;
        const qb=el("button",{className:"btn btn-ghost",style:{width:"100%",margin:"10px 0 2px"},onClick:async()=>{
          qb.disabled=true;
          try{
            let token=wh.inviteToken;
            if(!token){token=genId()+genId();await dbSet(`warehouses/${whId}/inviteToken`,token);wh.inviteToken=token}
            await loadQRLib();
            showQRViewer(`${APP_URL}#join=${whId}.${token}`);
          }catch(e){showNotice("שגיאה בטעינת הקוד — נסה שוב")}
          qb.disabled=false;
        }},"קוד QR להצטרפות");
        mp.appendChild(qb);
      };
      if(!isAdmin)addQrBtn();
      if(isAdmin){
        const addRow=el("div",{style:{display:"flex",gap:"8px"}});
        const inp=el("input",{className:"app-input",placeholder:"שם משתמש להוספה",style:{flex:"1"},autocapitalize:"off"});
        const err=el("p",{style:{color:"var(--danger)",fontSize:"12px",marginTop:"6px",minHeight:"16px"}});
        const addBtn=el("button",{className:"btn btn-primary",style:{whiteSpace:"nowrap"},onClick:async()=>{
          const target=inp.value.trim().toLowerCase();if(!target)return;
          const mems=wh.members?Object.keys(wh.members):[];
          if(mems.includes(target)){err.textContent="כבר חבר";return}
          addBtn.disabled=true;err.textContent='';
          let tu=null;try{tu=await dbGet(`usernames/${target}`)}catch(e){}
          if(!tu){err.textContent="משתמש לא נמצא";addBtn.disabled=false;return}
          await dbSet(`warehouses/${whId}/members/${target}`,true);
          await dbSet(`users/${target}/warehouses/${whId}`,Date.now());
          if(!wh.members)wh.members={};wh.members[target]=true;
          inp.value='';addBtn.disabled=false;refreshMembers();
        }},"הוסף");
        addRow.append(inp,addBtn);
        mp.appendChild(addRow);mp.appendChild(err);
        inp.addEventListener("keydown",e=>{if(e.key==="Enter")addBtn.click()});
        addQrBtn();
        mp.appendChild(el("div",{style:{borderTop:"1px solid var(--border)",margin:"12px 0 10px"}}));
      }
      members.forEach(u=>{
        const isOwner=u===wh.owner;

        } else if(isAdmin&&u!==currentUser.username){
          // Role badge (tappable → action sheet)

            fontSize:"12px",padding:"4px 12px",borderRadius:"20px",border:"1px solid",cursor:"pointer",fontWeight:"500",
            background:isCurrentlyAdmin?"rgba(52,211,153,0.12)":"transparent",

              isCurrentlyAdmin

                :{label:'הפוך למנהל',value:'promote'},
            ];
            if(userWarehouseRole==='owner')sheetOpts.push({label:'העבר בעלות',value:'transfer'});
            sheetOpts.push({label:'הסר מהמחסן',style:'danger',value:'remove'});

              await dbSet(`warehouses/${whId}/roles/${u}`,'admin');
              if(!wh.roles)wh.roles={};wh.roles[u]='admin';refreshMembers();
            }else if(choice==='demote'){
              await dbRemove(`warehouses/${whId}/roles/${u}`);
              if(!wh.roles)wh.roles={};delete wh.roles[u];refreshMembers();
            }else if(choice==='transfer'){
              const c2=await showActionSheet([
                {label:`העבר בעלות ל-${u} והישאר חבר`,value:'stay'},
                {label:`העבר בעלות ל-${u} ועזוב`,style:'danger',value:'leave'},
              ],`העבר בעלות ל-${u}?`);
              if(c2==='stay'||c2==='leave'){
                await dbSet(`warehouses/${whId}/owner`,u);
                if(c2==='leave'){
                  await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
                  await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
                  close();renderHome();
                }else{
                  wh.owner=u;userWarehouseRole='member';refreshMembers();
                }
              }
            }else if(choice==='remove'){
              await dbRemove(`warehouses/${whId}/members/${u}`);
              await dbRemove(`users/${u}/warehouses/${whId}`);
              await dbRemove(`warehouses/${whId}/roles/${u}`);
              if(wh.members)delete wh.members[u];
              if(wh.roles)delete wh.roles[u];refreshMembers();
            }
          }},isCurrentlyAdmin?'מנהל ▾':'חבר ▾');
          acts.appendChild(roleBadge);
        } else if(isCurrentlyAdmin){
          acts.appendChild(el("span",{style:{fontSize:"12px",color:"var(--success)",background:"rgba(52,211,153,0.12)",padding:"4px 10px",borderRadius:"20px",fontWeight:"500"}},"מנהל"));
        } else if(!isAdmin&&u===currentUser.username){
          const leaveBtn=el("button",{className:"btn btn-danger btn-sm",style:{fontSize:"12px"},onClick:async()=>{
            await dbRemove(`warehouses/${whId}/members/${u}`);
            await dbRemove(`users/${u}/warehouses/${whId}`);
            close();renderHome();
          }},"עזוב");
          acts.appendChild(leaveBtn);
        } else {
          acts.appendChild(el("span",{style:{fontSize:"12px",color:"var(--text-muted)",padding:"4px 10px"}},"חבר"));
        }
        row.appendChild(acts);
        mp.appendChild(row);
      });
    }
    refreshMembers();

    // ── הרשאות ──
    if(isAdmin&&panelEls['הרשאות']){
      const pp=panelEls['הרשאות'];
      pp.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"4px"}},"הגבלות על חברים רגילים — לא חלות על בעלים ומנהלים:"));
      const perms=wh.permissions||{};
      const permDefs=[
        {key:'restrict_add',label:'מנע הוספת פריטים לחברים'},
        {key:'restrict_reset',label:'מנע איפוס כמויות לחברים'},
        {key:'restrict_edit',label:'מנע עריכה ומחיקה לחברים'},
        {key:'restrict_share',label:'מנע שיתוף וצירוף חברים לחברים'},
        {key:'restrict_code_renew',label:'מנע חידוש קוד הצטרפות לחברים'},
      ];
      permDefs.forEach(({key,label})=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid var(--border)"}});
        row.appendChild(el("span",{style:{fontSize:"14px"}},label));
        const tog=el("button",{style:{
          width:"44px",height:"24px",borderRadius:"12px",border:"none",cursor:"pointer",
          background:perms[key]?"var(--danger)":"var(--border)",transition:"background .2s",position:"relative",flexShrink:"0"
        },onClick:async()=>{
          const cur=!!perms[key];
          await dbUpdate(`warehouses/${whId}`,{[`permissions/${key}`]:!cur});
          perms[key]=!cur;
          tog.style.background=perms[key]?"var(--danger)":"var(--border)";
          knob.style.right=perms[key]?"2px":"";knob.style.left=perms[key]?"":"2px";
        }});
        const knob=el("div",{style:{
          position:"absolute",width:"20px",height:"20px",borderRadius:"50%",background:"#fff",
          top:"2px",transition:"left .2s, right .2s",
          ...(perms[key]?{right:"2px"}:{left:"2px"})
        }});
        tog.appendChild(knob);row.appendChild(tog);
        pp.appendChild(row);
      });
    }

    // ── תצוגה ──
    if(isAdmin&&panelEls['תצוגה']){
      const dp=panelEls['תצוגה'];
      dp.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"4px"}},"מה יוצג על כרטיסי הפריטים:"));
      const features=wh.features||{};
      function makeDisplayToggle(label,featKey,defaultOn){
        const on=features[featKey]!==false;
        const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid var(--border)"}});
        row.appendChild(el("span",{style:{fontSize:"14px"}},label));
        const tog=el("button",{style:{width:"44px",height:"24px",borderRadius:"12px",border:"none",cursor:"pointer",background:on?"var(--accent)":"var(--border)",transition:"background .2s",position:"relative",flexShrink:"0"}
        ,onClick:async()=>{
          const next=features[featKey]===false;
          await dbUpdate(`warehouses/${whId}`,{[`features/${featKey}`]:next});
          features[featKey]=next;
          if(!wh.features)wh.features={};wh.features[featKey]=next;
          if(currentWhData){if(!currentWhData.features)currentWhData.features={};currentWhData.features[featKey]=next;}
          tog.style.background=next?"var(--accent)":"var(--border)";
          knob.style.right=next?"2px":"";knob.style.left=next?"":"2px";
        }});
        const knob=el("div",{style:{position:"absolute",width:"20px",height:"20px",borderRadius:"50%",background:"#fff",top:"2px",transition:"left .2s, right .2s",...(on?{right:"2px"}:{left:"2px"})}});
        tog.appendChild(knob);row.appendChild(tog);dp.appendChild(row);
      }
      makeDisplayToggle('הצג מק"ט על פריטים','showSku');
      makeDisplayToggle('הצג תמונות על פריטים','showImages');
    }

    // ── סידור ──
    if(isAdmin&&panelEls['סידור']){
      const sp=panelEls['סידור'];
      const curSort=wh.sortMode||'manual';
      const sortOpts=[
        {val:'manual',label:'ידני (גרירה)'},
        {val:'alpha',label:'א-ב (אלפביתי)'},
        {val:'qty-desc',label:'כמות: גבוה לנמוך'},
        {val:'qty-asc',label:'כמות: נמוך לגבוה'},

      sp.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"12px"}},"ברירת מחדל לסידור פריטים:"));
      sortOpts.forEach(({val,label})=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"10px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"},onClick:async()=>{
          await dbSet(`warehouses/${whId}/sortMode`,val);
          wh.sortMode=val;
          sp.querySelectorAll('.sort-chk').forEach(c=>c.textContent='');
          row.querySelector('.sort-chk').textContent='✓';
        }});
        const chk=el("span",{className:"sort-chk",style:{color:"var(--accent)",fontWeight:"700",width:"16px",display:"inline-block"}},(wh.sortMode||'manual')===val?'✓':'');
        row.appendChild(chk);row.appendChild(el("span",{style:{fontSize:"14px"}},label));
        sp.appendChild(row);
      });
    }

    m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%",marginTop:"16px"},onClick:close},"סגור"));
  });
}

function showShareModal(parent,whId,wh){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"שיתוף מחסן"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"12px"}},`שתף את "${wh.name}" — שינויים יתעדכנו אצל כולם`));
    const members=wh.members?Object.keys(wh.members):[];
    const isOwner=wh.owner===currentUser.username;

    if(members.length>0){
      const ml=el("div",{style:{marginBottom:"16px"}});
      ml.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-muted)",marginBottom:"6px"}},"חברים:"));
      const chipsList=el("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
      members.forEach(u=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 10px",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"10px"}});
        const isMe=u===currentUser.username;
        const isThisOwner=u===wh.owner;
        const label=el("div",{style:{display:"flex",alignItems:"center",gap:"6px"}});
        label.appendChild(el("span",{style:{fontSize:"13px",color:"var(--text-sec)"}},u));
        if(isMe)label.appendChild(el("span",{style:{fontSize:"11px",color:"var(--accent)"}},"(אתה)"));
        if(isThisOwner)label.appendChild(el("span",{style:{fontSize:"11px",color:"var(--warning)"}},"(בעלים)"));
        row.appendChild(label);

        // Owner can remove others or transfer ownership, non-owner can leave
        if(isOwner&&!isMe){
          const btnsRow=el("div",{style:{display:"flex",gap:"4px"}});
          const transferBtn=el("button",{className:"btn btn-sm",style:{padding:"4px 8px",fontSize:"11px",background:"var(--warning)",color:"#000",border:"none"},onClick:async()=>{
            const c2=await showActionSheet([
              {label:`העבר בעלות ל-${u} והישאר חבר`,value:'stay'},
              {label:`העבר בעלות ל-${u} ועזוב`,style:'danger',value:'leave'},
            ],`העבר בעלות ל-${u}?`);
            if(!c2)return;
            await dbSet(`warehouses/${whId}/owner`,u);
            if(c2==='leave'){
              await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
              await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
              close();renderHome();
            }else{
              close();
            }
          }},"העבר בעלות");
          const removeBtn=el("button",{className:"btn btn-danger btn-sm",style:{padding:"4px 10px",fontSize:"12px"},onClick:async()=>{
            await dbRemove(`warehouses/${whId}/members/${u}`);
            await dbRemove(`users/${u}/warehouses/${whId}`);
            close();
          }},"הסר");
          btnsRow.append(transferBtn,removeBtn);
          row.appendChild(btnsRow);
        }
        chipsList.appendChild(row);
      });
      ml.appendChild(chipsList);

      // Leave button for non-owners
      if(!isOwner){
        const leaveBtn=el("button",{className:"btn btn-danger",style:{width:"100%",marginTop:"12px"},onClick:async()=>{
          await dbRemove(`warehouses/${whId}/members/${currentUser.username}`);
          await dbRemove(`users/${currentUser.username}/warehouses/${whId}`);
          close();renderHome();
        }},"עזוב מחסן");
        ml.appendChild(leaveBtn);
      }
      m.appendChild(ml);
    }

    // ── Join-by-QR ──
    const qrBtn=el("button",{className:"btn btn-ghost",style:{width:"100%",marginBottom:"14px"},onClick:async()=>{
      qrBtn.disabled=true;qrBtn.textContent="טוען...";
      try{
        let token=wh.inviteToken;
        if(!token){token=genId()+genId();await dbSet(`warehouses/${whId}/inviteToken`,token);wh.inviteToken=token}
        await loadQRLib();
        const joinUrl=`${APP_URL}#join=${whId}.${token}`;
        qrBtn.style.display="none";
        qrWrap.style.display="";
        qrBox.innerHTML="";
        new QRCode(qrBox,{text:joinUrl,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
        qrWrap.dataset.url=joinUrl;
      }catch(e){qrBtn.disabled=false;qrBtn.textContent="קוד QR להצטרפות";showNotice("שגיאה בטעינת הקוד — נסה שוב")}
    }},"קוד QR להצטרפות");
    m.appendChild(qrBtn);
    const qrWrap=el("div",{style:{display:"none",textAlign:"center",marginBottom:"14px"}});
    const qrBox=el("div",{style:{background:"#fff",borderRadius:"12px",padding:"12px",display:"inline-block",cursor:"pointer"},onClick:()=>{if(qrWrap.dataset.url)showQRViewer(qrWrap.dataset.url)}});
    qrWrap.appendChild(qrBox);
    qrWrap.appendChild(el("p",{style:{fontSize:"12px",color:"var(--text-sec)",marginTop:"8px"}},"סריקה עם מצלמת הטלפון מצרפת למחסן · הקש על הקוד להגדלה"));
    const qrActions=el("div",{style:{display:"flex",gap:"6px",marginTop:"8px",justifyContent:"center"}});
    const copyLinkBtn=el("button",{className:"toolbar-btn",onClick:async()=>{
      try{await navigator.clipboard.writeText(qrWrap.dataset.url);copyLinkBtn.textContent="הועתק!";setTimeout(()=>{copyLinkBtn.textContent="העתק קישור"},1500)}catch(e){}
    }},"העתק קישור");
    const shareLinkBtn=el("button",{className:"toolbar-btn",onClick:async()=>{
      if(navigator.share){try{await navigator.share({text:`הצטרף למחסן "${wh.name}" באפליקציית ניהול מלאי:\n${qrWrap.dataset.url}`})}catch(e){}}
      else copyLinkBtn.click();
    }},"שתף");
    const isAdminInWh=wh.owner===currentUser.username||(wh.roles&&wh.roles[currentUser.username]==='admin');
    const canRenewCode=isAdminInWh||!(wh.permissions&&wh.permissions.restrict_code_renew);
    const renewBtn=el("button",{className:"toolbar-btn danger-hover",style:{display:canRenewCode?"":"none"},onClick:async()=>{
      const c=await showActionSheet([{label:"צור קוד חדש (הקודים הישנים יפסיקו לעבוד)",style:"danger",value:"ok"}]);
      if(c!=="ok")return;
      const token=genId()+genId();
      await dbSet(`warehouses/${whId}/inviteToken`,token);
      wh.inviteToken=token;
      const joinUrl=`${APP_URL}#join=${whId}.${token}`;
      qrBox.innerHTML="";
      new QRCode(qrBox,{text:joinUrl,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
      qrWrap.dataset.url=joinUrl;
      showNotice("נוצר קוד חדש");
    }},"חדש קוד");
    qrActions.append(copyLinkBtn,shareLinkBtn,renewBtn);
    qrWrap.appendChild(qrActions);
    m.appendChild(qrWrap);

    const ui=el("input",{className:"app-input",placeholder:"שם משתמש להוספה",autocapitalize:"off"});m.appendChild(ui);
    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",marginTop:"8px",minHeight:"20px"}});
    const suc=el("p",{style:{color:"var(--success)",fontSize:"13px",marginTop:"4px",minHeight:"20px"}});
    m.append(err,suc);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"סגור"));
    const sb=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const target=ui.value.trim().toLowerCase();if(!target)return;
      if(target===currentUser.username){err.textContent="אי אפשר לשתף עם עצמך";return}
      if(members.includes(target)){err.textContent="כבר חבר במחסן";return}
      sb.disabled=true;err.textContent="";suc.textContent="";
      let tu=null;try{tu=await dbGet(`usernames/${target}`)}catch(e){}
      if(!tu){err.textContent="משתמש לא נמצא";sb.disabled=false;return}
      await dbSet(`warehouses/${whId}/members/${target}`,true);
      await dbSet(`users/${target}/warehouses/${whId}`,Date.now());
      // Reopen the modal so the member list actually shows the new member
      // (it used to stay stale until the modal was closed and reopened).
      if(!wh.members)wh.members={};wh.members[target]=true;
      close();showShareModal(parent,whId,wh);
    }},"הוסף");btns.appendChild(sb);m.appendChild(btns);
    ui.addEventListener("keydown",e=>{if(e.key==="Enter")sb.click()});setTimeout(()=>ui.focus(),100);
  });
}

function showCopyWarehouseModal(parent,whId,wh){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"שלח עותק מחסן"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},`שלח עותק של "${wh.name}" למשתמש אחר — המחסן שלך לא ישתנה.`));
    const inp=el("input",{className:"app-input",placeholder:"שם משתמש",autocapitalize:"off",style:{marginBottom:"8px"}});
    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"20px"}});
    const suc=el("p",{style:{color:"var(--success)",fontSize:"13px",minHeight:"20px"}});
    m.append(inp,err,suc);
    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול"));
    const sendBtn=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      const target=inp.value.trim().toLowerCase();if(!target)return;
      if(target===currentUser.username){err.textContent="אי אפשר לשלוח לעצמך";return}
      sendBtn.disabled=true;err.textContent="";suc.textContent="";
      let tu=null;try{tu=await dbGet(`usernames/${target}`)}catch(e){}
      if(!tu){err.textContent="משתמש לא נמצא";sendBtn.disabled=false;return}
      sendBtn.textContent="שולח...";
      const newWhId=genId();
      const newItems={};
      if(wh.items){
        for(const[oldId,item]of Object.entries(wh.items)){
          const newId=genId();
          const ni={name:item.name,quantity:item.quantity||0,order:item.order||0,
            history:{[genId()]:{action:"יובא",amount:item.quantity||0,by:currentUser.displayName,date:new Date().toISOString()}}};
          if(item.note)ni.note=item.note;
          if(item.sku)ni.sku=item.sku;
          if(item.thumb)ni.thumb=item.thumb;
          // The full-res image rides along INLINE (the legacy image field): the
          // rules don't let the sender write into the recipient's itemImages/,
          // but the recipient's own app migrates inline images out to
          // itemImages/ automatically the first time they open the warehouse.
          try{
            const full=item.image||await dbGet(`itemImages/${whId}/${oldId}`);
            if(full)ni.image=full;
          }catch(e){}
          newItems[newId]=ni;
        }
      }
      const newWh={name:wh.name,owner:target,members:{[target]:true},createdAt:new Date().toISOString()};
      if(Object.keys(newItems).length>0)newWh.items=newItems;
      await dbSet(`warehouses/${newWhId}`,newWh);
      await dbSet(`users/${target}/warehouses/${newWhId}`,Date.now());
      suc.textContent=`עותק נשלח ל-${target}!`;
      inp.value="";sendBtn.disabled=false;sendBtn.textContent="שלח";
    }},"שלח");
    btns.appendChild(sendBtn);m.appendChild(btns);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")sendBtn.click()});
    setTimeout(()=>inp.focus(),100);
  });
}

function showExportModal(parent,whId,items){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"יצוא רשימה"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",marginBottom:"16px"}},"העתק את הטקסט או שתף אותו"));

    let sorted=[...items].sort((a,b)=>a[1].name.localeCompare(b[1].name,"he"));
    sorted=sorted.filter(([,item])=>(item.quantity||0)>0);
    const hasSku=sorted.some(([,item])=>item.sku);
    const text=sorted.map(([,item])=>{
      let line=`${item.name} (${item.quantity||0})`;
      if(hasSku&&item.sku)line+=` | מק״ט: ${item.sku}`;
      return line;
    }).join("\n");

    const ta=el("textarea",{className:"app-input",rows:"8",style:{direction:"rtl",lineHeight:"1.8",fontSize:"15px"},readonly:"true"});
    ta.value=text;
    m.appendChild(ta);

    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}});
    btns.appendChild(el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"סגור"));

    const copyBtn=el("button",{className:"btn btn-primary",style:{flex:"1"},onClick:async()=>{
      try{
        await navigator.clipboard.writeText(text);
        copyBtn.textContent="הועתק!";copyBtn.style.background="var(--success)";
        setTimeout(()=>{copyBtn.textContent="העתק";copyBtn.style.background="var(--accent)"},1500);
      }catch(e){
        ta.select();document.execCommand("copy");
        copyBtn.textContent="הועתק!";copyBtn.style.background="var(--success)";
        setTimeout(()=>{copyBtn.textContent="העתק";copyBtn.style.background="var(--accent)"},1500);
      }
    }},"העתק");

      }
    }},"שתף");

}

// Parses free-form pasted/typed text (or a loaded CSV/TXT file) into item rows.
// Supports: CSV "שם,כמות,מקט" | "שם (5)" | "שם - 5" | "שם: 5" | "5 שם" | "5x שם" | plain name only.
function parseImportText(text){
  return text.split(/\r?\n/)
    .map(l=>l.trim())
    .filter(l=>l)
    .map(line=>{
      line=line.replace(/^(?:[-*•]|\d+[.)])\s+/,"");
      let name=line,quantity=0,sku="";
      if(line.includes(",")){
        const parts=line.split(",").map(p=>p.trim());
        if(parts.length>=2&&/^\d+$/.test(parts[1])){
          name=parts[0];quantity=parseInt(parts[1]);
          if(parts[2])sku=parts[2];
          return {name,quantity,sku};
        }
      }
      const skuM=line.match(/\|\s*(?:מק"?ט|sku)\s*:?\s*(.+)$/i);
      if(skuM){sku=skuM[1].trim();line=line.slice(0,skuM.index).trim()}
      let m=line.match(/^(.+?)\s*\((\d+)\)\s*$/);
      if(m){name=m[1].trim();quantity=parseInt(m[2]);return {name,quantity,sku}}
      m=line.match(/^(.+?)[\s\-–:]+(\d+)\s*$/);
      if(m&&m[1].trim()){name=m[1].trim();quantity=parseInt(m[2]);return {name,quantity,sku}}
      m=line.match(/^(\d+)\s*[xX×]?\s+(.+)$/);
      if(m){quantity=parseInt(m[1]);name=m[2].trim();return {name,quantity,sku}}
      name=line.trim();
      return {name,quantity,sku};
    })
    .filter(it=>it.name);
}

function showImportModal(parent,whId){
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"4px"}},"ייבוא פריטים"));
    m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"13px",marginBottom:"12px"}},'הדבק רשימה (למשל מוואטסאפ) או בחר קובץ CSV/טקסט — שורה אחת לכל פריט.'));

    const fileRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"10px"}});
    const fileBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"}},"בחר קובץ");
    const fileInput=el("input",{type:"file",accept:".csv,.txt,text/csv,text/plain",style:{display:"none"}});
    fileBtn.onclick=()=>fileInput.click();
    fileInput.addEventListener("change",()=>{
      const f=fileInput.files[0];if(!f)return;
      const reader=new FileReader();
      reader.onload=()=>{ta.value=reader.result};
      reader.readAsText(f,"UTF-8");
    });
    fileRow.append(fileBtn,fileInput);
    m.appendChild(fileRow);

    const ta=el("textarea",{className:"app-input",rows:"6",placeholder:"לדוגמה:\nחולצה (5)\nמכנס - 3\n2 כובעים",style:{direction:"rtl",lineHeight:"1.7",fontSize:"14px",marginBottom:"12px"}});
    m.appendChild(ta);

    const previewWrap=el("div",{style:{display:"none",marginBottom:"10px",maxHeight:"300px",overflowY:"auto"}});
    m.appendChild(previewWrap);

    const err=el("p",{style:{color:"var(--danger)",fontSize:"13px",minHeight:"18px"}});
    m.appendChild(err);

    let mode="edit";
    let parsedRows=[];
    let updMode="replace"; // what to do with quantities of EXISTING items: replace | add
    const byName=new Map(); // normalized item name -> existing item id (this warehouse)

    const matchCounts=()=>{
      const rows=parsedRows.filter(r=>r.name&&r.name.trim());
      const upd=rows.filter(r=>r.existingId).length;
      return {upd,neu:rows.length-upd};
    };
    const refreshMainLabel=()=>{
      const{upd,neu}=matchCounts();
      mainBtn.textContent=upd?`ייבא: ${neu} חדשים, ${upd} עדכונים`:`ייבא ${neu} פריטים`;
    };

    function renderPreview(){
      previewWrap.innerHTML="";
      // Imported names are matched against the warehouse's existing items —
      // matches UPDATE the item instead of creating a duplicate.
      const{upd}=matchCounts();
      if(upd>0){
        const bar=el("div",{style:{marginBottom:"10px"}});
        bar.appendChild(el("div",{style:{fontSize:"12px",color:"var(--text-sec)",marginBottom:"6px"}},"פריטים קיימים — מה לעשות עם הכמות?"));
        const opts=el("div",{style:{display:"flex",gap:"6px"}});
        const mk=(val,label)=>el("button",{className:"toolbar-btn"+(updMode===val?" active":""),onClick:()=>{updMode=val;renderPreview()}},label);
        opts.append(mk("replace","עדכן לכמות שבייבוא"),mk("add","הוסף לכמות הקיימת"));
        bar.appendChild(opts);
        previewWrap.appendChild(bar);
      }
      parsedRows.forEach((row,idx)=>{
        const rowEl=el("div",{style:{display:"flex",gap:"6px",marginBottom:"6px",alignItems:"center"}});
        const badge=el("span",{style:{fontSize:"10px",padding:"3px 8px",borderRadius:"8px",flexShrink:"0",fontWeight:"600",whiteSpace:"nowrap"}});
        const paintBadge=()=>{
          if(row.existingId){badge.textContent="עדכון";badge.style.background="var(--warning-bg)";badge.style.color="var(--warning)";badge.style.border="1px solid rgba(251,191,36,.3)"}
          else{badge.textContent="חדש";badge.style.background="var(--success-bg)";badge.style.color="var(--success)";badge.style.border="1px solid rgba(52,211,153,.2)"}
        };
        paintBadge();
        const nameI=el("input",{className:"app-input",style:{flex:"3",padding:"8px 10px",fontSize:"13px"}});
        nameI.value=row.name;
        nameI.addEventListener("input",()=>{
          row.name=nameI.value;
          // Re-match live: editing a name in the preview can turn an update
          // into a new item and vice versa.
          const ex=byName.get(row.name.trim().toLowerCase())||null;
          if(ex!==row.existingId){row.existingId=ex;paintBadge();refreshMainLabel()}
        });
        const qtyI=el("input",{className:"app-input",type:"number",inputMode:"numeric",style:{flex:"1",padding:"8px 10px",fontSize:"13px"}});
        qtyI.value=row.quantity;
        qtyI.addEventListener("input",()=>{row.quantity=parseInt(qtyI.value)||0});
        const rmBtn=el("button",{className:"toolbar-btn danger-hover",style:{padding:"6px",flex:"0 0 auto"}});
        rmBtn.appendChild(icon("close",12));
        rmBtn.onclick=()=>{parsedRows.splice(idx,1);renderPreview();refreshMainLabel()};
        rowEl.append(badge,nameI,qtyI,rmBtn);
        previewWrap.appendChild(rowEl);
      });
    }

    const btns=el("div",{style:{display:"flex",gap:"8px",marginTop:"8px"}});
    const cancelBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:close},"ביטול");
    const mainBtn=el("button",{className:"btn btn-primary",style:{flex:"1"}},"המשך");
    mainBtn.onclick=async()=>{
      err.textContent="";
      if(mode==="edit"){
        parsedRows=parseImportText(ta.value);
        if(!parsedRows.length){err.textContent="לא נמצאו פריטים לייבוא";return}
        byName.clear();
        currentItems.forEach(([id,item])=>{
          const k=(item.name||"").trim().toLowerCase();
          if(k&&!byName.has(k))byName.set(k,id);
        });
        parsedRows.forEach(r=>{r.existingId=byName.get(r.name.trim().toLowerCase())||null});
        renderPreview();
        mode="preview";
        ta.style.display="none";fileRow.style.display="none";
        previewWrap.style.display="";
        refreshMainLabel();
      }else{
        const rows=parsedRows.filter(r=>r.name&&r.name.trim());
        if(!rows.length){err.textContent="אין פריטים תקינים";return}
        mainBtn.disabled=true;mainBtn.textContent="מייבא...";
        try{
          const updates={};
          const base=Date.now(); // see the new-item comment: timestamp order
          let newCount=0;
          rows.forEach(r=>{
            const qty=r.quantity||0;
            if(r.existingId){
              const id=r.existingId;
              const entry=currentItems.find(([eid])=>eid===id);
              const curQ=entry?(entry[1].quantity||0):0;
              if(r.sku&&r.sku.trim())updates[`items/${id}/sku`]=r.sku.trim();
              if(updMode==="add"){
                if(qty>0){
                  updates[`items/${id}/quantity`]=FB.increment(qty);
                  updates[`items/${id}/history/${genId()}`]={action:"הוספה (ייבוא)",amount:qty,result:curQ+qty,by:currentUser.displayName,date:new Date().toISOString()};
                }
              }else if(qty!==curQ){
                updates[`items/${id}/quantity`]=qty;
                updates[`items/${id}/history/${genId()}`]={action:"עדכון (ייבוא)",amount:Math.abs(qty-curQ),result:qty,by:currentUser.displayName,date:new Date().toISOString()};
              }
            }else{
              const id=genId();
              const itemData={name:r.name.trim(),quantity:qty,order:base+(newCount++),
                history:{[genId()]:{action:"נוצר (ייבוא)",amount:qty,by:currentUser.displayName,date:new Date().toISOString()}}};
              if(r.sku&&r.sku.trim())itemData.sku=r.sku.trim();
              updates[`items/${id}`]=itemData;
            }
          });
          if(Object.keys(updates).length===0){close();return}
          await dbUpdate(`warehouses/${whId}`,updates);
          close();
        }catch(e){err.textContent="שגיאה בייבוא — נסה שוב";mainBtn.disabled=false;refreshMainLabel()}
      }
    };
    btns.append(cancelBtn,mainBtn);m.appendChild(btns);
  });
}

// ═══════════ STOCK COUNT MODE ═══════════
// Guided periodic stocktake: walks the warehouse item-by-item in the list
// order. Confirming keeps the recorded quantity; typing a different number
// corrects it — written IMMEDIATELY with a "ספירה" history entry, so closing
// mid-way loses nothing that was already confirmed.
function showStockCountModal(parent,whId){
  const list=[...currentItems].sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  showModal(parent,(m,close)=>{
    m.appendChild(el("h3",{style:{marginBottom:"2px"}},"ספירת מלאי"));
    if(!list.length){
      m.appendChild(el("p",{style:{color:"var(--text-sec)",fontSize:"14px",margin:"12px 0"}},"אין פריטים לספירה"));
      m.appendChild(el("button",{className:"btn btn-ghost",style:{width:"100%"},onClick:close},"סגור"));
      return;
    }
    const prog=el("p",{style:{color:"var(--text-muted)",fontSize:"12px",marginBottom:"10px"}});
    const barWrap=el("div",{style:{height:"4px",background:"var(--border)",borderRadius:"2px",marginBottom:"16px",overflow:"hidden"}});
    const bar=el("div",{style:{height:"100%",width:"0%",background:"var(--accent)",borderRadius:"2px",transition:"width .25s ease"}});
    barWrap.appendChild(bar);
    const body=el("div");
    m.append(prog,barWrap,body);
    let idx=0,adjusted=0,confirmed=0,skipped=0;
    const st=list.map(()=>null); // per-item outcome: 'ok' | 'adj' | 'skip'

    function renderSummary(){
      body.innerHTML="";prog.textContent="";bar.style.width="100%";
      body.appendChild(el("p",{style:{fontSize:"15px",fontWeight:"600",marginBottom:"6px"}},"הספירה הושלמה"));
      body.appendChild(el("p",{style:{fontSize:"13px",color:"var(--text-sec)",marginBottom:"16px"}},`${confirmed} אושרו · ${adjusted} תוקנו · ${skipped} דולגו`));
      body.appendChild(el("button",{className:"btn btn-primary",style:{width:"100%"},onClick:close},"סיום"));
    }

    function renderStep(){
      if(idx>=list.length){renderSummary();return}
      const[itemId,item]=list[idx];
      prog.textContent=`פריט ${idx+1} מתוך ${list.length}`;
      bar.style.width=(idx/list.length*100)+"%";
      body.innerHTML="";
      const card=el("div",{style:{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"14px",padding:"14px 16px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"12px"}});
      const thumbSrc=item.thumb||item.image;
      if(thumbSrc)card.appendChild(el("img",{src:thumbSrc,className:"item-thumb"}));
      const info=el("div",{style:{flex:"1",minWidth:"0"}});
      info.appendChild(el("div",{style:{fontSize:"17px",fontWeight:"600"}},item.name));
      if(item.sku)info.appendChild(el("div",{style:{fontSize:"11px",color:"var(--text-muted)",marginTop:"2px"}},`מק"ט: ${item.sku}`));
      if(item.note)info.appendChild(el("div",{className:"note-text"},item.note));
      info.appendChild(el("div",{style:{fontSize:"13px",color:"var(--text-sec)",marginTop:"6px"}},`כמות רשומה: ${item.quantity||0}`));
      card.appendChild(info);
      body.appendChild(card);
      const qi=el("input",{className:"app-input",type:"number",inputMode:"numeric",style:{fontSize:"22px",textAlign:"center",fontWeight:"700",marginBottom:"10px"}});
      qi.value=item.quantity||0;
      body.appendChild(qi);
      const err=el("p",{style:{color:"var(--danger)",fontSize:"12px",minHeight:"16px",margin:"0 0 6px"}});
      body.appendChild(err);
      const row=el("div",{style:{display:"flex",gap:"8px"}});
      const backBtn=el("button",{className:"btn btn-ghost",style:{flex:"0 0 auto",padding:"12px 14px",display:idx>0?"flex":"none"},onClick:()=>{
        idx--;
        const p=st[idx];
        if(p==="ok")confirmed--;else if(p==="adj")adjusted--;else if(p==="skip")skipped--;
        st[idx]=null;
        renderStep();
      }});
      backBtn.appendChild(icon("forward",16));
      const skipBtn=el("button",{className:"btn btn-ghost",style:{flex:"1"},onClick:()=>{st[idx]="skip";skipped++;idx++;renderStep()}},"דלג");
      const okBtn=el("button",{className:"btn btn-primary",style:{flex:"2"},onClick:async()=>{
        const v=parseInt(qi.value);
        if(isNaN(v)||v<0){err.textContent="הכנס כמות תקינה";return}
        okBtn.disabled=true;
        try{
          const cur=item.quantity||0;
          if(v!==cur){
            await dbUpdate(`warehouses/${whId}`,{
              [`items/${itemId}/quantity`]:v,
              [`items/${itemId}/history/${genId()}`]:{action:"ספירה",amount:Math.abs(v-cur),result:v,by:currentUser.displayName,date:new Date().toISOString()}
            });
            item.quantity=v;
            st[idx]="adj";adjusted++;
          }else{st[idx]="ok";confirmed++}
          idx++;renderStep();
        }catch(e){err.textContent="שגיאה בשמירה — נסה שוב";okBtn.disabled=false}
      }},"אשר והמשך");
      row.append(backBtn,skipBtn,okBtn);
      body.appendChild(row);
      qi.addEventListener("keydown",e=>{if(e.key==="Enter")okBtn.click()});
      setTimeout(()=>{qi.focus();qi.select()},60);
    }
    renderStep();
  });
}
